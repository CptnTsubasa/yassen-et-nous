      <button class="opt" aria-pressed="${s.style === "secret"}" data-a="setup" data-k="style" data-v="secret"><b>Réponses secrètes</b><span>Chacun écrit ou vote en cachette, un écran masque la réponse, puis on révèle tout ensemble.</span></button>
      ${Store.backend === "shared"
        ? `<button class="opt" aria-pressed="${s.style === "distance"}" data-a="setup" data-k="style" data-v="distance"><b>À distance</b><span>${esc(fr("Chacun sur son téléphone, même loin l'un de l'autre. Les réponses s'affichent en direct sur vos deux écrans."))}</span></button>`
        : `<button class="opt" disabled aria-disabled="true"><b>À distance</b><span>${esc(fr(Shared.available() ? "Créez d'abord votre espace commun dans les Réglages." : "Deux téléphones reliés : prévu pour une prochaine version."))}</span></button>`}
    </div>
  </div>
  ${rulesHtml(setupRules(s), "Comment on joue")}
  <p class="small muted">${n} cartes · ${pace}${s.mode === "qui" ? " · ça va vite, c'est voulu" : ""}</p>
  <button class="btn wide c" style="${cvar(m.c)}" data-a="start">C'est parti</button>`;
}

function cardHtml(c, g) {
  const m = CAT[c.cat];
  const fav = isFav(c.id);
  let forLine = "";
  if (g) {
    if (g.flow === "guess") forLine = c.type === "devinette" ? `${esc(nm(g.T))} demande à ${esc(nm(other(g.T)))} :` : `Question pour ${esc(nm(g.T))}`;
    else if (g.flow === "both") forLine = "Pour vous deux";
    else if (g.flow === "idea") forLine = "À imaginer ensemble";
    else if (g.flow === "pick") forLine = "Votez en secret";
  }
  const meta = c.type === "defi" ? `<div class="meta"><span class="badge">${DUREE[c.duree]}</span><span class="badge">${BUDGET[c.budget]}</span><span class="badge">${LIEU[c.lieu]}</span></div>` : "<span></span>";
  return `<article class="card" style="${cvar(m.c)}">
    <header class="card-band"><span class="suit" aria-hidden="true">${m.glyph}</span><span>${esc(m.label)}</span><span class="tone">${c.custom ? "Carte de " + esc(nm(c.from)) : c.type === "defi" ? AMB[c.amb] : TONE[c.tone]}</span>
      <button class="fav" data-a="fav" data-id="${c.id}" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${fav ? "★" : "☆"}</button></header>
    <div class="card-body">${forLine ? `<p class="card-for">${forLine}</p>` : ""}<p class="card-text">${esc(c.text)}</p></div>
    <footer class="card-foot">${meta}<span class="flip" aria-hidden="true">${m.glyph}</span></footer>
  </article>`;
}
const rulesHtml = (list, title = "Les règles") => `<div class="panel"><h2 class="sec">${title}</h2><ol class="rules">${list.map(r => `<li>${esc(fr(r))}</li>`).join("")}</ol></div>`;
function setupRules(s) {
  const joker = "Le joker est toujours là : on passe une carte sans avoir à se justifier.";
  if (s.style === "distance") {
    const d = {
      questions: ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Chacun écrit de son côté, sur son téléphone : la prédiction pour l'un, la vraie réponse pour l'autre.", "Dès que vous avez répondu tous les deux, les réponses s'affichent en même temps sur vos deux écrans.", "Ensuite, parlez-en : en appel, en vocal ou par message."],
      qui: ["Une affirmation s'affiche sur vos deux téléphones.", "Chacun vote de son côté pour la personne qui correspond le mieux. On a le droit de voter pour soi.", "Les deux votes s'affichent ensemble, puis vous plaidez votre cause.", "Pas de points, pas de classement : seulement des fous rires."],
      histoire: ["Chaque carte est une question pour vous deux. Chacun écrit sa réponse sur son téléphone.", "Les réponses s'affichent ensemble dès que vous avez répondu tous les deux.", "Pour garder vos réponses dans l'album, chacun doit dire oui de son côté."],
      etsi: ["Chaque carte propose un scénario. Chacun écrit son idée sur son téléphone.", "Les idées s'affichent ensemble. Celle qui vous plaît peut rejoindre « Notre prochaine aventure »."],
      surprise: ["Le jeu pioche dans tous les modes selon votre humeur.", "Chacun répond ou vote sur son téléphone, et tout s'affiche en même temps chez vous deux."]
    }[s.mode] || [];
    return [...d, "La partie apparaît aussi sur l'autre téléphone : il suffit de toucher « Rejoindre la partie » sur l'accueil.", "N'importe lequel de vous deux peut passer à la carte suivante.", joker];
  }
  const sec = s.style === "secret";
  const r = {
    questions: sec
      ? ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine écrit sa prédiction en cachette, puis passe le téléphone.", "L'autre écrit sa vraie réponse, toujours en cachette.", "Vous révélez les deux en même temps, puis chacun explique son choix."]
      : ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine annonce sa prédiction à voix haute.", "L'autre donne sa vraie réponse.", "Vous en parlez : d'où vient la prédiction, qu'est-ce qui surprend ?"],
    qui: sec
      ? ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Chacun vote en cachette pour la personne qui correspond le mieux. On a le droit de voter pour soi.", "Les deux votes sont révélés ensemble, puis vous plaidez votre cause.", "Pas de points, pas de classement : seulement des fous rires."]
      : ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Lancez le compte à rebours : à « Pointez ! », chacun pointe du doigt la personne qui correspond le mieux. On a le droit de se désigner.", "Vous plaidez votre cause, exemples à l'appui.", "Pas de points, pas de classement : seulement des fous rires."],
    histoire: [sec ? "Chaque carte est une question pour vous deux. Chacun écrit sa réponse en cachette, puis vous révélez ensemble." : "Chaque carte est une question pour vous deux. Chacun répond à voix haute, à son tour.",
      "Prenez votre temps : ici, on raconte plus qu'on ne répond.", "Si vous êtes d'accord tous les deux, vous gardez vos réponses dans l'album."],
    etsi: [sec ? "Chaque carte propose un scénario. Chacun écrit son idée en cachette, puis vous les découvrez ensemble." : "Chaque carte propose un scénario. Imaginez la réponse ensemble, chacun apporte ses idées.",
      "Une idée vous donne vraiment envie ? Ajoutez-la à « Notre prochaine aventure » pour la vivre en vrai."],
    surprise: ["Le jeu pioche dans tous les modes (questions, devinettes, votes, souvenirs, scénarios, petits défis), selon votre humeur.", "Chaque carte affiche ses propres consignes, étape par étape."]
  }[s.mode] || [];
  return [...r, "Le joker est toujours là : on passe une carte sans avoir à se justifier."];
}
const instr = (label, txt) => `<div class="instr"><b>${esc(label)}</b><p>${txt}</p></div>`;
const skipLink = () => `<div class="joker"><button class="link" data-a="g-skip">Joker : on passe cette carte, sans explication</button></div>`;
const nextBtn = (label = "Carte suivante") => `<button class="btn wide" data-a="g-next">${label}</button>`;

function elapsed() {
  if (!S.game) return "";
  const s = Math.floor((Date.now() - S.game.startAt) / 1000);
  return Math.floor(s / 60) + ":" + pad(s % 60);
}

function gameView() {
  const g = S.game;
  if (g.phase === "end") return endView();
  const c = CARDS[g.deck[g.i]];
  const single = g.deck.length === 1;
  const head = `<div class="g-head"><button class="icon-btn" data-a="g-quit-ask" aria-label="Quitter la partie">×</button>
    <div class="g-prog">${single ? "<span>Une carte, juste pour vous</span>" : `<span>Carte ${g.i + 1} sur ${g.deck.length}</span><div class="bar"><i style="width:${(g.i / g.deck.length) * 100}%"></i></div>`}</div>
    <span class="g-timer" id="g-timer">${elapsed()}</span></div>`;
  const last = g.i + 1 >= g.deck.length;
  const nextLabel = last ? "Terminer la partie" : "Carte suivante";
  const slots = slotsOf(g);
  const col = cvar(CAT[c.cat].c);

  // Réponses secrètes : masquage puis saisie, emplacement par emplacement.
  if (g.phase === "hand") {
    const s = slots[g.slot];
    return head + `<section class="curtain" style="${col}">
      <p>Passe le téléphone à</p><p class="who">${esc(nm(s.who))}</p>
      <p>${esc(nm(other(s.who)))}, on détourne les yeux le temps ${s.kind === "pick" ? "du vote" : "de la réponse"}.</p>
      <button class="btn" data-a="g-iam">C'est moi, ${esc(nm(s.who))}</button></section>` + skipLink();
  }
  if (g.phase === "input") {
    const s = slots[g.slot];
    if (s.kind === "pick") {
      return head + cardHtml(c, g) + `<div class="stack" style="${col}"><p class="lbl">${esc(nm(s.who))}, ton vote secret :</p>
        <div class="pickers"><button class="btn c" data-a="g-pick" data-v="a">${esc(nm("a"))}</button><button class="btn c" data-a="g-pick" data-v="b">${esc(nm("b"))}</button></div></div>` + skipLink();
    }
    const id = `ans-${g.i}-${g.slot}`;
    return head + cardHtml(c, g) + `<div class="field"><label for="${id}">${esc(nm(s.who))} · ${esc(s.label)}</label>
      <textarea class="hand" id="${id}" data-d placeholder="Quelques mots suffisent…">${dv(id)}</textarea></div>
      <button class="btn wide" data-a="g-submit">Valider en secret</button>` + skipLink();
  }
  if (g.phase === "ready") {
    return head + `<section class="curtain" style="${col}"><p class="who">Tout est prêt</p>
      <p>Installez-vous côte à côte. Les réponses vont apparaître en même temps.</p>
      <button class="btn" data-a="g-reveal">Révéler ensemble</button></section>` + skipLink();
  }
  if (g.phase === "reveal") return head + cardHtml(c, g) + revealView(g, c, slots, nextLabel);

  // Mode partagé et défis.
  if (g.flow === "guess") {
    const T = esc(nm(g.T)), G = esc(nm(other(g.T)));
    if (g.phase === "g") return head + cardHtml(c, g) + instr("Étape 1 · la prédiction", `${G}, devine ce que ${T} va répondre et dis-le à voix haute.`) + `<button class="btn wide" data-a="g-step" data-v="t">Prédiction faite</button>` + skipLink();
    if (g.phase === "t") return head + cardHtml(c, g) + instr("Étape 2 · la vraie réponse", `${T}, à toi de répondre, en toute sincérité.`) + `<button class="btn wide" data-a="g-step" data-v="talk">Réponse donnée</button>` + skipLink();
    return head + cardHtml(c, g) + instr("Étape 3 · on en parle", esc(g.talk) + MISS) + afterActions(g, c) + nextBtn(nextLabel);
  }
  if (g.flow === "pick") {
    if (g.phase === "count") return head + cardHtml(c, g) + instr("Vote à main levée", "Au signal, pointez du doigt en même temps la personne qui correspond le mieux.") + `<button class="btn wide" data-a="g-count">Lancer le compte à rebours</button>` + skipLink();
    if (g.phase === "counting") return head + cardHtml(c, g) + `<p class="count" style="${col}" aria-live="assertive">${g.count > 0 ? g.count : "Pointez !"}</p>`;
    return head + cardHtml(c, g) + instr("Alors, d'accord ?", esc(g.talk)) + nextBtn(nextLabel);
  }
  if (g.flow === "both") {
    const ia = `both-${g.i}-a`, ib = `both-${g.i}-b`;
    return head + cardHtml(c, g) + instr("À vous", "Répondez chacun votre tour, à voix haute. Notez quelques mots si vous voulez garder ce souvenir dans l'album.") + `
      <div class="field"><label for="${ia}">${esc(nm("a"))}</label><textarea class="hand" id="${ia}" data-d placeholder="Facultatif">${dv(ia)}</textarea></div>
      <div class="field"><label for="${ib}">${esc(nm("b"))}</label><textarea class="hand" id="${ib}" data-d placeholder="Facultatif">${dv(ib)}</textarea></div>
      <div class="actions">${albumCtl(g, "g-album-shared")}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  if (g.flow === "idea") {
    const id = `idea-${g.i}`;
    return head + cardHtml(c, g) + instr("À vous", "Chacun lance une idée, puis construisez la meilleure version ensemble.") + `
      <div class="field"><label for="${id}">Notre idée</label><textarea class="hand" id="${id}" data-d placeholder="Facultatif">${dv(id)}</textarea></div>
      <div class="actions">${g.saved.idea ? `<p class="small muted">Ajoutée à « Notre prochaine aventure » ✓</p>` : `<button class="btn ghost wide" data-a="g-idea-shared">Ajouter à nos aventures</button>`}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  // Défi
  return head + cardHtml(c, g) + instr(c.duree <= 15 ? "Maintenant ?" : "À programmer", c.duree <= 15 ? "Ce défi se relève tout de suite. Ou gardez-le pour plus tard." : "Ce défi demande un peu de temps : ajoutez-le à vos aventures pour le planifier.") + `
    <div class="actions"><div class="row">
      ${g.saved.done ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${col}" data-a="g-defi-done">Défi relevé</button>`}
      ${g.saved.later ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="g-defi-later">Pour plus tard</button>`}
    </div>${nextBtn(nextLabel)}</div>`;
}

function revealView(g, c, slots, nextLabel) {
  const col = cvar(CAT[c.cat].c);
  let body = "";
  if (g.flow === "pick") {
    const a = g.ans.a, b = g.ans.b;
    body = `<div class="reveal" style="${col}">
      <div class="rv"><b>${esc(nm("a"))} a voté</b><p class="pick">${esc(nm(a))}</p></div>
      <div class="rv"><b>${esc(nm("b"))} a voté</b><p class="pick">${esc(nm(b))}</p></div></div>
      <p class="verdict" style="${col}">${a === b ? `Même vote : c'est ${esc(nm(a))} !` : "Avis partagés… à vous de plaider !"}</p>
      ${instr("On en discute", esc(g.talk))}`;
  } else {
    body = `<div class="reveal">${slots.map(s => `<div class="rv"><b>${g.flow === "guess" ? (s.key === "guess" ? "Prédiction de " + esc(nm(s.who)) : "Réponse de " + esc(nm(s.who))) : esc(nm(s.who))}</b><p class="ans">${esc(g.ans[s.key])}</p></div>`).join("")}</div>`;
    if (g.flow === "guess") body += instr("On en parle", esc(g.talk) + MISS);
    if (g.flow === "both") body += instr("On en parle", "Qu'est-ce qui vous touche ou vous surprend dans la réponse de l'autre ?");
    if (g.flow === "idea") body += instr("On rêve un peu", "Laquelle de ces idées a envie de devenir réalité ?");
  }
  return body + afterActions(g, c) + nextBtn(nextLabel);
}

// Ce qu'on écrit en secret peut être intime : on ne le garde que si les deux sont d'accord.
function albumCtl(g, act) {
  if (g.saved.album) return `<p class="small muted">Gardé dans l'album ✓</p>`;
  if (g.saved.ask) return `<div class="confirm"><span>Vous êtes d'accord tous les deux pour garder ça ?</span><button class="btn" data-a="${act}">Oui, on garde</button><button class="btn ghost" data-a="g-album-no">Non, on laisse filer</button></div>`;
  return `<button class="btn ghost wide" data-a="g-album-ask">Garder dans l'album</button>`;
}
function afterActions(g, c) {
  const out = [];
  const canAlbum = c.cat === "his" && (g.flow === "both" || (g.flow === "guess" && g.style === "secret"));
  if (canAlbum) out.push(albumCtl(g, "g-album"));
  if (g.flow === "idea" && g.phase === "reveal") {
    ["a", "b"].forEach(k => out.push(g.saved["idea" + k] ? `<p class="small muted">Idée de ${esc(nm(k))} ajoutée aux aventures ✓</p>` : `<button class="btn ghost wide" data-a="g-idea" data-v="${k}">Ajouter l'idée de ${esc(nm(k))} aux aventures</button>`));
  }
  return out.length ? `<div class="actions">${out.join("")}</div>` : "";
}

function endView() {
  const g = S.game, st = g.stats;
  return `${layerHead("")}
  <div class="stack" style="text-align:center;justify-items:center;padding-top:20px">
    <p class="end-big">Joli moment</p>
    <p>${st.played} carte${st.played > 1 ? "s" : ""} jouée${st.played > 1 ? "s" : ""}${st.fresh ? `, dont ${st.fresh} ouverte${st.fresh > 1 ? "s" : ""} pour la première fois` : ""}.</p>
    <p class="muted small">Vos favoris, souvenirs et idées vous attendent dans la capsule et les aventures.</p>
  </div>
  <div class="actions">${g.setup && g.setup.mode !== "daily" ? `<button class="btn wide" data-a="replay-same">Rejouer</button>` : ""}<button class="btn ghost wide" data-a="close-layer">Retour à l'accueil</button></div>`;
}

/* Navigateur des défis (mode 3) */
function filteredDefis() {
  const f = S.df;
  return POOL.def.filter(id => {
    const c = CARDS[id];
    if (f.duree === "court" && c.duree > 5) return false;
    if (f.duree === "moyen" && (c.duree <= 5 || c.duree > 30)) return false;
    if (f.duree === "long" && c.duree < 60) return false;
    if (f.budget !== "all" && c.budget !== +f.budget) return false;
    if (f.amb !== "all" && c.amb !== f.amb) return false;
    if (f.lieu !== "all" && c.lieu !== f.lieu && c.lieu !== "x") return false;
    return true;
  });
}
function drawDefi() {
  const list = filteredDefis();
  if (!list.length) { S.dfCur = null; return; }
  const seen = seenSet(), pool = list.filter(id => id !== S.dfCur);
  const fresh = pool.filter(id => !seen.has(id) && !S.dfSeen.includes(id));
  S.dfCur = pickOne(fresh.length ? fresh : (pool.length ? pool : list));
  if (!S.dfSeen.includes(S.dfCur)) S.dfSeen.push(S.dfCur);
}
function defisView() {
  const f = S.df, list = filteredDefis();
  if (!S.dfCur || !list.includes(S.dfCur)) drawDefi();
  const chip = (k, v, l) => `<button class="chip" aria-pressed="${f[k] === v}" data-a="df" data-k="${k}" data-v="${v}">${esc(l)}</button>`;
  const c = S.dfCur && CARDS[S.dfCur];
  const saved = S.dfSaved || {};
  return `${layerHead("")}
  <section class="setup-hero" style="${cvar(3)}"><span class="g" aria-hidden="true">${ico("flag")}</span><h1>Les défis complices</h1><p>Filtrez selon le temps, le budget et l'envie, puis tirez un défi.</p></section>
  ${rulesHtml(["Choisissez vos filtres : durée, budget, ambiance et lieu.", "Un défi est tiré au hasard parmi ceux qui correspondent. « Tirer un autre défi » pour en changer.", "« Défi relevé » le range dans votre capsule, « Pour plus tard » l'ajoute à vos aventures."], "Comment on joue")}
  <div class="stack"><h2 class="sec">Durée</h2><div class="chips">${chip("duree", "all", "Toutes")}${chip("duree", "court", "5 min")}${chip("duree", "moyen", "15 à 30 min")}${chip("duree", "long", "Une soirée")}</div></div>
  <div class="stack"><h2 class="sec">Budget</h2><div class="chips">${chip("budget", "all", "Tous")}${BUDGET.map((b, i) => chip("budget", String(i), b)).join("")}</div></div>
  <div class="stack"><h2 class="sec">Ambiance</h2><div class="chips">${chip("amb", "all", "Toutes")}${Object.entries(AMB).map(([k, l]) => chip("amb", k, l)).join("")}</div></div>
  <div class="stack"><h2 class="sec">Où ?</h2><div class="chips">${chip("lieu", "all", "Peu importe")}${chip("lieu", "m", "À la maison")}${chip("lieu", "s", "On sort")}</div></div>
  <p class="small muted">${list.length} défi${list.length > 1 ? "s" : ""} correspond${list.length > 1 ? "ent" : ""} à vos envies.</p>
  ${c ? cardHtml(c) + `<div class="actions"><div class="row">
      ${saved[c.id + "done"] ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${cvar(3)}" data-a="df-done">Défi relevé</button>`}
      ${saved[c.id + "later"] ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="df-later">Pour plus tard</button>`}
    </div><button class="btn line wide" data-a="df-draw">Tirer un autre défi</button></div>
    <details><summary>Voir la liste des ${list.length} défis</summary><ul class="dlist">${list.map(id => `<li><button data-a="df-pick" data-id="${id}">${esc(CARDS[id].text)}</button></li>`).join("")}</ul></details>`
    : empty("Aucun défi ne coche toutes ces cases", "Assouplissez un filtre pour en voir d'autres.")}`;
}

/* Formulaires */

  const name = S.layer.name;

  if (name === "yassen") return yassenSheet();
  if (name === "notifs") return notifSheet();

    <p>${esc(fr(`L'autre téléphone a déjà choisi d'être ${nm(k)}.`))}</p>
    <p class="small muted">${esc(fr("Si vous êtes deux sur le même prénom, les avatars et les tours de jeu se mélangent. Si l'autre a changé de téléphone, choisis quand même ton prénom."))}</p>
    <div class="actions"><button class="btn wide" data-a="claim-other">Je suis ${esc(nm(other(k)))}</button><button class="btn ghost wide" data-a="claim-yes">Je suis bien ${esc(nm(k))}</button></div>`; }
  if (name === "invite") return `${layerHead("Rejoindre un autre espace ?")}
    <p>${esc(fr("Ce téléphone est déjà relié à un espace commun. Ce lien mène à un autre espace."))}</p>
    <p class="small muted">${esc(fr("Si tu continues, ce téléphone affichera l'autre espace. Rien n'est effacé ni mélangé : l'espace actuel reste intact, et tu pourras y revenir depuis les réglages."))}</p>
    <div class="actions"><button class="btn wide" data-a="inv-yes">Rejoindre l'autre espace</button><button class="btn ghost wide" data-a="inv-no">Rester ici</button></div>`;
  const whoSelect = (id, def) => `<select id="${id}" data-d>${["a", "b"].map(k => `<option value="${k}" ${draft(id, def) === k ? "selected" : ""}>${esc(nm(k))}</option>`).join("")}</select>`;
  if (name === "names") {
    const c = couple();
    return `${layerHead("Réglages")}
    <p class="muted">Ils apparaissent sur les cartes, les votes et l'écran de masquage.</p>

function startArc(game) {
  const A = { game, i: 0, score: 0, count: 0, first: Math.random() < 0.5 ? "a" : "b" };
  if (game === "tp") { A.deck = shuffle(TP.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "flags") { A.deck = shuffle(FLAGS.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "onde") { A.deck = shuffle(SPECTRA.map((_, i) => i)).slice(0, 6); ondeRound(A); }
  else if (game === "synchro") { A.prompt = pickOne(SYNC); A.round = 1; A.phase = "think"; }
  A.start = A.phase; A.phase = "rules";
  S.arc = A;
}
const turnOf = A => (A.i % 2 === 0 ? A.first : other(A.first));
function ondeRound(A) { A.target = 5 + Math.floor(Math.random() * 91); A.guess = 50; A.pts = 0; A.phase = "hand"; }
function arcCount(next) {
  const A = S.arc; A.phase = "count"; A.count = 3; A.after = next;
  const tick = () => {
    if (S.arc !== A || A.phase !== "count") return;
    A.count--;
    if (A.count < 0) { A.phase = next; render(true); return; }
    render(true); setTimeout(tick, A.count === 0 ? 1000 : 800);
  };
  setTimeout(tick, 800);
}
function specHtml(A, showTarget, showNeedle) {
  const band = (w, cls) => `<i class="band ${cls}" style="left:${A.target}%;width:${w * 2}%"></i>`;
  return `<div class="spec" aria-hidden="true">${showTarget ? band(16, "b2") + band(10, "b3") + band(4, "b4") : ""}${showNeedle ? `<i class="needle" id="needle" style="left:${A.guess}%"></i>` : ""}</div>`;
}
const curtainHtml = (col, pre, who, sub, act) => `<section class="curtain" style="${col}"><p>${pre}</p><p class="who">${esc(nm(who))}</p><p>${sub}</p><button class="btn" data-a="${act}">C'est moi, ${esc(nm(who))}</button></section>`;

function arcadeView() {
  const A = S.arc, col = cvar(7);
  if (!A) return `${layerHead("")}
    <section class="setup-hero" style="${col}"><span class="g" aria-hidden="true">${ico("gamepad")}</span><h1>Arcade</h1><p>${esc(fr("Quatre mini-jeux rapides, à jouer côte à côte. Ici, on gagne ensemble ou on rit ensemble."))}</p></section>
    ${Store.backend === "shared" ? `<div class="stack"><h2 class="sec">Où jouez-vous ?</h2><div class="chips"><button class="chip" aria-pressed="${!S.arcRemote}" data-a="arc-where" data-v="">Sur ce téléphone</button><button class="chip" aria-pressed="${!!S.arcRemote}" data-a="arc-where" data-v="1">À distance, chacun sur son téléphone</button></div></div>` : ""}
    <div class="list" style="${col}">${Object.entries(ARCADE).map(([k, g]) => `<button class="mode-row" data-a="arc-start" data-g="${k}"><span class="icon-tile">${ico(ARC_ICON[k])}</span><span class="mode-txt"><b>${esc(fr(g.title))}</b><span>${esc(fr(g.desc))}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`;
  const G = ARCADE[A.game], total = A.deck ? A.deck.length : 0;
  const prog = A.game === "synchro" ? `<span>${esc(G.title)} · manche ${A.round}</span>`
    : `<span>${esc(fr(G.title))} · ${Math.min(A.i + 1, total)} sur ${total}</span><div class="bar"><i style="width:${(A.i / total) * 100}%"></i></div>`;
  const right = A.game === "onde" ? `<span class="g-timer">${A.score} pt${A.score > 1 ? "s" : ""}</span>` : "";
  const head = `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog">${prog}</div>${right}</div>`;
  const endScr = (big, txt) => `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog"><span>${esc(fr(G.title))}</span></div></div>
    <div class="stack" style="text-align:center;justify-items:center;padding-top:24px"><p class="end-big">${esc(fr(big))}</p><p>${esc(fr(txt))}</p></div>
    <div class="actions"><button class="btn wide c" style="${col}" data-a="arc-replay">Rejouer</button><button class="btn line wide" data-a="arc-menu">Autres mini-jeux</button></div>`;
  const countHtml = `<p class="count" style="${col}" aria-live="assertive">${A.count > 0 ? A.count : fr("Dites-le !")}</p>`;
  if (A.phase === "rules") return head + rulesHtml(G.rules) + `<button class="btn wide c" style="${col}" data-a="arc-begin">C'est parti</button>`;

  if (A.game === "tp" || A.game === "flags") {
    if (A.phase === "end") return endScr("C'était la dernière !", "Un choix vous a surpris ? C'est le bon moment pour en reparler.");
    const q = A.game === "tp"
      ? `<div class="duel"><div class="side" style="${cvar(5)}">${esc(TP[A.deck[A.i]][0])}</div><span class="ou">ou</span><div class="side" style="${cvar(6)}">${esc(TP[A.deck[A.i]][1])}</div></div>`
      : `<p class="flag-q">${esc(FLAGS[A.deck[A.i]])}</p><div class="flag-pair"><div style="background:var(--m3);color:var(--on-m3)">Green flag</div><div style="background:var(--m1);color:var(--on-m1)">Red flag</div></div>`;
    if (A.phase === "count") return head + q + countHtml;
    if (A.phase === "say") return head + q + instr(fr(A.game === "tp" ? "Pas le même choix ?" : "Pas d'accord ?"),
      esc(fr(A.game === "tp" ? "Vingt secondes chacun pour convaincre l'autre. La mauvaise foi est autorisée." : "Plaidez votre cause. Les exemples vécus comptent double.")))
      + `<button class="btn wide" data-a="arc-next">${A.i + 1 >= total ? "Terminer" : "Suivant"}</button>`;
    return head + q + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="say">3, 2, 1… répondez ensemble</button><div class="joker"><button class="link" data-a="arc-next">Passer</button></div>`;
  }

  if (A.game === "onde") {
    if (A.phase === "end") {
      const max = total * 4, r = A.score / max;
      return endScr(`${A.score} / ${max}`, r >= 0.75 ? "Télépathie confirmée." : r >= 0.5 ? "Vous êtes clairement sur la même fréquence." : r >= 0.25 ? "Quelques parasites sur la ligne, mais de très bons indices." : "La fréquence se cherche encore. Les indices, eux, étaient mémorables.");
    }
    const [L, R] = SPECTRA[A.deck[A.i]], g = turnOf(A), o = other(g);
    const labels = `<div class="spec-labels"><span>← ${esc(L)}</span><span>${esc(R)} →</span></div>`;
    if (A.phase === "hand") return head + curtainHtml(col, "Passe le téléphone à", g, `${esc(nm(o))}, ne regarde pas : ${esc(nm(g))} va découvrir la cible.`, "onde-iam");
    if (A.phase === "target") return head + specHtml(A, true, false) + labels
      + instr("Ton indice", esc(fr(`Trouve un exemple (un objet, un film, une situation…) qui se place pile dans la zone foncée, entre « ${L} » et « ${R} ». Dis-le à voix haute, une seule fois.`)))
      + `<button class="btn wide" data-a="onde-hide">J'ai mon indice : cacher la cible</button>`;
    if (A.phase === "guess") return head + specHtml(A, false, true) + labels
      + `<label class="lbl" for="onde-g">${esc(nm(o))}, place l'aiguille d'après l'indice de ${esc(nm(g))}</label><input type="range" id="onde-g" min="0" max="100" step="1" value="${A.guess}" aria-valuetext="${A.guess} sur 100">`
      + `<button class="btn wide c" style="${col}" data-a="onde-ok">Valider</button>`;
    const msg = ["Raté… mais l'indice valait le détour.", "", "Pas loin !", "Tout près !", "En plein dans le mille !"][A.pts];
    return head + specHtml(A, true, true) + labels + `<p class="verdict" style="${col}">+${A.pts} point${A.pts > 1 ? "s" : ""} · ${esc(fr(msg))}</p>`
      + `<button class="btn wide" data-a="onde-next">${A.i + 1 >= total ? "Voir le score" : "Manche suivante"}</button>`;
  }

  if (A.game === "synchro") {
    if (A.phase === "win") return endScr("Synchro !", `Le même mot en ${A.round} manche${A.round > 1 ? "s" : ""}. Vos cerveaux se sont trouvés.`);
    if (A.phase === "lost") return endScr("Presque…", "Pas de synchro cette fois, mais quel chemin pour y arriver. On retente ?");
    const box = `<div class="panel" style="text-align:center;${col}">${A.round === 1
      ? `<p class="card-for">Pensez chacun, sans rien dire, à…</p><p class="big-word">${esc(A.prompt)}</p>`
      : `<p class="card-for">Manche ${A.round}</p><p class="big-word" style="font-size:1.6rem">Un mot qui relie vos deux derniers mots</p>`}</div>`;
    if (A.phase === "count") return head + box + countHtml;
    if (A.phase === "said") return head + box + `<p class="lbl" style="text-align:center">${esc(fr("Alors, le même mot ?"))}</p><div class="actions"><div class="row"><button class="btn c" style="${col}" data-a="sync-same">Même mot !</button><button class="btn ghost" data-a="sync-diff">Pas encore</button></div></div>`;
    return head + box + instr("Comment jouer", esc(fr(A.round === 1
      ? "Au signal, dites votre mot en même temps. Si ce n'est pas le même, retenez les deux : à la manche suivante, chacun cherche un mot qui les relie."
      : "Retenez les deux mots qui viennent d'être dits, et cherchez chacun dans votre tête un mot qui fait le lien.")))
      + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="said">3, 2, 1… dites-le</button>`;
  }

  return "";
}

  } },
  { id: "boulangerie", title: "La boulangerie de minuit", mood: "Douceur · un brin de magie", c: 6, start: "lettre", nodes: {
    lettre: { t: "Une lettre de notaire vous apprend une nouvelle étonnante : vous héritez ensemble d'une petite boulangerie, rue des Lilas. Une seule condition : elle n'ouvre qu'à minuit, et chacune de ses pâtisseries exauce un tout petit vœu.",
      ch: [["Ouvrir dès ce soir", "minuit"], ["Lire d'abord le carnet de recettes", "carnet"]] },
    carnet: { t: "Le carnet est couvert d'annotations. « Croissant de l'audace : donne du courage pour une heure. Éclair du fou rire : à servir avec précaution. Chou de la mémoire : fait revivre un souvenir heureux. »",
      talk: "Si vous pouviez goûter l'une de ces pâtisseries maintenant, laquelle choisiriez-vous ?",
      ch: [["Goûter le chou de la mémoire", "chou"], ["Ouvrir la boutique, carnet sous le bras", "minuit"]] },
    chou: { t: "Une bouchée, et vous voilà de retour au jour de votre premier rendez-vous, comme dans un film. Vous vous voyez hésiter, sourire, chercher vos mots, et vous remarquez des détails que vous aviez oubliés.",
      talk: "Quel détail de votre premier rendez-vous vous revient en premier ?",
      ch: [["Revenir à la boulangerie", "minuit"]] },
    minuit: { t: "Minuit sonne. La clochette tinte : votre premier client est un vieux monsieur très élégant. Il cherche « quelque chose pour trouver le courage d'inviter sa voisine à prendre un café ».",
      ch: [["Lui servir le croissant de l'audace", "audace"], ["Lui conseiller d'offrir la pâtisserie plutôt que de la manger", "offrir"]] },
    audace: { t: "Il croque, se redresse et repart d'un pas décidé. Dix minutes plus tard, des applaudissements résonnent dans la rue. Deuxième cliente : une petite fille en pyjama qui n'arrive pas à dormir.",
      ch: [["Lui préparer un chocolat chaud nuage", "nuage"], ["Lui raconter une histoire pendant que la fournée cuit", "conte"]] },
    offrir: { t: "Il revient une heure plus tard, au bras de sa voisine, pour acheter deux parts de tarte. « Elle a dit oui à un deuxième café ! » Le bouche-à-oreille fait son effet : une file se forme devant la vitrine.",
      ch: [["Agrandir la boulangerie", "fin_grande"], ["Garder la boutique petite et secrète", "fin_secret"]] },
    nuage: { t: "Le chocolat flotte littéralement au-dessus de la tasse. La petite fille rit si fort que tout le quartier se réveille… et descend voir ce qui se passe.",
      ch: [["Improviser une fête dans la rue", "fin_fete"]] },
    conte: { t: "Vous inventez une histoire à deux voix : {a} commence une phrase, {b} la termine. La petite fille s'endort sur le comptoir, et sa mère vient la chercher avec un sourire reconnaissant.",
      talk: "Essayez pour de vrai : une minute d'histoire à deux voix, une phrase chacun.",
      ch: [["Fermer la boutique pour la nuit", "fin_aube"]] },
    fin_grande: { end: "La boulangerie des Lilas", t: "Un an plus tard, la file d'attente fait le tour du pâté de maisons. Vous avez gardé une recette rien que pour vous, celle que vous préparez chaque dimanche." },
    fin_secret: { end: "Le secret de minuit", t: "La boutique reste minuscule, connue seulement de celles et ceux qui en ont vraiment besoin. C'est votre secret, et vous le gardez précieusement." },
    fin_fete: { end: "La fête en pyjama", t: "Tout le quartier en pyjama, des chaises sur le trottoir, des chocolats nuages pour tout le monde. Vous dansez entre les tables jusqu'aux premières lueurs du jour." },
    fin_aube: { end: "La dernière fournée", t: "Au petit matin, vous partagez le dernier croissant, côte à côte sur le pas de la porte. Il n'exauce aucun vœu particulier. Vous n'en aviez pas besoin." }
  } },
  { id: "cupidon", title: "Cupidon.exe", mood: "Drôle · très 2026", c: 5, start: "app", nodes: {
    app: { sc: "salon", t: "Vendredi soir. Pour une fois, vous n'organisez rien : vous laissez Cupidon.exe, l'appli dont tout le monde parle, planifier votre soirée. Elle promet « le rendez-vous parfait, calculé par intelligence artificielle ». Premier message : « Bonsoir {a} et {b}. J'ai analysé vos 4 000 derniers messages. Petite question : vous préférez la surprise ou la sécurité ? »",
      talk: "Pour de vrai : vous préférez être surpris par l'autre, ou savoir à l'avance ce qui vous attend ?",
      ch: [["« La surprise ! »", "surprise"], ["« La sécurité, merci. »", "rassure"]] },
    surprise: { sc: "salon", t: "L'appli réfléchit trois secondes, puis : « Parfait. J'ai réservé un restaurant où l'on dîne dans le noir complet. Et j'ai déjà commandé pour vous. » Un livreur sonne avec deux masques de sommeil et un mot : « Faites-moi confiance. »",
      ch: [["Enfiler les masques et y aller", "noir"], ["Demander ce qu'elle a commandé, au juste", "menu"]] },
    menu: { sc: "salon", t: "« Le chef propose un menu basé sur vos recherches Google. » Vous blêmissez en même temps : vos recherches contiennent, entre autres, « comment cuire des pâtes sans casserole » et « est-ce normal de parler à son ficus ». L'appli ajoute : « Bonne nouvelle : le dessert, c'est du tiramisu. »",
      ch: [["Y aller quand même, par curiosité", "noir"], ["Désinstaller l'appli et improviser", "impro"]] },
    noir: { sc: "noir", t: "Dans le noir complet, on entend des couverts, des rires, et quelqu'un qui cherche son verre depuis dix minutes. Sans la vue, vous découvrez que {a} décrit chaque bouchée comme un critique gastronomique, et que le rire de {b} est encore plus contagieux dans l'obscurité.",
      talk: "Les yeux fermés, à quoi reconnaîtriez-vous l'autre en premier : sa voix, son parfum, son rire ?",
      ch: [["Rester jusqu'au dessert", "fin_tiramisu"]] },
    rassure: { sc: "resto", t: "« Compris. Programme rassurant : un restaurant italien, une balade, et retour avant minuit. » Tout se passe à merveille… jusqu'à ce que l'appli plante au milieu du repas. Sur l'écran, un seul message : « Mise à jour en cours. Improvisez. »",
      ch: [["Respirer un grand coup et improviser", "impro"], ["Attendre la mise à jour devant un deuxième dessert", "maj"]] },
    maj: { sc: "resto", t: "Quarante minutes et deux tiramisus plus tard, l'appli revient : « Désolée. J'ai compris que je ne pouvais pas calculer ce qui vous rend heureux. Vous, si. » Le serveur, qui a tout suivi, vous offre un café : « Ça arrive souvent, ici. »",
      ch: [["Finir la soirée sans aucun écran", "fin_sansecran"]] },
    impro: { sc: "rue", t: "Sans programme, vous marchez au hasard. Un néon rose clignote au bout de la rue : « Karaoké, soirée duos ». Juste à côté, un escalier mène à un toit d'où l'on voit toute la ville.",
      ch: [["Le karaoké, évidemment", "karaoke"], ["Le toit, pour la vue", "toit"]] },
    karaoke: { sc: "karaoke", t: "Le DJ vous tend deux micros. La salle scande déjà vos prénoms, ce qui est étrange puisque personne ne vous connaît. Il ne reste qu'à choisir la chanson.",
      talk: "Pour de vrai : quelle chanson chanteriez-vous en duo, sans la moindre honte ?",
      ch: [["Une grande ballade romantique", "fin_ballade"], ["Le tube le plus ringard possible", "fin_ringard"]] },
    toit: { sc: "toit", t: "Sur le toit, la ville scintille. Vos téléphones affichent 3 % de batterie. Pour la première fois de la soirée, personne ne vous dit quoi faire, et c'est exactement ce qu'il vous fallait.",
      talk: "Qu'est-ce que vous aimeriez vous dire, là, sans écran ni programme ?",
      ch: [["Rester là jusqu'à ce que les téléphones s'éteignent", "fin_toit"]] },
    fin_tiramisu: { end: "Le dîner à l'aveugle", sc: "resto", t: "Quand la lumière revient, vous avez de la sauce jusqu'au coude et le sourire jusqu'aux oreilles. Vous laissez cinq étoiles à l'appli, avec un commentaire : « Bien joué, mais le mérite revient au tiramisu. »" },
    fin_sansecran: { end: "Mise à jour terminée", sc: "toit", t: "Vous rangez les téléphones et finissez la soirée à refaire le monde sur un banc. La meilleure fonctionnalité de Cupidon.exe, finalement, c'était le bouton « Désinstaller »." },
    fin_ballade: { end: "La ballade", sc: "karaoke", t: "Vous chantez faux, mais avec une conviction qui force le respect. À la dernière note, toute la salle allume la lampe de son téléphone. Même l'appli, de loin, aurait applaudi." },
    fin_ringard: { end: "Le tube ringard", sc: "karaoke", t: "Chorégraphie improvisée, refrain hurlé, un inconnu qui vous rejoint au chœur : la vidéo fait le tour du groupe WhatsApp de vos amis avant minuit. Aucun regret." },
    fin_toit: { end: "Batterie 0 %", sc: "toit", t: "Les écrans s'éteignent l'un après l'autre. Il reste la ville, vos deux silhouettes et une conversation qui ne s'arrête plus. Aucune intelligence artificielle n'aurait trouvé mieux." }
  } },
  { id: "viral", title: "Viral malgré nous", mood: "Drôle · réseaux", c: 1, start: "video", nodes: {
    video: { sc: "metro", t: "Un mardi matin, dans le métro, {a} trébuche, rattrape {b} de justesse, et l'instant d'après vous voilà dans une pose digne d'un film de danse. Quelqu'un a filmé. Le soir même, la vidéo affiche deux millions de vues avec la légende : « Ils ont inventé une danse et ils ne le savent pas ».",
      talk: "Pour de vrai : quel moment de votre couple aurait mérité de devenir viral ?",
      ch: [["Assumer et lancer votre propre compte", "compte"], ["Faire profil bas en attendant que ça passe", "profilbas"]] },
    compte: { sc: "phone", t: "Vous créez un compte à deux. Premier défi : lui trouver un nom. Les commentaires réclament déjà un tutoriel de « la danse du métro », et vos téléphones vibrent sans arrêt.",
      talk: "Si vous lanciez un compte à deux, quel serait son nom ?",
      ch: [["Tourner le tutoriel de la danse", "tuto"], ["Répondre aux commentaires un par un", "commentaires"]] },
    tuto: { sc: "salon", t: "Vous tournez le tutoriel quarante-sept fois. À la quarante-huitième prise, vous éclatez de rire en plein milieu, et c'est cette version-là que vous publiez. Le lendemain, une émission de télé vous appelle.",
      ch: [["Accepter de passer à la télé", "plateau"], ["Refuser poliment : on n'est pas des stars", "fin_refus"]] },
    commentaires: { sc: "phone", t: "Au milieu des cœurs et des blagues, un commentaire vous arrête : « Merci, j'avais passé une semaine horrible et vous m'avez fait rire. » Vous vous regardez, la gorge un peu serrée.",
      ch: [["Répondre à cette personne", "fin_merci"], ["Organiser un rendez-vous dansant au parc pour tout le monde", "parc"]] },
    plateau: { sc: "plateau", t: "Sur le plateau, sous les projecteurs, l'animateur vous demande de refaire la danse en direct. Petit problème : aucun de vous deux ne se souvient vraiment des pas.",
      ch: [["Improviser complètement", "fin_direct"], ["Avouer que tout était un accident", "fin_aveu"]] },
    profilbas: { sc: "parc", t: "Vous gardez vos capuches pendant trois jours. Mais au marché, la fromagère vous reconnaît et réclame un selfie. Puis le boulanger. Puis le chien du boulanger, enfin presque.",
      ch: [["Céder et faire la danse au marché", "parc"], ["Partir en week-end loin du réseau", "fin_detox"]] },
    parc: { sc: "parc", t: "Le dimanche, une petite foule vous attend au parc avec une enceinte. Des inconnus, des enfants, une grand-mère en baskets : tout le monde veut apprendre la danse du métro.",
      ch: [["Lancer la musique", "fin_flashmob"]] },
    fin_refus: { end: "Les stars anonymes", sc: "metro", t: "La vidéo finit par se perdre dans le flot. Mais chaque fois que vous prenez le métro, vous échangez un regard complice. Vous savez." },
    fin_merci: { end: "Le commentaire", sc: "phone", t: "Vous lui écrivez un long message. Des mois plus tard, cette personne vous répond qu'elle va mieux. De toute cette histoire, c'est ce message-là que vous gardez." },
    fin_direct: { end: "En direct", sc: "plateau", t: "Vous inventez une chorégraphie entièrement nouvelle, avec un enthousiasme désarmant. L'animateur se joint à vous. Le replay fait encore plus de vues que la vidéo du métro." },
    fin_aveu: { end: "L'aveu", sc: "plateau", t: "« En fait, on a juste failli tomber. » Le public éclate de rire et applaudit. La sincérité devient virale à son tour : on vous surnomme « le couple le plus honnête d'internet »." },
    fin_detox: { end: "Zone blanche", sc: "neige", t: "Un gîte sans réseau, une forêt, deux jours sans la moindre notification. Quand vous rentrez, plus personne ne parle de la vidéo. Vous, vous parlez encore de ce week-end." },
    fin_flashmob: { end: "La danse du métro", sc: "parc", t: "Cinquante personnes dansent la danse du métro dans le parc, et personne ne la fait pareil. C'est un joyeux désordre, et c'est exactement ce que vous êtes." }
  } },
  { id: "villa", title: "La villa des cœurs", mood: "Parodie de télé-réalité", c: 6, start: "arrivee", nodes: {
    arrivee: { sc: "villa", t: "Par un enchaînement de circonstances que personne ne comprend vraiment, vous voilà dans une émission de télé-réalité pour couples : « La villa des cœurs ». Piscine à débordement, caméras partout, et un animateur au sourire beaucoup trop blanc qui annonce la première épreuve.",
      ch: [["Foncer : on est là pour gagner", "epreuve"], ["Rester discrets et observer les autres couples", "observer"]] },
    epreuve: { sc: "villa", t: "Première épreuve : répondre en même temps à une question sur l'autre. « Quel est le plat préféré de votre partenaire ? » Vous avez trois secondes.",
      talk: "Faites l'épreuve pour de vrai : chacun dit en même temps le plat préféré de l'autre. Trois, deux, un…",
      ch: [["Bonne réponse des deux côtés !", "confession"], ["Réponses complètement différentes", "confession"]] },
    observer: { sc: "villa", t: "Au bord de la piscine, un couple se dispute pour savoir qui a laissé le frigo ouvert. Un autre répète une chorégraphie depuis six heures du matin. Vous vous regardez : vous êtes clairement le couple le plus normal de la villa.",
      ch: [["Aider le couple du frigo à se réconcilier", "mediation"], ["Filer au confessionnal pour tout commenter", "confession"]] },
    mediation: { sc: "villanuit", t: "Vous jouez les médiateurs. Résultat : le couple se réconcilie, la production adore, et on vous surnomme « les psys de la villa ». Le soir venu, l'animateur vous annonce une surprise.",
      ch: [["Découvrir la surprise", "plage"]] },
    confession: { sc: "confession", t: "Au confessionnal, face caméra, chacun doit dire en dix secondes ce qu'il préfère chez l'autre. Interdiction de se concerter.",
      talk: "Pour de vrai : dix secondes chacun pour dire ce que vous préférez chez l'autre.",
      ch: [["Jouer le jeu sincèrement", "plage"], ["Faire une déclaration digne d'un grand drame télévisé", "drame"]] },
    drame: { sc: "confession", t: "Musique dramatique, gros plan, larme imaginaire : votre confession est si théâtrale que l'équipe technique pleure de rire derrière la caméra. Le producteur vous propose votre propre émission.",
      ch: [["Accepter : la gloire nous attend", "fin_star"], ["Refuser : on préfère la vraie vie", "plage"]] },
    plage: { sc: "plage", t: "Dernier soir. Un dîner vous attend sur la plage, au coucher du soleil. L'animateur annonce le grand final : chaque couple doit décider s'il reste pour gagner le trophée, ou s'il part maintenant, main dans la main.",
      ch: [["Rester jusqu'au trophée", "fin_trophee"], ["Partir maintenant, loin des caméras", "fin_depart"]] },
    fin_star: { end: "Les stars du prime", sc: "plateau", t: "Votre émission s'appelle « Drama à deux ». Elle dure une saison, fait beaucoup rire, et vous laisse une immense collection de bêtisiers que vous regardez encore les soirs de pluie." },
    fin_trophee: { end: "Le trophée en plastique", sc: "villanuit", t: "Vous remportez un trophée en forme de cœur, légèrement en plastique. Il trône désormais chez vous, à côté d'une photo de vous deux en peignoir de la villa." },
    fin_depart: { end: "Hors caméra", sc: "plage", t: "Vous retirez les micros, laissez les caméras derrière vous et marchez le long de l'eau. Personne ne saura jamais ce que vous vous êtes dit ce soir-là. C'était le meilleur moment de l'émission." }
  } },
  { id: "festival", title: "Le festival sous les étoiles", mood: "Romantique · été", c: 4, start: "entree", nodes: {
    entree: { sc: "festival", t: "Trois jours de festival en plein air. Bracelets au poignet, paillettes sur les joues, vous venez d'arriver quand vous réalisez deux choses : vos amis ont disparu dans la foule, et il reste 12 % de batterie à vos deux téléphones réunis.",
      ch: [["Partir à la recherche des amis", "foule"], ["Profiter de l'instant, à deux", "concert"]] },
    foule: { sc: "foodtruck", t: "Au milieu de la foule, impossible de capter quoi que ce soit. Vous passez devant un stand de recharge (une heure d'attente) et un food truck qui sent divinement bon.",
      ch: [["Faire la queue pour recharger", "recharge"], ["Le food truck, priorité absolue", "frites"]] },
    recharge: { sc: "foodtruck", t: "Dans la file, vous sympathisez avec un couple ensemble depuis quarante ans, venu pour son groupe préféré. Leur conseil : « Ne cherchez pas vos amis. Cherchez le meilleur endroit pour vous deux. »",
      talk: "Pour de vrai : quel conseil aimeriez-vous donner à un couple qui commence ?",
      ch: [["Suivre leur conseil", "colline"]] },
    frites: { sc: "foodtruck", t: "Le food truck propose un plat mystère « spécial amoureux » : une seule énorme barquette de frites et deux fourchettes. Il ne reste qu'une chaise.",
      ch: [["Partager la chaise", "concert"], ["S'asseoir dans l'herbe, plus confortable", "colline"]] },
    concert: { sc: "festival", t: "Les premières notes du concert principal résonnent. La foule chante en chœur, des confettis tombent du ciel. Et c'est précisément votre chanson à vous deux qui commence.",
      talk: "Pour de vrai : quelle chanson voudriez-vous entendre à ce moment-là ?",
      ch: [["Danser au premier rang", "fin_premierrang"], ["L'écouter tranquillement depuis la colline", "colline"]] },
    colline: { sc: "colline", t: "Sur la colline, la scène brille au loin comme une boîte à bijoux. Les étoiles sont incroyablement nettes. Vos téléphones s'éteignent pour de bon, et ça n'a plus aucune importance.",
      ch: [["Rester là jusqu'au lever du soleil", "fin_aube"], ["Redescendre retrouver les amis au campement", "camping"]] },
    camping: { sc: "camping", t: "Au campement, vos amis vous accueillent comme des stars : ils vous cherchaient depuis des heures. Quelqu'un a sorti une guitare, la nuit est douce.",
      ch: [["Chanter à la lumière des lampes frontales", "fin_campement"]] },
    fin_premierrang: { end: "Le premier rang", sc: "festival", t: "Vous dansez jusqu'à ne plus sentir vos pieds, couverts de confettis. Sur l'écran géant, la caméra s'attarde une seconde sur vous deux. Vous ne la voyez même pas." },
    fin_aube: { end: "Le lever du soleil", sc: "tournesols", t: "Le ciel passe du noir au rose. Le festival dort encore. Vous partagez la dernière gorgée d'eau et vous vous promettez de revenir l'an prochain, au même endroit." },
    fin_campement: { end: "La nuit au campement", sc: "camping", t: "Fausses notes, rires, couvertures partagées : la plus belle scène du festival, finalement, c'était celle-là. Vos amis jurent de ne plus jamais vous perdre de vue." }
  } },
  { id: "dragon", title: "La quête du dragon timide", mood: "Fantasy · aventure tendre", c: 3, start: "convoc", nodes: {
    convoc: { sc: "chateau", t: "Royaume d'Ombrevert. Le roi, un petit homme à la couronne beaucoup trop grande, vous convoque en urgence : un dragon s'est installé sur la montagne, et depuis, plus personne n'ose sortir le soir. Il vous confie la mission, une carte froissée et deux épées… en bois. « Les vraies sont chez le forgeron. »",
      ch: [["Partir tout de suite par la forêt", "foret"], ["Passer d'abord à la taverne pour glaner des infos", "taverne"]] },
    taverne: { sc: "taverne", t: "À la taverne du Sanglier Rieur, un barde vous raconte que le dragon n'a jamais mangé personne : il soupire, très fort, toutes les nuits. Une marchande vous propose deux objets pour la route : une potion de courage, ou un luth magique qui apaise toutes les bêtes.",
      talk: "Pour de vrai : face à un dragon, lequel de vous deux garderait son sang-froid ?",
      ch: [["Prendre la potion de courage", "foret"], ["Prendre le luth magique", "luth"], ["Oublier la quête et rester danser à la taverne", "fin_taverne"]] },
    foret: { sc: "foret", t: "La forêt d'Ombrevert scintille de champignons lumineux. Au détour d'un sentier, une fée minuscule vous barre la route : « Pour passer, répondez à mon énigme, ou dansez avec moi. Les deux me conviennent. »",
      ch: [["Répondre à l'énigme", "enigme"], ["Danser avec la fée", "danse"]] },
    enigme: { sc: "foret", t: "« Je n'ai pas de voix, et pourtant je dis tout. Je ne pèse rien, et pourtant je peux tout porter. Qui suis-je ? » {a} et {b} se regardent.",
      talk: "Cherchez ensemble avant de choisir : qu'est-ce qui dit tout sans parler ?",
      ch: [["« Un regard »", "grotte"], ["« Une lettre »", "grotte"], ["« Un dragon très discret »", "fee_rire"]] },
    fee_rire: { sc: "foret", t: "La fée rit tellement qu'elle tombe de sa feuille. « Mauvaise réponse, mais excellente quand même ! » Pour vous remercier, elle vous montre un raccourci secret jusqu'à la grotte du dragon.",
      ch: [["Suivre le raccourci", "grotte"]] },
    danse: { sc: "foret", t: "Vous dansez une gigue improvisée au milieu des champignons. La fée applaudit, les lucioles vous suivent en rythme, et {b} découvre que {a} a un talent caché pour les pas de côté.",
      talk: "Pour de vrai : qui de vous deux danse le mieux ? Et le plus mal ?",
      ch: [["Remercier la fée et repartir", "grotte"]] },
    luth: { sc: "foret", t: "Le luth à l'épaule, vous traversez la forêt. À chaque note, les loups s'assoient, les sangliers bâillent et un hibou bat la mesure. Vous arrivez devant la grotte suivis d'une petite troupe d'admirateurs.",
      ch: [["Entrer dans la grotte en musique", "grotte_musique"]] },
    grotte: { sc: "grotte", t: "Entre les cristaux, un énorme dragon vert vous regarde… et rougit jusqu'aux écailles. « Pardon pour les soupirs, dit-il d'une toute petite voix. Je voudrais inviter la dragonne de la montagne d'en face, mais je n'ose pas. »",
      talk: "Pour de vrai : quel conseil donneriez-vous à quelqu'un de trop timide pour faire le premier pas ?",
      ch: [["L'aider à écrire une déclaration", "declaration"], ["Lui organiser un rendez-vous surprise", "rdv"]] },
    grotte_musique: { sc: "grotte", t: "Au son du luth, le dragon sort de l'ombre en se dandinant, les yeux humides. « C'est exactement la chanson que je voudrais chanter à la dragonne de la montagne d'en face, soupire-t-il. Mais je n'ose pas. »",
      ch: [["Lui apprendre la chanson", "fin_serenade"], ["L'aider à écrire une déclaration", "declaration"]] },

/* ───────────────────────── Parties à distance ─────────────────────────
   Une partie à distance vit dans l'espace commun (live/game) et chaque téléphone l'affiche en
   direct. Chacun n'écrit que sa propre réponse (live/game/ans/<clé>) : répondre en même temps
   n'écrase jamais la réponse de l'autre. Une seule partie à distance à la fois. */
const whoAmI = pzMe;
// Qui est qui : chaque téléphone note dans l'espace commun le rôle qu'il a pris (space/who/a ou b).
// Si l'autre téléphone a déjà pris ce prénom, on demande avant, pour ne pas se retrouver tous les deux « a ».
function claimMe(k, sure) {
  if (k !== "a" && k !== "b") { lsSet("entre-nous:me", ""); return true; }
  const who = (Store.meta.space || {}).who || {}, mine = deviceId();
  if (Store.backend === "shared" && who[k] && who[k] !== mine && !sure) { S.claimBack = S.layer && S.layer.name !== "claim" ? S.layer : S.claimBack || null; S.claim = k; S.layer = { type: "sheet", name: "claim" }; return false; }
  lsSet("entre-nous:me", k); S.claim = null;
  if (Store.backend === "shared") { const patch = { ["who/" + k]: mine }; if (who[other(k)] === mine) patch["who/" + other(k)] = null; Store.patchMeta("space", patch); }
  return true;
}
const Live = {
  state: null, unsub: null, lastStart: 0,
  open() {
    if (this.unsub || !Store.db || Store.backend !== "shared") return;
    this.unsub = Store.db.doc("live/game").onSnapshot(s => {
      const v = s.exists ? s.data() : null;
      const was = this.state;
      try { this.state = cleanLive(v); } catch (e) { this.state = null; }
      const st = this.state;
      if (was && st && was.startAt === st.startAt && liveRound(was) !== liveRound(st)) {
        const pre = `lv-${was.i}-`, typed = Object.keys(S.drafts).some(k => (k.startsWith(pre) || k === `lv-w-${was.round}` || k === "lv-clue") && String(S.drafts[k]).trim());
        if (typed) toast("L'autre téléphone est passé à la suite : ton texte reste en brouillon.");
      }
      if (st && st.startAt !== this.lastStart) {
        if (this.seen && st.by && st.by !== whoAmI() && !st.ended) toast(`${nm(st.by)} a lancé une partie à distance`);
        this.lastStart = st.startAt;
      }
      if (was && st && was.startAt === st.startAt && !was.ended && st.ended && st.aborted && S.layer && S.layer.type === "live") { S.layer = null; toast("Partie arrêtée, d'un commun accord"); }
      if (st && st.stopReq && st.stopReq.by !== whoAmI() && !(was && was.stopReq)) toast(`${nm(st.stopReq.by)} propose d'arrêter la partie`);
      this.seen = true;
      // L'accord pour l'album est enregistré par un seul téléphone, pour éviter les doublons.
      if (st && st.kind === "cards" && whoAmI() === "a") {
        const sv = st.saved || {};
        if (sv.ok && sv.ok.a && sv.ok.b && !sv.album) liveSaveAlbum(st);
      }
      render();
    }, e => Store.fail(e));
  },
  close() { if (this.unsub) { try { this.unsub(); } catch (e) { /* déjà fermé */ } } this.unsub = null; this.state = null; },
  write(obj) {
    if (!this.state || !Store.db) return;
    for (const k in obj) { if (obj[k] === null) delete this.state[k]; else this.state[k] = obj[k]; }
    Store.db.doc("live/game").update({ ...obj, updatedAt: Date.now() }).catch(e => Store.fail(e));
  },
  answer(path, key, val) {
    if (!this.state || !Store.db) return;
    let o = this.state;
    path.split("/").forEach(p => { if (!o[p] || typeof o[p] !== "object") o[p] = {}; o = o[p]; });
    o[key] = val;
    // Une clé « r3 » plutôt que « 3 » : Firebase ne la transforme pas en liste.
    const [h, ...rest] = path.split("/"), remote = ["ans", "saved", "votes"].includes(h) ? [h, "r" + liveRound(this.state), ...rest].join("/") : path;
    Store.db.doc("live/game/" + remote).update({ [key]: val }).catch(e => Store.fail(e));
    Store.db.doc("live/game").update({ updatedAt: Date.now() }).catch(() => {});
  },
  start(state) {
    if (!Store.db) { toast("Hors ligne : les parties à distance reviendront avec le réseau."); return; }
    const s = { ...state, by: whoAmI() || "a", startAt: Date.now(), updatedAt: Date.now(), ended: false };
    this.state = s; this.lastStart = s.startAt; S.lvRules = null; S.lvGuess = 50;
    Store.db.doc("live/game").set(s).then(() => Notify.ping("partie"), e => Store.fail(e));
    S.layer = { type: "live" };
  },
  active() { const s = this.state; return !!(s && !s.ended && Date.now() - (s.updatedAt || 0) < 12 * 3600 * 1000); }
};
const liveTitle = L => L.kind === "cards" ? (MODES[L.mode] || {}).title || "Partie" : L.kind === "arcade" ? (ARCADE[L.game] || {}).title || "Arcade" : (STORY[L.id] || {}).title || "Histoire";

const liveWaiting = (who, done) => `<p class="small muted" style="text-align:center">${done ? `${esc(nm(who))} a répondu ✓` : `${esc(nm(who))} est en train de répondre…`}</p>`;

const liveNorm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "").replace(/s$/, "");

/* Cartes : questions, Qui de nous deux, Notre histoire, Et si on, Surprise */
function startLiveCards(st) {
  const deck = buildDeck({ ...st, style: "secret" });
  if (!deck.length) { toast("Aucune carte ne correspond à ce choix."); return; }
  Live.start({ kind: "cards", mode: st.mode, setup: { mode: st.mode, cat: st.cat, mood: st.mood, dur: st.dur, style: "distance" }, deck, i: 0, first: Math.random() < 0.5 ? "a" : "b" });
}
function liveCard(L) {
  const c = CARDS[(L.deck || [])[L.i]];
  if (!c) return null;
  const flow = flowOf(c, L.mode), T = (L.i % 2 === 0) === (L.first === "a") ? "a" : "b";
  const g = { flow, T, ans: L.ans || {}, saved: L.saved || {} };
  g.talk = (flow === "pick" ? PICK_TALK : GUESS_TALK)[L.i % 5];
  return { c, g, slots: slotsOf(g) };
}
function liveSaveAlbum(L) {
  // Une seule fois par carte, même si l'accord arrive deux fois (clic et écoute de la base).
  const x = liveCard(L), key = L.startAt + ":" + L.i; if (!x || liveSaveAlbum.done === key) return;
  liveSaveAlbum.done = key;
  const entries = x.slots.map(s => ({ who: s.who, label: x.g.flow === "guess" ? (s.key === "guess" ? `Prédiction de ${nm(s.who)}` : `Réponse de ${nm(s.who)}`) : nm(s.who), text: String(x.g.ans[s.key] || "") }));

function startLiveArcade(game) {
  const s = { kind: "arcade", game, i: 0, score: 0, first: Math.random() < 0.5 ? "a" : "b" };
  if (game === "tp") s.deck = shuffle(TP.map((_, i) => i)).slice(0, 10);
  else if (game === "flags") s.deck = shuffle(FLAGS.map((_, i) => i)).slice(0, 10);
  else if (game === "onde") { s.deck = shuffle(SPECTRA.map((_, i) => i)).slice(0, 6); s.target = 5 + Math.floor(Math.random() * 91); }
  else { s.game = "synchro"; s.prompt = pickOne(SYNC); s.round = 1; }

function liveArcadeView(L, me, head) {
  const col = cvar(7), ans = L.ans || {}, o = other(me), deck = L.deck || [], total = deck.length;
  const endScr = (big, txt) => head + `<div class="stack" style="text-align:center;justify-items:center;padding-top:24px"><p class="end-big">${esc(fr(big))}</p><p>${esc(fr(txt))}</p></div>
    <div class="actions"><button class="btn wide c" style="${col}" data-a="lv-replay">Rejouer</button><button class="btn line wide" data-a="close-layer">Retour à l'accueil</button></div>`;
  if (S.lvRules !== L.startAt) return head + rulesHtml(ARC_REMOTE_RULES[L.game] || []) + `<button class="btn wide c" style="${col}" data-a="lv-rules-ok">C'est parti</button>`;
  const next = (label = "Suivant") => `<button class="btn wide" data-a="${L.game === "onde" ? "lv-onde-next" : "lv-arc-next"}">${L.i + 1 >= total ? "Terminer" : label}</button>`;

  if (L.game === "tp" || L.game === "flags") {
    if (L.ended) return endScr("C'était la dernière !", "Un choix vous a surpris ? C'est le bon moment pour en reparler.");
    const it = L.game === "tp" ? TP[deck[L.i]] : FLAGS[deck[L.i]];
    if (!it) return endScr("Partie terminée", "");
    const opts = L.game === "tp" ? it : ["Green flag", "Red flag"];
    const q = L.game === "tp"
      ? `<div class="duel"><div class="side" style="${cvar(5)}">${esc(it[0])}</div><span class="ou">ou</span><div class="side" style="${cvar(6)}">${esc(it[1])}</div></div>`
      : `<p class="flag-q">${esc(it)}</p>`;
    const pick = k => (ans[k] === "1" ? 1 : 0);
    if (ans[me] == null) return head + q + `<div class="pickers">${opts.map((t, i) => `<button class="btn c" style="${L.game === "flags" ? cvar(i ? 1 : 3) : cvar(i ? 6 : 5)};font-family:var(--f-body);font-size:1rem;font-weight:700" data-a="lv-pick" data-k="${me}" data-v="${i}">${esc(t)}</button>`).join("")}</div>`;
    if (ans[o] == null) return head + q + liveSent + liveWaiting(o, false);
    const same = pick("a") === pick("b");
    return head + q + `<div class="reveal" style="${col}">${["a", "b"].map(k => `<div class="rv"><b>${esc(nm(k))}</b><p class="pick" style="font-size:1.15rem">${esc(opts[pick(k)])}</p></div>`).join("")}</div>
      <p class="verdict" style="${col}">${same ? "Même choix !" : "Pas le même choix… plaidez !"}</p>` + next();
  }

  if (L.game === "onde") {
    if (L.ended) {
      const max = total * 4, r = (+L.score || 0) / max;
      return endScr(`${+L.score || 0} / ${max}`, r >= 0.75 ? "Télépathie confirmée, même à distance." : r >= 0.5 ? "Vous êtes clairement sur la même fréquence." : r >= 0.25 ? "Quelques parasites sur la ligne, mais de très bons indices." : "La fréquence se cherche encore. Les indices, eux, étaient mémorables.");
    }
    const sp = SPECTRA[deck[L.i]] || ["", ""], guide = (L.i % 2 === 0) === (L.first === "a") ? "a" : "b", guesser = other(guide);
    const t = Math.min(100, Math.max(0, +L.target || 50));
    const labels = `<div class="spec-labels"><span>← ${esc(sp[0])}</span><span>${esc(sp[1])} →</span></div>`;
    const score = `<p class="small muted" style="text-align:center">Score d'équipe : ${+L.score || 0} pt${(+L.score || 0) > 1 ? "s" : ""} · manche ${L.i + 1} sur ${total}</p>`;
    if (ans.guess != null) {
      const g = Math.min(100, Math.max(0, +ans.guess)), d = Math.abs(g - t), pts = d <= 4 ? 4 : d <= 10 ? 3 : d <= 16 ? 2 : 0;
      const msg = ["Raté… mais l'indice valait le détour.", "", "Pas loin !", "Tout près !", "En plein dans le mille !"][pts];
      return head + specHtml({ target: t, guess: g }, true, true) + labels + (ans.clue ? instr(`Indice de ${nm(guide)}`, esc(ans.clue)) : "")
        + `<p class="verdict" style="${col}">+${pts} point${pts > 1 ? "s" : ""} · ${esc(fr(msg))}</p>` + score + next("Manche suivante");
    }
    if (me === guide) {
      if (!ans.clue) return head + `<p class="lbl" style="text-align:center">Tu es le guide de cette manche</p>` + specHtml({ target: t }, true, false) + labels
        + `<div class="field"><label for="lv-clue">${esc(fr(`Ton indice pour ${nm(guesser)}, qui se placerait pile dans la zone foncée`))}</label><input type="text" id="lv-clue" data-d maxlength="80" value="${dv("lv-clue")}" autocomplete="off"></div>
        <button class="btn wide c" style="${col}" data-a="lv-clue">Envoyer l'indice</button>` + score;
      return head + specHtml({ target: t }, true, false) + labels + instr("Indice envoyé ✓", esc(fr(`« ${ans.clue} ». ${nm(guesser)} place l'aiguille…`))) + score;
    }
    if (!ans.clue) return head + specHtml({ target: t }, false, false) + labels + `<p class="verdict" style="${col}">${esc(fr(`${nm(guide)} cherche un indice…`))}</p>` + score;
    const g = S.lvGuess == null ? 50 : S.lvGuess;
    return head + instr(`Indice de ${nm(guide)}`, `<span style="font-family:var(--f-hand);font-size:1.6rem">${esc(ans.clue)}</span>`) + specHtml({ target: t, guess: g }, false, true) + labels
      + `<label class="lbl" for="lv-g">Place l'aiguille</label><input type="range" id="lv-g" min="0" max="100" step="1" value="${g}" aria-valuetext="${g} sur 100">
      <button class="btn wide c" style="${col}" data-a="lv-guess">Valider</button>` + score;
  }

  // Synchro
  if (L.ended) return L.result === "win" ? endScr("Synchro !", `Le même mot en ${L.round} manche${L.round > 1 ? "s" : ""}, à distance. Vos cerveaux se sont trouvés.`) : endScr("Presque…", "Pas de synchro cette fois, mais quel chemin pour y arriver. On retente ?");
  const words = Array.isArray(L.words) ? L.words : [], lastW = words[words.length - 1];
  const box = `<div class="panel" style="text-align:center;${col}">${L.round === 1 || !lastW
    ? `<p class="card-for">Écrivez chacun, sans vous concerter…</p><p class="big-word">${esc(L.prompt)}</p>`
    : `<p class="card-for">Manche ${L.round} · un mot qui relie</p><p class="big-word" style="font-size:1.7rem">« ${esc(lastW[0])} » et « ${esc(lastW[1])} »</p>`}</div>`;
  if (ans.a != null && ans.b != null) {
    const same = liveNorm(ans.a) === liveNorm(ans.b);
    return head + box + `<div class="reveal" style="${col}">${["a", "b"].map(k => `<div class="rv"><b>${esc(nm(k))}</b><p class="pick">${esc(ans[k])}</p></div>`).join("")}</div>
      <p class="verdict" style="${col}">${same ? "Même mot !" : "Pas encore…"}</p>
      <button class="btn wide c" style="${col}" data-a="lv-sync-next" data-v="${same ? "win" : ""}">${same ? "Voir le résultat" : L.round >= 8 ? "Voir le résultat" : "Manche suivante"}</button>`;
  }
  if (ans[me] != null) return head + box + liveSent + liveWaiting(o, false);
  const id = `lv-w-${L.round}`;
  return head + box + `<div class="field"><label for="${id}">Ton mot</label><input type="text" id="${id}" data-d maxlength="40" value="${dv(id)}" autocomplete="off"></div>
    <button class="btn wide c" style="${col}" data-a="lv-word">Envoyer mon mot</button>` + liveWaiting(o, false);
}

  deliver(sg, tries = 0) {
    if (!this.el || this.el.hidden) { this.pending = null; return; }

      if (sg.id) lsSet("entre-nous:sig", sg.id);
      Sfx.play(sg.kind === "mot" ? "paper" : "heart");
      gainToast(sg.kind === "mot" ? `Un petit mot de ${nm(from)} arrive !` : fr(sig.toast.replace("{f}", nm(from))), null);
    }
    this.pending = sg.id;
    if (this.busy) { if (tries < 40) window.setTimeout(() => this.deliver(sg, tries + 1), 1500); else this.pending = null; return; }
    this.pending = null;
    const F = this.b[from], T = this.b[other(from)], W = this.W();
    this.busy = true;
    if (sg.kind === "mot") {
      F.x = T.x < W / 2 ? W - 14 : 14; F.el.classList.add("carry");

        T.el.classList.add("blush", "happy"); this.bigHeart((F.x + T.x) / 2); this.hearts((F.x + T.x) / 2, 5, 20);
        this.at(() => { T.el.classList.remove("blush", "happy"); this.done(); }, 8200);
      });
      return;
    }
    if (sg.kind === "calin") {
      this.meet(27, (L, R) => {
        this.mood([L, R], "happy", true); L.tilt = R.tilt = 10; this.bigHeart((L.x + R.x) / 2); this.hearts((L.x + R.x) / 2, 7);
        this.say(from, pickOne(sig.line), 2600);
        this.at(() => { this.mood([L, R], "happy", false); L.tilt = R.tilt = 0; this.apart(L, R, () => this.done()); }, 3000);
      });
      return;
    }

      F.face = T.x > F.x ? 1 : -1; T.face = -F.face;

      }, 3000);
    });

// Le ciel du fond suit l'heure : aube, jour, soir, nuit.
const skyNow = () => { const h = new Date().getHours(); return h >= 5 && h < 9 ? "aube" : h < 17 && h >= 9 ? "jour" : h >= 17 && h < 21 ? "soir" : "nuit"; };
// Une quête vient d'être cochée : petite explosion de cœurs sur sa ligne.
function questBurst() {
  const id = Jeu.justDone; if (!id) return;
  Jeu.justDone = null; Sfx.play("pop");
  document.querySelectorAll(`.quest[data-q="${id}"]`).forEach(el => {
    el.classList.add("pop");
    for (let i = 0; i < 9; i++) {
      const s = document.createElement("span"); s.className = "q-burst"; s.textContent = "♥";
      const a = (i / 9) * Math.PI * 2;
      s.style.setProperty("--dx", (Math.cos(a) * 34).toFixed(0) + "px"); s.style.setProperty("--dy", (Math.sin(a) * 26 - 8).toFixed(0) + "px");
      el.querySelector(".qcheck").appendChild(s); setTimeout(() => s.remove(), 900);
    }
  });
}
// Écran de lancement : Yassen Jr. et Y&S, une seconde, à la première ouverture de la session.
function splash() {
  try { if (sessionStorage.getItem("ys-splash")) return; sessionStorage.setItem("ys-splash", "1"); } catch (e) { return; }
  const icon = document.querySelector('link[rel="apple-touch-icon"]'), d = document.createElement("div");
  d.id = "splash"; d.setAttribute("aria-hidden", "true");
  d.innerHTML = `<div class="sp-in"><img src="${icon ? icon.href : ""}" alt=""><p class="sp-brand">Y<span>&amp;</span>S</p><p class="sp-dedi">montrons-lui que ses parents s'aiment vraiment</p></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.classList.add("out"), 1150);
  setTimeout(() => d.remove(), 1700);
}

// Une tenue de la boutique, avec ses chromas : toucher un chroma le montre sur le personnage.
function outfitCard(it, who, owned, eq, h) {
  const ch = OUTFITS[it.id].chromas, worn = Jeu.equipOf(who);
  const tint = (S.prevTint || {})[it.id] || (eq ? worn.tint : ch[0][0]), name = (ch.find(x => x[0] === tint) || ch[0])[1];
  const sw = ch.map(([cid, cn, p], i) => { const mine = Jeu.ownsTint(it.id, cid);
    return `<button class="chroma${mine || !owned ? "" : " locked"}" style="--c1:${p[0]};--c2:${p[1]}" aria-pressed="${tint === cid}" aria-label="${esc(fr(cn))}${owned && !mine ? `, ${CHROMA_PRICE} cœurs` : ""}" data-a="shop-tint" data-o="${it.id}" data-v="${cid}"></button>`; }).join("");
  const btn = !owned ? (h >= it.price ? `<button class="btn" data-a="shop-buy" data-v="${it.id}">Acheter · ♥︎ ${it.price}</button>` : `<button class="btn ghost" disabled>♥︎ ${it.price} · encore ${it.price - h}</button>`)
    : !Jeu.ownsTint(it.id, tint) ? (h >= CHROMA_PRICE ? `<button class="btn" data-a="shop-tint-buy" data-o="${it.id}" data-v="${tint}">Débloquer · ♥︎ ${CHROMA_PRICE}</button>` : `<button class="btn ghost" disabled>♥︎ ${CHROMA_PRICE} · encore ${CHROMA_PRICE - h}</button>`)
    : eq && worn.tint === tint ? `<button class="btn ghost" data-a="shop-equip" data-v="${it.id}" data-t="${tint}">Retirer</button>`
    : `<button class="btn c" style="${cvar(1)}" data-a="shop-equip" data-v="${it.id}" data-t="${tint}">${eq ? "Porter ce chroma" : "Équiper"}</button>`;
  return `<article class="shop-item"><div class="shop-prev">${avatarSvg(who, { outfit: it.id, tint })}</div><b>${esc(fr(it.name))}</b>
    <div class="chromas" role="group" aria-label="Chromas">${sw}</div><span class="chroma-name">${esc(fr(name))}</span>${btn}</article>`;
}
/* Écran des trésors : quêtes, boutique, succès. */
function tresorsView() {
  const seg = S.trSeg || "quetes", h = Jeu.hearts();
  const segs = [["quetes", "Quêtes"], ["boutique", "Boutique"], ["succes", "Succès"]].map(([k, l]) => `<button aria-pressed="${seg === k}" data-a="tr-seg" data-v="${k}">${l}</button>`).join("");
  let body = "";
  if (seg === "quetes") {
    const qs = Jeu.todayQuests(), done = Jeu.doneToday(), st = Jeu.stage(), d = Jeu.days();

      ${btn("guard", '<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>', "Se défendre", "−50 % · +3 PM", false)}</div>`;

/* Actions des histoires sur mesure et de l'épopée. */
function cxSave(st) {
  const { id, ...data } = st;
  data.updatedAt = Date.now();
  return Store.put("contes", id, data);
}
// L'étape suivante s'écrit : l'IA (ou le générateur) reçoit l'histoire telle qu'elle est maintenant.
async function cxGenerate(outcome) {
  const id = S.cx.id, base = cxStory(); if (!base || cxBusy()) return;
  const n = cxSteps(base).length, tok = { id }, here = () => S.cx.id === id && S.layer && S.layer.type === "conte";
  Store.patchDoc("contes", id, { gen: { by: deviceId(), n, at: Date.now() } });
  S.cx.gen = tok; S.cx.err = ""; S.cx.busyMsg = n ? "La suite s'écrit" : "L'histoire commence à s'écrire"; cxWatchSlow(); render(true);
  let res;
  try { res = await cxNextStep(cxCopy(base), outcome); } catch (e) { res = null; }
  if (S.cx.gen === tok) S.cx.gen = null;
  // L'étape rejoint l'histoire qui l'a demandée, même si l'on en a ouvert une autre entre-temps.
  const cur = cxById(id);
  // Si l'autre téléphone a déjà écrit cette étape, on garde la sienne.
  if (!res || !cur || cxSteps(cur).length !== n) {
    if (cur && (cur.gen || {}).by === deviceId()) Store.patchDoc("contes", id, { gen: null });
    if (!res && S.cx.id === id) S.cx.err = "La suite n'a pas pu s'écrire. Réessayez dans un instant.";
    render(here()); return;
  }
  // Seule la nouvelle étape est envoyée : ce que l'autre téléphone a changé entre-temps reste.
  Store.patchDoc("contes", id, { ["steps/" + n]: res.step, gen: null, ...(res.step.end ? { status: "done", end: res.step.end } : {}) });
  if (res.step.end) { Jeu.event("fin"); Jeu.flag("conte"); }
  if (!here()) { render(); return; }
  Sfx.play(res.step.end ? "fanfare" : "page");
  render(true);
  const L = document.querySelector("#layer .layer"); if (L) L.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
}
// Modifie l'histoire ouverte, et n'envoie que ce qui a changé (champ par champ, étape par étape).
function cxCommit(mut) {
  const st = cxStory(); if (!st) return null;
  const upd = cxCopy(st), same = (x, y) => JSON.stringify(x) === JSON.stringify(y), flat = {};
  mut(upd, upd.steps[upd.steps.length - 1]);
  new Set([...Object.keys(st), ...Object.keys(upd)]).forEach(k => { if (k !== "id" && k !== "steps" && k !== "updatedAt" && !same(st[k], upd[k])) flat[k] = upd[k] === undefined ? null : upd[k]; });
  cxSteps(upd).forEach((s, i) => { if (!same(s, st.steps[i])) flat["steps/" + i] = s; });
  if (Object.keys(flat).length) Store.patchDoc("contes", st.id, flat);
  return upd;
}
// Les sons d'une action de combat : le dé d'abord, puis le coup, le soin ou le charme.
function cxFxSfx(F) {
  const k = F.fx.map(f => f.kind), d = F.roll ? 320 : 0;
  if (F.roll) Sfx.play("dice");
  setTimeout(() => Sfx.play(k.includes("crit") ? "crit" : k.includes("dmg") || k.includes("hurt") ? "hit" : k.includes("heal") ? "heal" : k.includes("love") ? "heart" : k.includes("sleep") || k.includes("shield") ? "soft" : k.includes("miss") || k.includes("dodge") ? "whoosh" : ""), d);
}
function cxFightOver() {
  const F = S.fight;
  if (F.over === "win" || F.over === "calm") { F.result = rpgWin(F.st); if (F.enemy.boss) Jeu.flag("boss"); Buddies.cheer(); setTimeout(() => Sfx.play("fanfare"), 500); }
  else if (F.over === "lose") setTimeout(() => Sfx.play("soft"), 500);
}
function cxEnemySoon() {
  const id = S.fight.id;
  setTimeout(() => {
    const F = S.fight;
    if (!F || F.id !== id || F.over || F.turn !== "enemy") return;
    rpgEnemyAct(F.st); F.seq++; cxFxSfx(F);
    if (F.over) cxFightOver(); else rpgNextTurn(F.st);
    if (S.layer && S.layer.type === "conte") render(true);
  }, 1100);
}
const CX_ACT = {

  "cx-set"(d) { if (d.k === "yassen") S.cx.yassen = !!d.v; else if (d.k === "mode") S.cx.mode = d.v === "rpg" ? "rpg" : "conte"; else if (d.k === "genre" && CX_GENRES[d.v]) S.cx.genre = d.v; else if (d.k === "length" && CX_LENGTHS[d.v]) S.cx.length = d.v; },

  async "cx-pitch"() {

  "cx-choose-pitch"(d) {
    const cx = S.cx, p = (cx.pitches || [])[+d.i], o = cx.opts; if (!p || !o) return;

/* ───────────────────────── Sons doux ─────────────────────────
   De petits sons générés en direct (aucun fichier à télécharger), discrets et désactivables.
   Sur Android, une vibration légère les accompagne ; l'iPhone ne la permet pas depuis un site. */
const Sfx = {
  ctx: null, out: null,
  on() { return lsGet("entre-nous:sfx") !== "0"; },
  init() {

  tone(f, t, dur, type = "sine", vol = 1, to = 0) {

  buzz(p) { try { if (navigator.vibrate && this.on()) navigator.vibrate(p); } catch (e) { /* vibration indisponible */ } },
  taps() { return lsGet("entre-nous:taps") !== "0"; },
  // Le bruitage d'un bouton : seulement si l'action n'a pas déjà son propre son.
  tap(el) {
    if (!this.taps()) return;
    const a = el.dataset.a || "", p = el.getAttribute("aria-pressed");
    this.note = Math.max(0, ["home", "play", "capsule", "aventures", "lettres"].indexOf(el.dataset.tab || "")) || ((el.dataset.seg || el.dataset.v || "").length % 5);
    this.play(a === "tab" || a === "cap-seg" || a === "tr-seg" ? "tab" : /close|quit|flee|cancel|stay|uncheck|-no$|hide/.test(a) || el.dataset.v === "no" ? "close" : p === "true" ? "off" : p === "false" ? "on" : "tap");

      case "chime": this.tone(880, t, 0.5, "triangle", 0.45); this.tone(1320, t + 0.09, 0.6, "triangle", 0.35); break;
      case "coin": this.tone(988, t, 0.09, "square", 0.25); this.tone(1319, t + 0.08, 0.3, "square", 0.22); break;
      case "paper": this.noise(t, 0.16, 0.35, 2600); this.noise(t + 0.12, 0.12, 0.25, 3400); break;
      case "page": this.noise(t, 0.28, 0.3, 1400, "bandpass"); break;
      case "dice": [0, 0.07, 0.15, 0.24, 0.36].forEach((d, i) => this.noise(t + d, 0.03, 0.5 - i * 0.07, 3000)); this.buzz([8, 40, 8]); break;
      case "hit": this.tone(200, t, 0.16, "sine", 0.9, 60); this.noise(t, 0.08, 0.4, 900, "lowpass"); this.buzz(25); break;
      case "crit": this.tone(220, t, 0.18, "sine", 1, 55); this.tone(1480, t + 0.02, 0.35, "triangle", 0.4); this.buzz([30, 30, 30]); break;
      case "heal": [523, 659, 784].forEach((f, i) => this.tone(f, t + i * 0.07, 0.35, "sine", 0.35)); break;
      case "boop": this.tone(520, t, 0.11, "sine", 0.6, 760); break;

function sigSend(kind, text) {

  if (Store.backend === "local") { setTimeout(() => Buddies.deliver(payload), 300); return; }
  Store.patchMeta("signal", { [to]: payload });
  // Un câlin, du courage, une pensée : l'autre reçoit aussi une notification sur son iPhone,
  // une par geste envoyé (chaque geste a son propre petit document, relu puis effacé par le service).
  if (kind !== "mot") {
    Store.write({ p: "gestes/" + payload.id, o: "set", d: { to, from: me, kind, t: payload.t } });

function render(force) {

  if (!force) { if (!render.q) render.q = requestAnimationFrame(() => { render.q = 0; render(1); }); return true; }
  if (render.q) { cancelAnimationFrame(render.q); render.q = 0; }
  if (force === 1) force = false;
  try { renderNow(force); return true; } catch (e) { console.error(e); }
  const tries = [() => { S.layer = null; S.fight = null; S.game = null; S.arc = null; S.story = null; S.pz = null; }, () => { S.tab = "home"; S.obShown = true; }];
  for (const fix of tries) {
    fix();
    try { renderNow(true); toast("Cet écran n'a pas pu s'afficher, on est revenus en lieu sûr."); return false; } catch (e) { console.error(e); }
  }
  crashView();
