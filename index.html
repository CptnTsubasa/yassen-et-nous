<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Mise en page : une colonne façon appli de poche, des cartes à jouer au centre, une barre d'onglets en bas. */
/* Ambiance : un cocon. Pastels poudrés pour les fonds (--m*), une encre plus soutenue de la même teinte pour le texte coloré (--i*). */
:root {
  --bg: #F6F2F5; --surface: #FFFFFF; --surface-2: #EFE8EF; --line: #E3D9E2;
  --fg: #3A2F40; --muted: #7E7385; --accent: #B0506C; --on-accent: #FFFFFF;
  --m1: #F4CDD6; --m2: #F3E2B3; --m3: #C9E2D3; --m4: #DDD1EE; --m5: #CDDEF1; --m6: #F7D5C2; --m7: #C6E7E4; --m8: #EED3E8;
  --on-m1: #3A2F40; --on-m2: #3A2F40; --on-m3: #3A2F40; --on-m4: #3A2F40; --on-m5: #3A2F40; --on-m6: #3A2F40; --on-m7: #3A2F40; --on-m8: #3A2F40;
  --i1: #A3445F; --i2: #82651A; --i3: #3B7558; --i4: #6A4F9C; --i5: #3A679A; --i6: #A0532C; --i7: #2F7370; --i8: #8C4582;
  --shadow: 0 1px 0 rgba(58,47,64,.04), 0 12px 28px -20px rgba(58,47,64,.35);
  --f-display: "Young Serif", "Georgia", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1C1820; --surface: #27212C; --surface-2: #312A37; --line: #40374A;
  --fg: #EFE7F0; --muted: #B5AABB; --accent: #E8A0B4; --on-accent: #2A1C24;
  --m1: #503040; --m2: #4D442C; --m3: #2E4639; --m4: #3D3454; --m5: #2D3D53; --m6: #533B2F; --m7: #2A4745; --m8: #4A3048;
  --on-m1: #F1E9F0; --on-m2: #F1E9F0; --on-m3: #F1E9F0; --on-m4: #F1E9F0; --on-m5: #F1E9F0; --on-m6: #F1E9F0; --on-m7: #F1E9F0; --on-m8: #F1E9F0;
  --i1: #F2AFC0; --i2: #E8CD8A; --i3: #A2D3B8; --i4: #CBB9EC; --i5: #ADCAEE; --i6: #F2BB9C; --i7: #9ED8D3; --i8: #E9B2DE;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 28px -20px rgba(0,0,0,.7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1C1820; --surface: #27212C; --surface-2: #312A37; --line: #40374A;
  --fg: #EFE7F0; --muted: #B5AABB; --accent: #E8A0B4; --on-accent: #2A1C24;
  --m1: #503040; --m2: #4D442C; --m3: #2E4639; --m4: #3D3454; --m5: #2D3D53; --m6: #533B2F; --m7: #2A4745; --m8: #4A3048;
  --on-m1: #F1E9F0; --on-m2: #F1E9F0; --on-m3: #F1E9F0; --on-m4: #F1E9F0; --on-m5: #F1E9F0; --on-m6: #F1E9F0; --on-m7: #F1E9F0; --on-m8: #F1E9F0;
  --i1: #F2AFC0; --i2: #E8CD8A; --i3: #A2D3B8; --i4: #CBB9EC; --i5: #ADCAEE; --i6: #F2BB9C; --i7: #9ED8D3; --i8: #E9B2DE;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 28px -20px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 128px; display: grid; gap: 22px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 400; font-size: 2.1rem; line-height: 1; letter-spacing: .01em; }
.logo span { color: var(--accent); }
.hello { color: var(--muted); font-size: 1rem; margin-top: -14px; }
.hello.dedi { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.2; color: var(--fg); text-wrap: balance; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; font-size: 1.4rem; line-height: 1; }
.icon-btn svg { width: 22px; height: 22px; }
.sec { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; transition: transform .15s ease; text-align: center; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.c { background: var(--c); color: var(--on-c); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; padding: 6px 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: .92rem; min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.chip[disabled] { opacity: .5; cursor: default; }

.panel { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

/* Rendez-vous du jour */
.daily { position: relative; overflow: hidden; background: var(--m4); color: var(--on-m4); border-radius: 26px; padding: 20px; display: grid; gap: 14px; }
.daily .date { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1; color: var(--i4); }
.daily h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
.daily .q { font-size: 1.22rem; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
.daily .d { display: grid; gap: 4px; padding-top: 12px; border-top: 1px dashed color-mix(in srgb, var(--on-m4) 25%, transparent); }
.daily .d b { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.daily .btn.ghost { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--fg); }
.daily .link { color: color-mix(in srgb, var(--on-m4) 75%, transparent); }
.daily-off { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: var(--surface-2); color: var(--muted); font-size: .92rem; }

/* Tuiles des modes */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; overflow: hidden; text-align: left; background: var(--c); color: var(--on-c); border-radius: 22px; padding: 16px 14px 14px; min-height: 148px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; transition: transform .18s ease; }
.tile:active { transform: scale(.98); }
.tile .g { position: absolute; top: 6px; right: 12px; font-size: 3.4rem; line-height: 1; opacity: .3; color: var(--ic); }
.tile h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.28rem; line-height: 1.1; }
.tile p { font-size: .84rem; line-height: 1.35; opacity: .92; }
.tile.wide { grid-column: 1 / -1; min-height: 116px; }
@media (max-width: 340px) { .tiles { grid-template-columns: 1fr; } }

/* Notre carnet */
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 14px 10px; }
.tally div { display: grid; gap: 4px; }
.tally b { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.tally span { font-size: .84rem; color: var(--muted); line-height: 1.25; }
.last-souv { text-align: left; display: grid; gap: 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
.last-souv .hand { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.15; overflow-wrap: anywhere; }

.sync { font-size: .8rem; color: var(--muted); text-align: center; text-wrap: balance; }

/* Barre d'onglets */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 9px 2px 10px; font-size: .74rem; font-weight: 600; color: var(--muted); }

const fr = s => s.replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TYPE = { dec: "question", his: "question", con: "question", ave: "question", dev: "devinette", qui: "qui", eti: "scenario", def: "defi" };
const AMB_TONE = { d: "d", r: "r", c: "l", t: "p" };
const CARDS = {}, POOL = {};
for (const [cat, list] of Object.entries(RAW)) {
  POOL[cat] = [];
  list.forEach((line, i) => {
    const p = line.split("|");
    const c = cat === "def"
      ? { text: p[0], duree: +p[1], budget: +p[2], amb: p[3], lieu: p[4], tone: AMB_TONE[p[3]] }
      : { tone: p[0], text: p[1] };
    c.id = cat + "-" + (i + 1); c.cat = cat; c.type = TYPE[cat]; c.text = fr(c.text);
    CARDS[c.id] = c; POOL[cat].push(c.id);
  });
}
const BASE_POOL = JSON.parse(JSON.stringify(POOL));
// Les cartes créées par vous deux rejoignent le paquet. Une carte supprimée reste
// connue de CARDS le temps de la visite, pour ne pas casser une partie en cours.
function rebuildCustom() {
  for (const k in POOL) POOL[k] = BASE_POOL[k].slice();
  Store.cols.cartes.forEach(x => {
    if (!POOL[x.cat] || !x.text) return;
    const id = "p-" + x.id;
    const c = { id, cat: x.cat, type: TYPE[x.cat], text: fr(x.text), tone: x.tone || "l", custom: true, from: x.from };
    if (x.cat === "def") Object.assign(c, { duree: +x.duree || 15, budget: 0, amb: { l: "c", d: "d", r: "r", p: "t" }[c.tone], lieu: "x" });
    CARDS[id] = c; POOL[x.cat].push(id);
  });
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const hash = n => { let t = (n + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0); };

/* ───────────────────────── Stockage ─────────────────────────
   Données partagées (album, capsule, aventures, lettres, favoris, progression).
   Avec la base de l'artifact : synchronisées entre vos appareils.
   Sans elle (visiteur non connecté, aperçu) : enregistrées sur ce seul appareil. */
const LS = "entre-nous:v1";
const DEFAULT_META = { couple: { a: "", b: "", style: "partage" }, progress: { seen: [], parties: 0 }, puzzle: { img: "" } };
const Store = {
  backend: "local", db: null, q: {}, unsubs: [],
  cols: { capsule: [], aventures: [], lettres: [], favoris: [], cartes: [] },
  meta: JSON.parse(JSON.stringify(DEFAULT_META)),
  loadLocal() {
    try {
      const d = JSON.parse(lsGet(LS) || "null");
      if (!d) return;
      for (const k in this.cols) if (Array.isArray(d.cols && d.cols[k])) this.cols[k] = d.cols[k];
      for (const k in this.meta) if (d.meta && d.meta[k]) this.meta[k] = { ...DEFAULT_META[k], ...d.meta[k] };
    } catch (e) { /* données locales illisibles : on repart à vide */ }
  },
  saveLocal() { if (this.backend === "local") lsSet(LS, JSON.stringify({ cols: this.cols, meta: this.meta })); },
  async connect() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) return;
    this.db = db; this.backend = "db";
    for (const col of Object.keys(this.cols)) {
      this.unsubs.push(db.collection(col).onSnapshot(snap => {
        this.cols[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, e => this.fail(e)));
    }
    for (const m of Object.keys(this.meta)) {
      this.unsubs.push(db.doc("meta/" + m).onSnapshot(s => {
        this.meta[m] = s.exists ? { ...DEFAULT_META[m], ...s.data() } : { ...DEFAULT_META[m] };
        render();
      }, e => this.fail(e)));
    }
    render();
  },
  // Écrit en ligne quand c'est possible. Si ce compte n'a pas le droit d'écrire (lien public,
  // accès en lecture), on bascule sur ce téléphone et la modification y est appliquée.
  write(path, fn, local) {
    if (!this.db) { local(); this.saveLocal(); return Promise.resolve(); }
    const p = (this.q[path] || Promise.resolve()).then(fn).catch(e => {
      if (e && e.code === "invalid_argument" && this.db) { this.goLocal(); local(); this.saveLocal(); render(true); }
      else this.fail(e);
    });
    this.q[path] = p; return p;
  },
  goLocal() {
    this.unsubs.forEach(u => { try { u(); } catch (e) { /* déjà fermé */ } });
    this.unsubs = []; this.db = null; this.backend = "local"; this.saveLocal();
  },
  add(col, data) {
    data = { ...data, createdAt: Date.now() };
    const id = this.db ? this.db.collection(col).doc().id : uid();
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).set(data),
      () => { if (!this.cols[col].some(x => x.id === id)) this.cols[col].push({ id, ...data }); });
  },
  put(col, id, data) {
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).set(data), () => {
      const i = this.cols[col].findIndex(x => x.id === id);
      if (i >= 0) this.cols[col][i] = { id, ...data }; else this.cols[col].push({ id, ...data });
    });
  },
  update(col, id, patch) {
    patch = { ...patch, updatedAt: Date.now() };
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).update(patch),
      () => { const it = this.cols[col].find(x => x.id === id); if (it) Object.assign(it, patch); });
  },
  remove(col, id) {
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).delete(),
      () => { this.cols[col] = this.cols[col].filter(x => x.id !== id); });
  },
  setMeta(m, data) {
    this.meta[m] = { ...data };
    return this.write("meta/" + m, () => this.db.doc("meta/" + m).set(data), () => {});
  },
  fail(e) {
    const code = e && e.code;
    if (code === "invalid_argument" || code === "revoked") { if (this.db) { this.goLocal(); render(true); } }
    else if (code === "quota_exceeded") toast("La capsule est pleine. Supprimez quelques éléments pour en ajouter.");
    else toast("L'enregistrement n'a pas abouti. Réessaie dans un instant.");
  }
};

/* ───────────────────────── Code de transfert ─────────────────────────
   Pour rassembler deux progressions sans compte : un code à s'envoyer par message.
   Les éléments gardent leur identifiant, donc fusionner deux fois ne crée pas de doublons. */
function makeCode() {
  const json = JSON.stringify({ v: 1, cols: Store.cols, meta: { couple: Store.meta.couple, progress: Store.meta.progress } });
  const bytes = new TextEncoder().encode(json);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return "YS1:" + btoa(bin);
}
async function mergeCode(code) {
  let data;
  try {
    const bin = atob(code.replace(/\s+/g, "").replace(/^YS1:/, ""));
    data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  } catch (e) { data = null; }
  if (!data || data.v !== 1 || typeof data.cols !== "object") { toast("Ce code n'est pas reconnu. Copie-le en entier, depuis « YS1: » jusqu'au bout."); return; }
  const ts = o => o.updatedAt || o.createdAt || 0;
  let added = 0;
  for (const col of Object.keys(Store.cols)) {
    const inc = Array.isArray(data.cols[col]) ? data.cols[col] : [];
    for (const it of inc) {
      if (!it || typeof it !== "object" || typeof it.id !== "string" || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(it.id)) continue;
      const { id, ...body } = it;
      const cur = Store.cols[col].find(x => x.id === id);
      if (cur && ts(cur) >= ts(it)) continue;
      await Store.put(col, id, body); added++;
    }
  }
  const p = Store.meta.progress, q = (data.meta && data.meta.progress) || {};
  const uni = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])].filter(x => typeof x === "string");
  await Store.setMeta("progress", { ...p, seen: uni(p.seen, q.seen), endings: uni(p.endings, q.endings),
    parties: Math.max(p.parties || 0, +q.parties || 0), puzzles: Math.max(p.puzzles || 0, +q.puzzles || 0) });
  const c = couple(), qc = (data.meta && data.meta.couple) || {};
  if ((!c.a || !c.b) && typeof qc.a === "string" && typeof qc.b === "string" && qc.a && qc.b) {
    await Store.setMeta("couple", { a: qc.a.slice(0, 24), b: qc.b.slice(0, 24), style: c.style || "partage" });
  }
  toast(added ? `C'est fusionné : ${added} élément${added > 1 ? "s" : ""} ajouté${added > 1 ? "s" : ""} ou mis à jour` : "Tout était déjà à jour");
}

/* ───────────────────────── Transport des réponses ─────────────────────────
   Une manche collecte des réponses par « emplacement » (prédiction, réponse, vote…).
   V1 : un seul appareil, l'écran de masquage assure le secret.
   Un futur mode à distance (code de partie, deux téléphones) fournira un transport
   ayant la même interface, appuyé sur une salle partagée. Il n'est pas encore branché. */
const LocalTransport = {
  kind: "local",
  submit(g, key, value) { g.ans[key] = value; },
  isComplete(g, slots) { return slots.every(s => g.ans[s.key] != null); }
};
const TRANSPORTS = { local: LocalTransport };

  drafts: {}, confirm: null, editAv: null, mot: "mot", openLetters: {}
};

const couple = () => Store.meta.couple || DEFAULT_META.couple;
const nm = k => (couple()[k] || "").trim() || (k === "a" ? "Partenaire 1" : "Partenaire 2");
const other = k => (k === "a" ? "b" : "a");
const isFav = id => Store.cols.favoris.some(f => f.id === id);
const seenSet = () => new Set(Store.meta.progress.seen || []);

function toast(msg) {

  t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.innerHTML = ""; }, 2800);
}

function flushSeen(ids, party) {
  const set = seenSet(); let added = 0;
  ids.forEach(id => { if (!set.has(id)) { set.add(id); added++; } });
  if (!added && !party) return 0;
  const p = Store.meta.progress;
  Store.setMeta("progress", { ...p, seen: [...set], parties: (p.parties || 0) + (party ? 1 : 0) });
  return added;
}

/* ───────────────────────── Paquets de cartes ───────────────────────── */
function freshFirst(ids) {
  const seen = seenSet();
  return shuffle(ids.filter(i => !seen.has(i))).concat(shuffle(ids.filter(i => seen.has(i))));
}
function cardCount(mode, dur, style) {
  const base = { 5: 4, 10: 7, 20: 12, 30: 18 }[dur] || 7;
  if (mode === "qui") return Math.round(base * 1.5);
  return style === "secret" ? Math.max(3, Math.round(base * 0.75)) : base;
}
function moodPool(mood) {
  const quick = POOL.def.filter(id => CARDS[id].duree <= 15);
  const all = [...POOL.dec, ...POOL.his, ...POOL.con, ...POOL.ave, ...POOL.dev, ...POOL.qui, ...POOL.eti, ...quick];
  const ok = {
    rire: c => c.tone === "d",
    decouvrir: c => (["dec", "dev", "ave", "eti"].includes(c.cat) && c.tone !== "r") || (c.cat === "qui" && c.tone === "l") || (c.cat === "def" && c.amb === "t"),
    romantique: c => c.tone === "r",
    profond: c => c.tone === "p",
    surpris: c => c.tone !== "p"
  }[mood] || (() => true);
  return all.filter(id => ok(CARDS[id]));
}
function buildDeck(st) {
  const n = cardCount(st.mode, st.dur, st.style);
  if (st.mode === "questions") {
    const ids = st.cat === "mix" ? [...POOL.dec, ...POOL.his, ...POOL.con, ...POOL.ave, ...POOL.dev] : POOL[st.cat];
    return freshFirst(ids).slice(0, n);
  }
  if (st.mode === "qui") return freshFirst(POOL.qui).slice(0, n);
  if (st.mode === "histoire") return freshFirst(POOL.his).slice(0, n);
  if (st.mode === "etsi") return freshFirst(POOL.eti).slice(0, n);
  // Surprise : on alterne les types de cartes pour garder du rythme.
  const groups = {};
  moodPool(st.mood).forEach(id => { const t = CARDS[id].type === "question" && CARDS[id].cat === "his" ? "souvenir" : CARDS[id].type; (groups[t] = groups[t] || []).push(id); });
  const lists = shuffle(Object.values(groups).map(freshFirst));
  const out = [];
  for (let r = 0; out.length < n && lists.some(l => l.length > r); r++) lists.forEach(l => { if (l[r] && out.length < n) out.push(l[r]); });
  return out;
}
function flowOf(c, mode) {
  if (c.type === "qui") return "pick";
  if (c.type === "defi") return "defi";
  if (c.type === "scenario") return "idea";
  if (c.cat === "his" && (mode === "histoire" || mode === "surprise")) return "both";
  return "guess";
}
function slotsOf(g) {
  const T = g.T, G = other(T);
  switch (g.flow) {
    case "guess": return [
      { who: G, key: "guess", kind: "text", label: `Ta prédiction : que va répondre ${nm(T)} ?` },
      { who: T, key: "answer", kind: "text", label: "Ta vraie réponse" }];
    case "pick": return [{ who: "a", key: "a", kind: "pick" }, { who: "b", key: "b", kind: "pick" }];
    case "both": return [{ who: "a", key: "a", kind: "text", label: "Ta réponse" }, { who: "b", key: "b", kind: "text", label: "Ta réponse" }];
    case "idea": return [{ who: "a", key: "a", kind: "text", label: "Ton idée" }, { who: "b", key: "b", kind: "text", label: "Ton idée" }];
    default: return [];
  }
}

/* ───────────────────────── Partie ───────────────────────── */
function startGame(st, deck) {
  S.game = {
    mode: st.mode, style: st.style, setup: { ...st }, deck: deck || buildDeck(st), i: 0,
    startAt: Date.now(), first: Math.random() < 0.5 ? "a" : "b", seen: [], transport: "local", stats: null
  };
  if (!S.game.deck.length) { toast("Aucune carte ne correspond à ce choix."); S.game = null; return; }
  enterCard();
  S.layer = { type: "game" };
}
function enterCard() {
  const g = S.game, c = CARDS[g.deck[g.i]];
  g.flow = flowOf(c, g.mode);
  g.T = (g.i % 2 === 0) === (g.first === "a") ? "a" : "b";
  g.ans = {}; g.slot = 0; g.saved = {}; g.count = 0;
  g.talk = pickOne(g.flow === "pick" ? PICK_TALK : GUESS_TALK);
  if (!g.seen.includes(c.id)) g.seen.push(c.id);
  if (g.flow === "defi") g.phase = "open";
  else if (g.style === "secret") g.phase = "hand";
  else g.phase = { guess: "g", pick: "count", both: "open", idea: "open" }[g.flow];
}
function nextCard() {
  const g = S.game;
  if (g.i + 1 >= g.deck.length) return endGame();
  g.i++; enterCard();
}
function endGame() {
  const g = S.game;
  const fresh = flushSeen(g.seen, true);
  g.stats = { played: g.seen.length, fresh };
  g.phase = "end";
}
function quitGame() {
  if (S.game && S.game.phase !== "end") flushSeen(S.game.seen, false);
  S.game = null; S.layer = null;
}

      </article>`; }).join("") : empty("Pas encore de favoris", "Touchez l'étoile ☆ sur une carte pendant une partie pour la retrouver ici.");
  } else {
    const defis = cap.filter(x => x.kind === "defi").map(x => ({ ...x, _t: "Défi relevé" }));
    const avs = Store.cols.aventures.filter(a => a.statut === "realisee").map(x => ({ ...x, text: x.title, _t: "Aventure réalisée" }));
    const items = byDate([...defis, ...avs]);
    body = items.length ? items.map(x => `
      <article class="item">
        <span class="badge">${x._t}</span>
        <p class="t">${esc(x.text)}</p>
        <div class="tools"><span class="by">${fmtTs(x.doneAt || x.createdAt)}</span>${x.kind === "defi" ? confirmRow("capsule", x.id) : ""}</div>
      </article>`).join("") : empty("Rien de coché pour l'instant", "Les défis relevés et les aventures réalisées viendront se ranger ici.");
  }
  return `
  <header class="top"><h1 class="logo">Notre <span>capsule</span></h1></header>
  <p class="hello">Les réponses, les mots et les moments qu'on veut garder.</p>
  <div class="seg" role="group" aria-label="Rubriques de la capsule">${segs}</div>
  <div class="stack">${body}</div>`;
}
function empty(title, txt) { return `<div class="empty"><strong>${esc(fr(title))}</strong><p>${esc(fr(txt))}</p></div>`; }

/* ───────────────────────── Vues : aventures ───────────────────────── */
function viewAventures() {
  const all = Store.cols.aventures;
  const groups = AV_STATUT.map(([k, l]) => {
    const items = byDate(all.filter(a => (a.statut || "afaire") === k));
    return `<section class="stack" aria-label="${l}">
      <div class="group-h"><h2 class="sec">${l}</h2><span class="small muted">${items.length}</span></div>
      ${items.length ? items.map(avItem).join("") : `<p class="small muted">Rien ici pour le moment.</p>`}
    </section>`;
  }).join("");
  return `
  <header class="top"><h1 class="logo">Prochaine <span>aventure</span></h1></header>
  <p class="hello">Les rendez-vous qu'on a envie de vivre, du plus simple au plus fou.</p>
  <div class="row"><button class="btn" data-a="sheet" data-name="aventure">Ajouter une idée</button></div>
  ${all.length ? groups : empty("La liste est vide", "Ajoutez une idée ici, ou depuis les modes « Et si on… ? » et « Défis complices ».")}`;
}
function avItem(a) {
  const st = a.statut || "afaire";
  return `<article class="item">
    <p class="t">${esc(a.title)}</p>
    <div class="row">${a.budget ? `<span class="badge">${esc(a.budget)}</span>` : ""}${a.duree ? `<span class="badge">${esc(a.duree)}</span>` : ""}${a.date && st === "planifiee" ? `<span class="badge">Le ${esc(fmtDay(a.date))}</span>` : ""}</div>
    ${a.note ? `<p class="small">${esc(a.note)}</p>` : ""}
    <div class="status" role="group" aria-label="Statut">${AV_STATUT.map(([k, l]) => `<button aria-pressed="${st === k}" data-a="av-status" data-id="${a.id}" data-v="${k}">${l}</button>`).join("")}</div>
    <div class="tools"><button class="link" data-a="av-edit" data-id="${a.id}">Modifier</button>${confirmRow("aventures", a.id)}</div>
  </article>`;
}

/* ───────────────────────── Vues : lettres ───────────────────────── */
function viewLettres() {
  const items = Store.cols.lettres.slice().sort((x, y) => (x.openOn || "").localeCompare(y.openOn || ""));
  const list = items.map(l => {
    const d = daysUntil(l.openOn);
    if (d > 0) return `<article class="letter sealed">
      <span class="seal" aria-hidden="true" style="font-size:1.05rem">Y&amp;S</span>
      <p class="when">À ouvrir le ${esc(fmtDay(l.openOn))}</p>
      <p class="t"><b>${esc(l.title || "Une carte pour plus tard")}</b></p>
      <p class="small muted">De ${esc(nm(l.from))} · encore ${d} jour${d > 1 ? "s" : ""} de patience. Le contenu reste scellé jusque-là.</p>
      <div class="tools">${confirmRow("lettres", l.id)}</div>
    </article>`;
    const open = S.openLetters[l.id];
    return `<article class="letter">
      <p class="when">${d === 0 ? "C'est le jour !" : "Ouverte depuis le " + esc(fmtDay(l.openOn))}</p>
      <p class="t"><b>${esc(l.title || "Une carte pour plus tard")}</b></p>
      <p class="small muted">De ${esc(nm(l.from))}, écrite le ${fmtTs(l.createdAt)}</p>
      ${open ? `<p class="hand" style="font-family:var(--f-hand);font-size:1.55rem;line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere">${esc(l.message)}</p>` : `<div class="row"><button class="btn" data-a="open-letter" data-id="${l.id}">Ouvrir la carte</button></div>`}
      <div class="tools">${confirmRow("lettres", l.id)}</div>
    </article>`;
  }).join("");
  return `
  <header class="top"><h1 class="logo">À ouvrir <span>plus tard</span></h1></header>
  <p class="hello">Un message, un souhait, une promesse : on l'écrit maintenant, on le lit le jour choisi.</p>
  <div class="row"><button class="btn" data-a="sheet" data-name="lettre">Écrire une carte</button></div>
  <div class="stack">${list || empty("Aucune carte scellée", "Écrivez un mot à relire dans un mois, pour vos six mois ou pour votre premier anniversaire.")}</div>`;
}

/* ───────────────────────── Vues : calque ───────────────────────── */
function layerHead(title, back) {
  return `<div class="g-head"><button class="icon-btn" data-a="${back || "close-layer"}" aria-label="Fermer">×</button><div class="g-prog"></div></div>${title ? `<h1 class="sheet-title">${esc(title)}</h1>` : ""}`;
}

function setupView() {
  const s = S.setup, m = MODES[s.mode];
  const chip = (k, v, label, extra = "") => `<button class="chip" aria-pressed="${s[k] === v}" data-a="setup" data-k="${k}" data-v="${v}" ${extra}>${esc(label)}</button>`;
  const n = cardCount(s.mode, s.dur, s.style);
  const perCard = Math.round((s.dur * 60) / n);
  const pace = perCard >= 90 ? `environ ${Math.round(perCard / 60 * 2) / 2} min par carte` : `environ ${Math.round(perCard / 5) * 5} s par carte`;
  return `
  ${layerHead("")}
  <section class="setup-hero" style="${cvar(m.c)}"><span class="g" aria-hidden="true">${m.glyph}</span><h1>${esc(m.title)}</h1><p>${esc(fr(m.desc))}</p></section>
  ${s.mode === "questions" ? `<div class="stack"><h2 class="sec">Catégorie</h2><div class="chips">${QCATS.map(([k, l]) => chip("cat", k, l)).join("")}</div></div>` : ""}
  ${s.mode === "surprise" ? `<div class="stack"><h2 class="sec">Votre humeur</h2><div class="chips">${MOODS.map(x => chip("mood", x.k, x.label)).join("")}</div></div>` : ""}
  <div class="stack"><h2 class="sec">Durée</h2><div class="chips">${[5, 10, 20, 30].map(d => chip("dur", d, d + " min")).join("")}</div></div>
  <div class="stack"><h2 class="sec">Façon de jouer</h2>
    <div class="opts" style="${cvar(m.c)}">
      <button class="opt" aria-pressed="${s.style === "partage"}" data-a="setup" data-k="style" data-v="partage"><b>Mode partagé</b><span>Un seul téléphone, posé entre vous. On répond à voix haute, chacun son tour.</span></button>
      <button class="opt" aria-pressed="${s.style === "secret"}" data-a="setup" data-k="style" data-v="secret"><b>Réponses secrètes</b><span>Chacun écrit ou vote en cachette, un écran masque la réponse, puis on révèle tout ensemble.</span></button>
      <button class="opt" disabled aria-disabled="true"><b>À distance · pas encore disponible</b><span>Deux téléphones reliés par un code de partie. Prévu pour une prochaine version.</span></button>
    </div>
  </div>
  ${rulesHtml(setupRules(s), "Comment on joue")}
  <p class="small muted">${n} cartes · ${pace}${s.mode === "qui" ? " · ça va vite, c'est voulu" : ""}</p>
  <button class="btn wide c" style="${cvar(m.c)}" data-a="start">C'est parti</button>`;
}

function cardHtml(c, g) {
  const m = CAT[c.cat];
  const fav = isFav(c.id);
  let forLine = "";
  if (g) {
    if (g.flow === "guess") forLine = c.type === "devinette" ? `${esc(nm(g.T))} demande à ${esc(nm(other(g.T)))} :` : `Question pour ${esc(nm(g.T))}`;
    else if (g.flow === "both") forLine = "Pour vous deux";
    else if (g.flow === "idea") forLine = "À imaginer ensemble";
    else if (g.flow === "pick") forLine = "Votez en secret";
  }
  const meta = c.type === "defi" ? `<div class="meta"><span class="badge">${DUREE[c.duree]}</span><span class="badge">${BUDGET[c.budget]}</span><span class="badge">${LIEU[c.lieu]}</span></div>` : "<span></span>";
  return `<article class="card" style="${cvar(m.c)}">
    <header class="card-band"><span class="suit" aria-hidden="true">${m.glyph}</span><span>${esc(m.label)}</span><span class="tone">${c.custom ? "Carte de " + esc(nm(c.from)) : c.type === "defi" ? AMB[c.amb] : TONE[c.tone]}</span>
      <button class="fav" data-a="fav" data-id="${c.id}" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${fav ? "★" : "☆"}</button></header>
    <div class="card-body">${forLine ? `<p class="card-for">${forLine}</p>` : ""}<p class="card-text">${esc(c.text)}</p></div>
    <footer class="card-foot">${meta}<span class="flip" aria-hidden="true">${m.glyph}</span></footer>
  </article>`;
}
const rulesHtml = (list, title = "Les règles") => `<div class="panel"><h2 class="sec">${title}</h2><ol class="rules">${list.map(r => `<li>${esc(fr(r))}</li>`).join("")}</ol></div>`;
function setupRules(s) {
  const sec = s.style === "secret";
  const r = {
    questions: sec
      ? ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine écrit sa prédiction en cachette, puis passe le téléphone.", "L'autre écrit sa vraie réponse, toujours en cachette.", "Vous révélez les deux en même temps, puis chacun explique son choix."]
      : ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine annonce sa prédiction à voix haute.", "L'autre donne sa vraie réponse.", "Vous en parlez : d'où vient la prédiction, qu'est-ce qui surprend ?"],
    qui: sec
      ? ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Chacun vote en cachette pour la personne qui correspond le mieux. On a le droit de voter pour soi.", "Les deux votes sont révélés ensemble, puis vous plaidez votre cause.", "Pas de points, pas de classement : seulement des fous rires."]
      : ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Lancez le compte à rebours : à « Pointez ! », chacun pointe du doigt la personne qui correspond le mieux. On a le droit de se désigner.", "Vous plaidez votre cause, exemples à l'appui.", "Pas de points, pas de classement : seulement des fous rires."],
    histoire: [sec ? "Chaque carte est une question pour vous deux. Chacun écrit sa réponse en cachette, puis vous révélez ensemble." : "Chaque carte est une question pour vous deux. Chacun répond à voix haute, à son tour.",
      "Prenez votre temps : ici, on raconte plus qu'on ne répond.", "Si vous êtes d'accord tous les deux, vous gardez vos réponses dans l'album."],
    etsi: [sec ? "Chaque carte propose un scénario. Chacun écrit son idée en cachette, puis vous les découvrez ensemble." : "Chaque carte propose un scénario. Imaginez la réponse ensemble, chacun apporte ses idées.",
      "Une idée vous donne vraiment envie ? Ajoutez-la à « Notre prochaine aventure » pour la vivre en vrai."],
    surprise: ["Le jeu pioche dans tous les modes (questions, devinettes, votes, souvenirs, scénarios, petits défis), selon votre humeur.", "Chaque carte affiche ses propres consignes, étape par étape."]
  }[s.mode] || [];
  return [...r, "Le joker est toujours là : on passe une carte sans avoir à se justifier."];
}
const instr = (label, txt) => `<div class="instr"><b>${esc(label)}</b><p>${txt}</p></div>`;
const skipLink = () => `<div class="joker"><button class="link" data-a="g-skip">Joker : on passe cette carte, sans explication</button></div>`;
const nextBtn = (label = "Carte suivante") => `<button class="btn wide" data-a="g-next">${label}</button>`;

function elapsed() {
  if (!S.game) return "";
  const s = Math.floor((Date.now() - S.game.startAt) / 1000);
  return Math.floor(s / 60) + ":" + pad(s % 60);
}

function gameView() {
  const g = S.game;
  if (g.phase === "end") return endView();
  const c = CARDS[g.deck[g.i]];
  const single = g.deck.length === 1;
  const head = `<div class="g-head"><button class="icon-btn" data-a="g-quit" aria-label="Quitter la partie">×</button>
    <div class="g-prog">${single ? "<span>Une carte, juste pour vous</span>" : `<span>Carte ${g.i + 1} sur ${g.deck.length}</span><div class="bar"><i style="width:${(g.i / g.deck.length) * 100}%"></i></div>`}</div>
    <span class="g-timer" id="g-timer">${elapsed()}</span></div>`;
  const last = g.i + 1 >= g.deck.length;
  const nextLabel = last ? "Terminer la partie" : "Carte suivante";
  const slots = slotsOf(g);
  const col = cvar(CAT[c.cat].c);

  // Réponses secrètes : masquage puis saisie, emplacement par emplacement.
  if (g.phase === "hand") {
    const s = slots[g.slot];
    return head + `<section class="curtain" style="${col}">
      <p>Passe le téléphone à</p><p class="who">${esc(nm(s.who))}</p>
      <p>${esc(nm(other(s.who)))}, on détourne les yeux le temps ${s.kind === "pick" ? "du vote" : "de la réponse"}.</p>
      <button class="btn" data-a="g-iam">C'est moi, ${esc(nm(s.who))}</button></section>` + skipLink();
  }
  if (g.phase === "input") {
    const s = slots[g.slot];
    if (s.kind === "pick") {
      return head + cardHtml(c, g) + `<div class="stack" style="${col}"><p class="lbl">${esc(nm(s.who))}, ton vote secret :</p>
        <div class="pickers"><button class="btn c" data-a="g-pick" data-v="a">${esc(nm("a"))}</button><button class="btn c" data-a="g-pick" data-v="b">${esc(nm("b"))}</button></div></div>` + skipLink();
    }
    const id = `ans-${g.i}-${g.slot}`;
    return head + cardHtml(c, g) + `<div class="field"><label for="${id}">${esc(nm(s.who))} · ${esc(s.label)}</label>
      <textarea class="hand" id="${id}" data-d placeholder="Quelques mots suffisent…">${dv(id)}</textarea></div>
      <button class="btn wide" data-a="g-submit">Valider en secret</button>` + skipLink();
  }
  if (g.phase === "ready") {
    return head + `<section class="curtain" style="${col}"><p class="who">Tout est prêt</p>
      <p>Installez-vous côte à côte. Les réponses vont apparaître en même temps.</p>
      <button class="btn" data-a="g-reveal">Révéler ensemble</button></section>` + skipLink();
  }
  if (g.phase === "reveal") return head + cardHtml(c, g) + revealView(g, c, slots, nextLabel);

  // Mode partagé et défis.
  if (g.flow === "guess") {
    const T = esc(nm(g.T)), G = esc(nm(other(g.T)));
    if (g.phase === "g") return head + cardHtml(c, g) + instr("Étape 1 · la prédiction", `${G}, devine ce que ${T} va répondre et dis-le à voix haute.`) + `<button class="btn wide" data-a="g-step" data-v="t">Prédiction faite</button>` + skipLink();
    if (g.phase === "t") return head + cardHtml(c, g) + instr("Étape 2 · la vraie réponse", `${T}, à toi de répondre, en toute sincérité.`) + `<button class="btn wide" data-a="g-step" data-v="talk">Réponse donnée</button>` + skipLink();
    return head + cardHtml(c, g) + instr("Étape 3 · on en parle", esc(g.talk) + MISS) + afterActions(g, c) + nextBtn(nextLabel);
  }
  if (g.flow === "pick") {
    if (g.phase === "count") return head + cardHtml(c, g) + instr("Vote à main levée", "Au signal, pointez du doigt en même temps la personne qui correspond le mieux.") + `<button class="btn wide" data-a="g-count">Lancer le compte à rebours</button>` + skipLink();
    if (g.phase === "counting") return head + cardHtml(c, g) + `<p class="count" style="${col}" aria-live="assertive">${g.count > 0 ? g.count : "Pointez !"}</p>`;
    return head + cardHtml(c, g) + instr("Alors, d'accord ?", esc(g.talk)) + nextBtn(nextLabel);
  }
  if (g.flow === "both") {
    const ia = `both-${g.i}-a`, ib = `both-${g.i}-b`;
    return head + cardHtml(c, g) + instr("À vous", "Répondez chacun votre tour, à voix haute. Notez quelques mots si vous voulez garder ce souvenir dans l'album.") + `
      <div class="field"><label for="${ia}">${esc(nm("a"))}</label><textarea class="hand" id="${ia}" data-d placeholder="Facultatif">${dv(ia)}</textarea></div>
      <div class="field"><label for="${ib}">${esc(nm("b"))}</label><textarea class="hand" id="${ib}" data-d placeholder="Facultatif">${dv(ib)}</textarea></div>
      <div class="actions">${albumCtl(g, "g-album-shared")}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  if (g.flow === "idea") {
    const id = `idea-${g.i}`;
    return head + cardHtml(c, g) + instr("À vous", "Chacun lance une idée, puis construisez la meilleure version ensemble.") + `
      <div class="field"><label for="${id}">Notre idée</label><textarea class="hand" id="${id}" data-d placeholder="Facultatif">${dv(id)}</textarea></div>
      <div class="actions">${g.saved.idea ? `<p class="small muted">Ajoutée à « Notre prochaine aventure » ✓</p>` : `<button class="btn ghost wide" data-a="g-idea-shared">Ajouter à nos aventures</button>`}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  // Défi
  return head + cardHtml(c, g) + instr(c.duree <= 15 ? "Maintenant ?" : "À programmer", c.duree <= 15 ? "Ce défi se relève tout de suite. Ou gardez-le pour plus tard." : "Ce défi demande un peu de temps : ajoutez-le à vos aventures pour le planifier.") + `
    <div class="actions"><div class="row">
      ${g.saved.done ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${col}" data-a="g-defi-done">Défi relevé</button>`}
      ${g.saved.later ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="g-defi-later">Pour plus tard</button>`}
    </div>${nextBtn(nextLabel)}</div>`;
}

function revealView(g, c, slots, nextLabel) {
  const col = cvar(CAT[c.cat].c);
  let body = "";
  if (g.flow === "pick") {
    const a = g.ans.a, b = g.ans.b;
    body = `<div class="reveal" style="${col}">
      <div class="rv"><b>${esc(nm("a"))} a voté</b><p class="pick">${esc(nm(a))}</p></div>
      <div class="rv"><b>${esc(nm("b"))} a voté</b><p class="pick">${esc(nm(b))}</p></div></div>
      <p class="verdict" style="${col}">${a === b ? `Même vote : c'est ${esc(nm(a))} !` : "Avis partagés… à vous de plaider !"}</p>
      ${instr("On en discute", esc(g.talk))}`;
  } else {
    body = `<div class="reveal">${slots.map(s => `<div class="rv"><b>${g.flow === "guess" ? (s.key === "guess" ? "Prédiction de " + esc(nm(s.who)) : "Réponse de " + esc(nm(s.who))) : esc(nm(s.who))}</b><p class="ans">${esc(g.ans[s.key])}</p></div>`).join("")}</div>`;
    if (g.flow === "guess") body += instr("On en parle", esc(g.talk) + MISS);
    if (g.flow === "both") body += instr("On en parle", "Qu'est-ce qui vous touche ou vous surprend dans la réponse de l'autre ?");
    if (g.flow === "idea") body += instr("On rêve un peu", "Laquelle de ces idées a envie de devenir réalité ?");
  }
  return body + afterActions(g, c) + nextBtn(nextLabel);
}

// Ce qu'on écrit en secret peut être intime : on ne le garde que si les deux sont d'accord.
function albumCtl(g, act) {
  if (g.saved.album) return `<p class="small muted">Gardé dans l'album ✓</p>`;
  if (g.saved.ask) return `<div class="confirm"><span>Vous êtes d'accord tous les deux pour garder ça ?</span><button class="btn" data-a="${act}">Oui, on garde</button><button class="btn ghost" data-a="g-album-no">Non, on laisse filer</button></div>`;
  return `<button class="btn ghost wide" data-a="g-album-ask">Garder dans l'album</button>`;
}
function afterActions(g, c) {
  const out = [];
  const canAlbum = c.cat === "his" && (g.flow === "both" || (g.flow === "guess" && g.style === "secret"));
  if (canAlbum) out.push(albumCtl(g, "g-album"));
  if (g.flow === "idea" && g.phase === "reveal") {
    ["a", "b"].forEach(k => out.push(g.saved["idea" + k] ? `<p class="small muted">Idée de ${esc(nm(k))} ajoutée aux aventures ✓</p>` : `<button class="btn ghost wide" data-a="g-idea" data-v="${k}">Ajouter l'idée de ${esc(nm(k))} aux aventures</button>`));
  }
  return out.length ? `<div class="actions">${out.join("")}</div>` : "";
}

function endView() {
  const g = S.game, st = g.stats;
  return `${layerHead("")}
  <div class="stack" style="text-align:center;justify-items:center;padding-top:20px">
    <p class="end-big">Joli moment</p>
    <p>${st.played} carte${st.played > 1 ? "s" : ""} jouée${st.played > 1 ? "s" : ""}${st.fresh ? `, dont ${st.fresh} ouverte${st.fresh > 1 ? "s" : ""} pour la première fois` : ""}.</p>
    <p class="muted small">Vos favoris, souvenirs et idées vous attendent dans la capsule et les aventures.</p>
  </div>
  <div class="actions">${g.setup && g.setup.mode !== "daily" ? `<button class="btn wide" data-a="replay-same">Rejouer</button>` : ""}<button class="btn ghost wide" data-a="close-layer">Retour à l'accueil</button></div>`;
}

/* Navigateur des défis (mode 3) */
function filteredDefis() {
  const f = S.df;
  return POOL.def.filter(id => {
    const c = CARDS[id];
    if (f.duree === "court" && c.duree > 5) return false;

}
function drawDefi() {
  const list = filteredDefis();

  const seen = seenSet(), pool = list.filter(id => id !== S.dfCur);
  const fresh = pool.filter(id => !seen.has(id) && !S.dfSeen.includes(id));
  S.dfCur = pickOne(fresh.length ? fresh : (pool.length ? pool : list));
  if (!S.dfSeen.includes(S.dfCur)) S.dfSeen.push(S.dfCur);
}

function startArc(game) {
  const A = { game, i: 0, score: 0, count: 0, first: Math.random() < 0.5 ? "a" : "b" };
  if (game === "tp") { A.deck = shuffle(TP.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "flags") { A.deck = shuffle(FLAGS.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "onde") { A.deck = shuffle(SPECTRA.map((_, i) => i)).slice(0, 6); ondeRound(A); }
  else if (game === "synchro") { A.prompt = pickOne(SYNC); A.round = 1; A.phase = "think"; }
  A.start = A.phase; A.phase = "rules";
  S.arc = A;
}
const turnOf = A => (A.i % 2 === 0 ? A.first : other(A.first));
function ondeRound(A) { A.target = 5 + Math.floor(Math.random() * 91); A.guess = 50; A.pts = 0; A.phase = "hand"; }
function arcCount(next) {
  const A = S.arc; A.phase = "count"; A.count = 3; A.after = next;
  const tick = () => {
    if (S.arc !== A || A.phase !== "count") return;
    A.count--;
    if (A.count < 0) { A.phase = next; render(true); return; }
    render(true); setTimeout(tick, A.count === 0 ? 1000 : 800);
  };
  setTimeout(tick, 800);
}
function specHtml(A, showTarget, showNeedle) {
  const band = (w, cls) => `<i class="band ${cls}" style="left:${A.target}%;width:${w * 2}%"></i>`;

}

  const A = S.arc, col = cvar(7);
  if (!A) return `${layerHead("")}
    <section class="setup-hero" style="${col}"><span class="g" aria-hidden="true">◎</span><h1>Arcade</h1><p>${esc(fr("Quatre mini-jeux rapides, à jouer côte à côte. Ici, on gagne ensemble ou on rit ensemble."))}</p></section>
    <div class="opts" style="${col}">${Object.entries(ARCADE).map(([k, g]) => `<button class="opt" data-a="arc-start" data-g="${k}"><b>${g.glyph}&nbsp; ${esc(fr(g.title))}</b><span>${esc(fr(g.desc))}</span></button>`).join("")}</div>`;
  const G = ARCADE[A.game], total = A.deck ? A.deck.length : 0;
  const prog = A.game === "synchro" ? `<span>${esc(G.title)} · manche ${A.round}</span>`
    : `<span>${esc(fr(G.title))} · ${Math.min(A.i + 1, total)} sur ${total}</span><div class="bar"><i style="width:${(A.i / total) * 100}%"></i></div>`;
  const right = A.game === "onde" ? `<span class="g-timer">${A.score} pt${A.score > 1 ? "s" : ""}</span>` : "";
  const head = `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog">${prog}</div>${right}</div>`;
  const endScr = (big, txt) => `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog"><span>${esc(fr(G.title))}</span></div></div>
    <div class="stack" style="text-align:center;justify-items:center;padding-top:24px"><p class="end-big">${esc(fr(big))}</p><p>${esc(fr(txt))}</p></div>
    <div class="actions"><button class="btn wide c" style="${col}" data-a="arc-replay">Rejouer</button><button class="btn line wide" data-a="arc-menu">Autres mini-jeux</button></div>`;
  const countHtml = `<p class="count" style="${col}" aria-live="assertive">${A.count > 0 ? A.count : fr("Dites-le !")}</p>`;
  if (A.phase === "rules") return head + rulesHtml(G.rules) + `<button class="btn wide c" style="${col}" data-a="arc-begin">C'est parti</button>`;

  if (A.game === "tp" || A.game === "flags") {
    if (A.phase === "end") return endScr("C'était la dernière !", "Un choix vous a surpris ? C'est le bon moment pour en reparler.");
    const q = A.game === "tp"
      ? `<div class="duel"><div class="side" style="${cvar(5)}">${esc(TP[A.deck[A.i]][0])}</div><span class="ou">ou</span><div class="side" style="${cvar(6)}">${esc(TP[A.deck[A.i]][1])}</div></div>`
      : `<p class="flag-q">${esc(FLAGS[A.deck[A.i]])}</p><div class="flag-pair"><div style="background:var(--m3);color:var(--on-m3)">Green flag</div><div style="background:var(--m1);color:var(--on-m1)">Red flag</div></div>`;
    if (A.phase === "count") return head + q + countHtml;
    if (A.phase === "say") return head + q + instr(fr(A.game === "tp" ? "Pas le même choix ?" : "Pas d'accord ?"),
      esc(fr(A.game === "tp" ? "Vingt secondes chacun pour convaincre l'autre. La mauvaise foi est autorisée." : "Plaidez votre cause. Les exemples vécus comptent double.")))
      + `<button class="btn wide" data-a="arc-next">${A.i + 1 >= total ? "Terminer" : "Suivant"}</button>`;
    return head + q + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="say">3, 2, 1… répondez ensemble</button><div class="joker"><button class="link" data-a="arc-next">Passer</button></div>`;
  }

  if (A.game === "onde") {
    if (A.phase === "end") {
      const max = total * 4, r = A.score / max;
      return endScr(`${A.score} / ${max}`, r >= 0.75 ? "Télépathie confirmée." : r >= 0.5 ? "Vous êtes clairement sur la même fréquence." : r >= 0.25 ? "Quelques parasites sur la ligne, mais de très bons indices." : "La fréquence se cherche encore. Les indices, eux, étaient mémorables.");
    }
    const [L, R] = SPECTRA[A.deck[A.i]], g = turnOf(A), o = other(g);
    const labels = `<div class="spec-labels"><span>← ${esc(L)}</span><span>${esc(R)} →</span></div>`;
    if (A.phase === "hand") return head + curtainHtml(col, "Passe le téléphone à", g, `${esc(nm(o))}, ne regarde pas : ${esc(nm(g))} va découvrir la cible.`, "onde-iam");
    if (A.phase === "target") return head + specHtml(A, true, false) + labels
      + instr("Ton indice", esc(fr(`Trouve un exemple (un objet, un film, une situation…) qui se place pile dans la zone foncée, entre « ${L} » et « ${R} ». Dis-le à voix haute, une seule fois.`)))
      + `<button class="btn wide" data-a="onde-hide">J'ai mon indice : cacher la cible</button>`;
    if (A.phase === "guess") return head + specHtml(A, false, true) + labels
      + `<label class="lbl" for="onde-g">${esc(nm(o))}, place l'aiguille d'après l'indice de ${esc(nm(g))}</label><input type="range" id="onde-g" min="0" max="100" step="1" value="${A.guess}">`
      + `<button class="btn wide c" style="${col}" data-a="onde-ok">Valider</button>`;
    const msg = ["Raté… mais l'indice valait le détour.", "", "Pas loin !", "Tout près !", "En plein dans le mille !"][A.pts];
    return head + specHtml(A, true, true) + labels + `<p class="verdict" style="${col}">+${A.pts} point${A.pts > 1 ? "s" : ""} · ${esc(fr(msg))}</p>`
      + `<button class="btn wide" data-a="onde-next">${A.i + 1 >= total ? "Voir le score" : "Manche suivante"}</button>`;
  }

  if (A.game === "synchro") {
    if (A.phase === "win") return endScr("Synchro !", `Le même mot en ${A.round} manche${A.round > 1 ? "s" : ""}. Vos cerveaux se sont trouvés.`);
    if (A.phase === "lost") return endScr("Presque…", "Pas de synchro cette fois, mais quel chemin pour y arriver. On retente ?");
    const box = `<div class="panel" style="text-align:center;${col}">${A.round === 1
      ? `<p class="card-for">Pensez chacun, sans rien dire, à…</p><p class="big-word">${esc(A.prompt)}</p>`
      : `<p class="card-for">Manche ${A.round}</p><p class="big-word" style="font-size:1.6rem">Un mot qui relie vos deux derniers mots</p>`}</div>`;
    if (A.phase === "count") return head + box + countHtml;
    if (A.phase === "said") return head + box + `<p class="lbl" style="text-align:center">${esc(fr("Alors, le même mot ?"))}</p><div class="actions"><div class="row"><button class="btn c" style="${col}" data-a="sync-same">Même mot !</button><button class="btn ghost" data-a="sync-diff">Pas encore</button></div></div>`;
    return head + box + instr("Comment jouer", esc(fr(A.round === 1
      ? "Au signal, dites votre mot en même temps. Si ce n'est pas le même, retenez les deux : à la manche suivante, chacun cherche un mot qui les relie."
      : "Retenez les deux mots qui viennent d'être dits, et cherchez chacun dans votre tête un mot qui fait le lien.")))
      + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="said">3, 2, 1… dites-le</button>`;
  }

  return "";
}

function endCount(st) {
  const all = Object.keys(st.nodes).filter(k => st.nodes[k].end), got = new Set(Store.meta.progress.endings || []);
  return [all.filter(k => got.has(st.id + ":" + k)).length, all.length];
}
function storyGo(to) {
  const s = S.story, st = STORY[s.id];
  Object.assign(s, { node: to, steps: s.steps + 1, phase: "read", votes: {}, slot: 0, together: false, saved: false });
  if (st.nodes[to].end) {

    if (!e.includes(key)) Store.setMeta("progress", { ...p, endings: [...e, key] });
  }
}

    <section class="setup-hero" style="${cvar(8)}"><span class="g" aria-hidden="true">❦</span><h1>Il était une fois nous</h1><p>${esc(fr("Vous êtes les héros. Chaque choix que vous faites ensemble change la suite de l'histoire."))}</p></section>
    ${rulesHtml(["Lisez chaque page à voix haute, chacun son tour si vous voulez. Vos prénoms sont dans l'histoire.", "Les « Petites pauses » sont des questions pour vous deux, pour de vrai : prenez le temps d'y répondre.", "Choisissez la suite ensemble, ou votez en secret. En cas de désaccord, négociez ou tirez à pile ou face.", "Toutes les fins sont heureuses. Rejouez pour toutes les découvrir."], "Comment on joue")}
    <div class="stack"><h2 class="sec">Pour décider</h2><div class="chips">${chip("ensemble", "Ensemble, à voix haute")}${chip("secret", "Chacun vote en secret")}</div>
      <p class="small muted">${esc(fr("En vote secret, si vos choix diffèrent, vous négociez… ou vous laissez le hasard trancher."))}</p></div>
    <div class="stack"><h2 class="sec">Les histoires</h2><div class="opts">${STORIES.map(st => {
      const [f, t] = endCount(st);
      return `<button class="opt" style="${cvar(st.c)}" data-a="st-open" data-id="${st.id}"><b>${esc(st.title)}</b><span>${esc(st.mood)} · environ 10 min · ${f ? `${f} fin${f > 1 ? "s" : ""} découverte${f > 1 ? "s" : ""} sur ${t}` : `${t} fins à découvrir`}</span></button>`;
    }).join("")}</div></div>`;
  }
  const st = STORY[s.id], n = st.nodes[s.node], col = cvar(st.c);
  const head = `<div class="g-head"><button class="icon-btn" data-a="st-menu" aria-label="Retour aux histoires">×</button><div class="g-prog"><span>${esc(st.title)}</span></div><span class="g-timer">${n.end ? "Fin" : "Chapitre " + s.steps}</span></div>`;
  if (n.end) {
    const [f, t] = endCount(st);
    return head + `<article class="story-page end" style="${col}"><p class="card-for">Fin</p><h2 class="sheet-title">${esc(fr(n.end))}</h2><p class="story-text">${stx(n.t)}</p></article>
      <p class="small muted" style="text-align:center">Fins découvertes dans cette histoire : ${f} sur ${t}</p>
      <div class="actions">${s.saved ? `<p class="small muted">Gardée dans l'album ✓</p>` : `<button class="btn ghost wide" data-a="st-album">Garder cette fin dans l'album</button>`}
        <button class="btn wide c" style="${col}" data-a="st-open" data-id="${st.id}">${f < t ? "Rejouer pour trouver une autre fin" : "Rejouer l'histoire"}</button>
        <button class="btn line wide" data-a="st-menu">Choisir une autre histoire</button></div>`;
  }
  const page = `<article class="story-page" style="${col}"><p class="story-text">${stx(n.t)}</p></article>` + (n.talk ? instr("Petite pause", stx(n.talk)) : "");
  const who = s.slot === 0 ? "a" : "b";
  if (s.phase === "hand") return head + `<section class="curtain" style="${col}"><p>Vote secret · passe le téléphone à</p><p class="who">${esc(nm(who))}</p><p>${esc(nm(other(who)))}, on détourne les yeux.</p><button class="btn" data-a="st-iam">C'est moi, ${esc(nm(who))}</button></section>`;
  if (s.phase === "pick") return head + page + `<div class="stack"><p class="lbl">${esc(nm(who))}, ton choix secret :</p>${n.ch.map((c, i) => `<button class="choice" data-a="st-vote" data-v="${i}">${stx(c[0])}</button>`).join("")}</div>`;
  if (s.phase === "agree" || s.phase === "coin") {
    const c = n.ch[s.phase === "agree" ? s.votes.a : s.coin];
    return head + page + `<p class="verdict" style="${col}">${s.phase === "agree" ? "Même choix !" : `Le hasard a parlé : ce sera le choix de ${esc(nm(s.coinWho))}.`}</p><div class="choice mine" style="${col}">${stx(c[0])}</div><button class="btn wide c" style="${col}" data-a="st-go" data-to="${c[1]}">Continuer l'histoire</button>`;
  }
  if (s.phase === "disagree") return head + page + `<p class="verdict" style="${col}">Pas le même choix…</p>
    <div class="reveal">${["a", "b"].map(k => `<div class="rv"><b>${esc(nm(k))} a choisi</b><p>${stx(n.ch[s.votes[k]][0])}</p></div>`).join("")}</div>
    ${instr("À vous de négocier", "Chacun défend son choix en une phrase, puis vous décidez. Ou vous laissez le hasard trancher.")}
    <div class="actions">${["a", "b"].map(k => `<button class="btn ghost wide" data-a="st-go" data-to="${n.ch[s.votes[k]][1]}">On suit le choix de ${esc(nm(k))}</button>`).join("")}<button class="btn line wide" data-a="st-coin">Pile ou face</button></div>`;
  if (n.ch.length === 1) return head + page + `<button class="btn wide c" style="${col}" data-a="st-go" data-to="${n.ch[0][1]}">${stx(n.ch[0][0])}</button>`;
  if (S.storyStyle === "secret" && !s.together) return head + page + `<div class="stack"><p class="lbl">Les choix possibles</p>${n.ch.map(c => `<div class="choice ro">${stx(c[0])}</div>`).join("")}</div>
    <button class="btn wide c" style="${col}" data-a="st-vote-start">Voter en secret</button><div class="joker"><button class="link" data-a="st-together">Pour ce choix, on décide ensemble</button></div>`;
  return head + page + `<div class="stack"><p class="lbl">Décidez ensemble</p>${n.ch.map(c => `<button class="choice" data-a="st-go" data-to="${c[1]}">${stx(c[0])}</button>`).join("")}</div>`;
}

const pzStored = () => { const v = (Store.meta.puzzle || {}).img || ""; return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : ""; };
const pzImage = () => pzStored() || PZ_IMG;
function pzUpload(file) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const side = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement("canvas");
    cv.width = cv.height = 640;
    cv.getContext("2d").drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, 640, 640);
    URL.revokeObjectURL(url);
    let data = cv.toDataURL("image/jpeg", 0.82);
    if (data.length > 200000) data = cv.toDataURL("image/jpeg", 0.6);
    Store.setMeta("puzzle", { img: data }); render(true); toast("Le portrait de Yassen Jr. est en place");
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast("Cette image n'a pas pu être lue. Essaie avec une capture d'écran en JPEG ou PNG."); };
  im.src = url;
}
function startPuzzle() {
  const n = S.pzSize || 3, N = n * n;
  let order;
  do { order = shuffle([...Array(N).keys()]); } while (order.every((p, i) => p === i));
  S.pz = { n, order, sel: null, moves: 0, startAt: Date.now(), done: false, turn: Math.random() < 0.5 ? "a" : "b", peek: false };
}
function puzzleView() {
  const z = S.pz, img = pzImage(), col = cvar(2);
  if (!z) {
    const n = S.pzSize || 3, custom = !!pzStored();
    return `${layerHead("")}
    <section class="setup-hero" style="${col}"><span class="g" aria-hidden="true">◧</span><h1>Le puzzle de Yassen Jr.</h1><p>${esc(fr("À la mémoire de Yassen Jr., notre compagnon de série. Reconstituez son portrait, pièce par pièce, ensemble."))}</p></section>
    <img class="pz-img" src="${img}" alt="Portrait de Yassen Jr.">
    <div class="row"><label class="btn ghost" for="pz-file">Changer la photo</label><input class="vh" type="file" id="pz-file" accept="image/*">${custom ? `<button class="link" data-a="pz-reset-img">Revenir au portrait d'origine</button>` : ""}</div>
    ${rulesHtml(["Le portrait de Yassen Jr. est découpé en pièces mélangées.", "Touchez une pièce, puis une autre : elles échangent leur place.", "Jouez à deux en alternant : un échange chacun, à tour de rôle. Le prénom de la personne qui joue s'affiche au-dessus du puzzle.", "Besoin d'aide ? « Voir le modèle » affiche l'image complète.", "Aucun chrono ne presse : prenez votre temps."], "Comment on joue")}
    <div class="stack"><h2 class="sec">Nombre de pièces</h2><div class="chips">${[[3, "9 pièces"], [4, "16 pièces"], [5, "25 pièces"]].map(([v, l]) => `<button class="chip" aria-pressed="${n === v}" data-a="pz-size" data-v="${v}">${l}</button>`).join("")}</div></div>
    <button class="btn wide c" style="${col}" data-a="pz-start">Commencer le puzzle</button>`;
  }
  const N = z.n * z.n, placed = z.order.filter((p, i) => p === i).length;
  const pos = p => { const c = p % z.n, r = Math.floor(p / z.n); return `${(c / (z.n - 1)) * 100}% ${(r / (z.n - 1)) * 100}%`; };
  const grid = `<div class="pz${z.done ? " solved" : ""}" style="--n:${z.n};--pz:url('${img}')">${z.order.map((p, i) => `<button style="background-position:${pos(p)}" data-a="pz-tap" data-i="${i}" aria-pressed="${z.sel === i}" aria-label="Pièce ${i + 1}"${z.done ? " disabled" : ""}></button>`).join("")}</div>`;
  const head = `<div class="g-head"><button class="icon-btn" data-a="pz-menu" aria-label="Retour">×</button><div class="g-prog"><span>Le puzzle de Yassen Jr. · ${N} pièces</span></div><span class="g-timer">${z.moves} échange${z.moves > 1 ? "s" : ""}</span></div>`;
  if (z.done) {
    const min = Math.max(1, Math.round(z.time / 60000));
    return head + grid + `<p class="verdict" style="${col}">Yassen Jr. est de retour !</p>
      <p style="text-align:center">${esc(fr(`Reconstitué en ${z.moves} échanges et environ ${min} minute${min > 1 ? "s" : ""}, à deux. Pièce par pièce, comme vous.`))}</p>
      <div class="actions">${z.n < 5 ? `<button class="btn wide c" style="${col}" data-a="pz-harder">Rejouer avec ${(z.n + 1) * (z.n + 1)} pièces</button>` : `<button class="btn wide c" style="${col}" data-a="pz-start">Rejouer</button>`}<button class="btn line wide" data-a="pz-menu">Retour au puzzle</button></div>`;
  }
  return head + `<p class="lbl" style="text-align:center">À ${esc(nm(z.turn))} de jouer</p>`
    + (z.peek ? `<img class="pz-img peek" src="${img}" alt="Modèle du puzzle">` : "") + grid
    + `<p class="small muted" style="text-align:center">${placed} pièce${placed > 1 ? "s" : ""} bien placée${placed > 1 ? "s" : ""} sur ${N}</p>
      <div class="actions"><div class="row"><button class="btn ghost" data-a="pz-peek">${z.peek ? "Cacher le modèle" : "Voir le modèle"}</button><button class="btn line" data-a="pz-start">Mélanger à nouveau</button></div></div>`;
}

/* ───────────────────────── Rendu ───────────────────────── */
let pendingRender = false;
function render(force) {
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT" || ae.tagName === "SELECT");
  if (!force && typing) { pendingRender = true; return; }
  pendingRender = false;
  rebuildCustom();
  const app =document.getElementById("app"), layer = document.getElementById("layer");
  const views = { home: viewHome, capsule: viewCapsule, aventures: viewAventures, lettres: viewLettres };
  const tabs = [["home", "Jouer"], ["capsule", "Capsule"], ["aventures", "Aventures"], ["lettres", "Lettres"]];
  app.innerHTML = `<main class="wrap">${views[S.tab]()}</main>
    <nav class="nav" aria-label="Navigation"><div class="nav-in">${tabs.map(([k, l]) => `<button data-a="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("")}</div></nav>`;
  app.inert = !!S.layer;
  if (!S.layer) { layer.innerHTML = ""; return; }
  const key = S.layer.type + (S.game ? S.game.i + S.game.phase : "")
    + (S.arc ? S.arc.game + S.arc.i + S.arc.phase + (S.arc.round || "") : "") + (S.story ? S.story.id + S.story.node + S.story.phase : "");
  const prev = layer.firstElementChild, keep = prev && prev.dataset.key === key ? prev.scrollTop : 0;
  let html = "";
  if (S.layer.type === "setup") html = setupView();
  else if (S.layer.type === "game") html = gameView();
  else if (S.layer.type === "defis") html = defisView();
  else if (S.layer.type === "sheet") html = sheetView();
  else if (S.layer.type === "arcade") html = arcadeView();
  else if (S.layer.type === "story") html = storyView();
  else if (S.layer.type === "puzzle") html = puzzleView();
  layer.innerHTML = `<div class="layer" role="dialog" aria-modal="true" data-key="${esc(key)}"><div class="wrap">${html}</div></div>`;
  layer.firstElementChild.scrollTop = keep;
}

/* ───────────────────────── Actions ───────────────────────── */
function favToggle(id) {
  const c = CARDS[id]; if (!c) return;
  if (isFav(id)) { Store.remove("favoris", id); toast("Retirée des favoris"); }
  else { Store.put("favoris", id, { cardId: id, createdAt: Date.now() }); toast("Ajoutée aux favoris"); }
}
function addAventure(title, extra) {
  Store.add("aventures", { title: title.slice(0, 200), budget: "À définir", duree: "À définir", statut: "afaire", ...extra });
  toast("Ajoutée à « Notre prochaine aventure »");
}
function defiAventure(c) {
  addAventure(c.text.replace(/ /g, " "), { budget: ["Gratuit", "Moins de 20 €", "À définir"][c.budget], duree: c.duree >= 60 ? "Une soirée" : "Une heure", source: c.id });
}
function defiDone(c, day) {
  Store.add("capsule", { kind: "defi", text: c.text, cardId: c.id, ...(day ? { day } : {}) });
  toast("Défi relevé, bravo à vous deux");
}

const ACT = {
  tab(d) { S.tab = d.tab; S.confirm = null; window.scrollTo(0, 0); },
  "open-mode"(d) {
    if (d.mode === "puzzle") { S.layer = { type: "puzzle" }; S.pz = null; S.pzSize = S.pzSize || 3; return; }
    if (d.mode === "arcade") { S.layer = { type: "arcade" }; S.arc = null; return; }
    if (d.mode === "recit") { S.layer = { type: "story" }; S.story = null; S.storyStyle = couple().style === "secret" ? "secret" : "ensemble"; return; }
    if (d.mode === "defis") { S.layer = { type: "defis" }; S.dfSaved = {}; S.dfSeen = []; S.dfCur = null; return; }
    S.setup = { mode: d.mode, cat: "mix", mood: "surpris", dur: 10, style: couple().style || "partage" };
    S.layer = { type: "setup" };
  },
  "close-layer"() {
    if (S.layer && S.layer.type === "game") return quitGame();
    if (S.layer && S.layer.type === "defis" && S.dfSeen.length) flushSeen(S.dfSeen, false);
    S.layer = null; S.editAv = null;
  },
  setup(d) { S.setup[d.k] = d.k === "dur" ? +d.v : d.v; },
  start() { startGame(S.setup); },
  "replay-same"() { startGame(S.game.setup); },
  replay(d) { startGame({ mode: "questions", style: couple().style || "partage", dur: 5 }, [d.id]); },
  "daily-play"() { startGame({ mode: "daily", style: couple().style || "partage", dur: 5 }, [daily().q.id]); },
  "daily-done"() { const { d } = daily(); defiDone(d, todayStr()); flushSeen([d.id], false); },
  "daily-skip"() { lsSet("entre-nous:daily-skip", todayStr()); },
  "daily-unskip"() { lsSet("entre-nous:daily-skip", ""); },
  "g-quit"() { quitGame(); },
  "g-skip"() { nextCard(); },
  "g-next"() { nextCard(); },
  "g-step"(d) { S.game.phase = d.v; },
  "g-iam"() { S.game.phase = "input"; },
  "g-submit"() {
    const g = S.game, s = slotsOf(g)[g.slot], id = `ans-${g.i}-${g.slot}`;
    const v = (S.drafts[id] || "").trim();
    if (!v) { toast("Écris au moins quelques mots avant de valider."); return; }
    TRANSPORTS[g.transport].submit(g, s.key, v); clearDrafts(id); advanceSlot();
  },
  "g-pick"(d) { const g = S.game; TRANSPORTS[g.transport].submit(g, slotsOf(g)[g.slot].key, d.v); advanceSlot(); },
  "g-reveal"() { S.game.phase = "reveal"; },
  "g-count"() {
    const g = S.game; g.phase = "counting"; g.count = 3;
    const tick = () => {
      if (!S.game || S.game !== g || g.phase !== "counting") return;
      g.count--; if (g.count < 0) { g.phase = "talk"; render(true); return; }
      render(true); setTimeout(tick, g.count === 0 ? 1100 : 850);
    };
    setTimeout(tick, 850);
  },
  "g-album"() {
    const g = S.game, c = CARDS[g.deck[g.i]];
    const entries = slotsOf(g).map(s => ({ who: s.who, label: g.flow === "guess" ? (s.key === "guess" ? `Prédiction de ${nm(s.who)}` : `Réponse de ${nm(s.who)}`) : nm(s.who), text: g.ans[s.key] }));
    Store.add("capsule", { kind: "souvenir", question: c.text, cardId: c.id, entries }); g.saved.album = true; toast("Gardé dans l'album");
  },
  "g-album-shared"() {
    const g = S.game, c = CARDS[g.deck[g.i]], ia = `both-${g.i}-a`, ib = `both-${g.i}-b`;
    const entries = [["a", ia], ["b", ib]].map(([w, id]) => ({ who: w, label: nm(w), text: (S.drafts[id] || "").trim() })).filter(e => e.text);
    if (!entries.length) { toast("Notez au moins une réponse pour la garder."); return; }
    Store.add("capsule", { kind: "souvenir", question: c.text, cardId: c.id, entries }); clearDrafts(ia, ib); g.saved.album = true; toast("Gardé dans l'album");
  },
  "sync-copy"() {
    S.syncCode = makeCode();
    try {
      navigator.clipboard.writeText(S.syncCode).then(() => toast("Code copié : colle-le dans un message"), () => toast("Sélectionne le code ci-dessous pour le copier"));
    } catch (e) { toast("Sélectionne le code ci-dessous pour le copier"); }
  },
  "sync-merge"() {
    const code = draft("sync-in").trim();
    if (!code) { toast("Colle d'abord le code reçu."); return; }
    mergeCode(code).then(() => { clearDrafts("sync-in"); render(true); });
  },
  "pz-size"(d) { S.pzSize = +d.v; },
  "pz-start"() { startPuzzle(); },
  "pz-harder"() { S.pzSize = Math.min(5, S.pz.n + 1); startPuzzle(); },
  "pz-menu"() { S.pz = null; },
  "pz-peek"() { S.pz.peek = !S.pz.peek; },
  "pz-reset-img"() { Store.setMeta("puzzle", { img: "" }); toast("Retour au portrait d'origine de Yassen Jr."); },
  "pz-tap"(d) {
    const z = S.pz, i = +d.i;
    if (z.done) return;
    if (z.sel === null) { z.sel = i; return; }
    if (z.sel === i) { z.sel = null; return; }
    [z.order[z.sel], z.order[i]] = [z.order[i], z.order[z.sel]];
    z.sel = null; z.moves++; z.turn = other(z.turn);
    if (z.order.every((p, k) => p === k)) {
      z.done = true; z.time = Date.now() - z.startAt;
      const p = Store.meta.progress; Store.setMeta("progress", { ...p, puzzles: (p.puzzles || 0) + 1 });
    }
  },
  "arc-start"(d) { startArc(d.g); },
  "arc-begin"() { S.arc.phase = S.arc.start; },
  "arc-menu"() { S.arc = null; },
  "arc-replay"() { startArc(S.arc.game); },
  "arc-count"(d) { arcCount(d.v); },
  "arc-next"() { const A = S.arc; A.i++; A.phase = A.i >= A.deck.length ? "end" : "show"; },
  "onde-iam"() { S.arc.phase = "target"; },
  "onde-hide"() { S.arc.phase = "guess"; },
  "onde-ok"() { const A = S.arc, d = Math.abs(A.guess - A.target); A.pts = d <= 4 ? 4 : d <= 10 ? 3 : d <= 16 ? 2 : 0; A.score += A.pts; A.phase = "reveal"; },
  "onde-next"() { const A = S.arc; A.i++; if (A.i >= A.deck.length) A.phase = "end"; else ondeRound(A); },
  "sync-same"() { S.arc.phase = "win"; },
  "sync-diff"() { const A = S.arc; if (A.round >= 8) A.phase = "lost"; else { A.round++; A.phase = "think"; } },
  "st-style"(d) { S.storyStyle = d.v; },
  "st-open"(d) { S.story = { id: d.id, node: STORY[d.id].start, steps: 1, phase: "read", votes: {}, slot: 0 }; },
  "st-menu"() { S.story = null; },
  "st-go"(d) { storyGo(d.to); },
  "st-together"() { S.story.together = true; },
  "st-vote-start"() { Object.assign(S.story, { phase: "hand", slot: 0, votes: {} }); },
  "st-iam"() { S.story.phase = "pick"; },
  "st-vote"(d) {
    const s = S.story; s.votes[s.slot === 0 ? "a" : "b"] = +d.v;
    if (s.slot === 0) { s.slot = 1; s.phase = "hand"; } else s.phase = s.votes.a === s.votes.b ? "agree" : "disagree";
  },
  "st-coin"() { const s = S.story; s.coinWho = Math.random() < 0.5 ? "a" : "b"; s.coin = s.votes[s.coinWho]; s.phase = "coin"; },
  "st-album"() {
    const s = S.story, st = STORY[s.id], n = st.nodes[s.node];
    const plain = n.t.replace(/\{a\}/g, nm("a")).replace(/\{b\}/g, nm("b"));
    Store.add("capsule", { kind: "souvenir", question: fr(st.title + " · " + n.end), entries: [{ who: "a", label: "Notre fin", text: fr(plain) }] });
    s.saved = true; toast("Gardée dans l'album");
  },
  "g-album-ask"() { S.game.saved.ask = true; },
  "g-album-no"() { S.game.saved.ask = false; },
  "g-idea"(d) { const g = S.game, c = CARDS[g.deck[g.i]]; addAventure(g.ans[d.v], { note: c.text.replace(/ /g, " "), source: c.id }); g.saved["idea" + d.v] = true; },
  "g-idea-shared"() {
    const g = S.game, c = CARDS[g.deck[g.i]], id = `idea-${g.i}`, v = (S.drafts[id] || "").trim();
    if (!v) { toast("Notez votre idée pour l'ajouter."); return; }
    addAventure(v, { note: c.text.replace(/ /g, " "), source: c.id }); clearDrafts(id); g.saved.idea = true;
  },
  "g-defi-done"() { const g = S.game; defiDone(CARDS[g.deck[g.i]]); g.saved.done = true; },
  "g-defi-later"() { const g = S.game; defiAventure(CARDS[g.deck[g.i]]); g.saved.later = true; },
  fav(d) { favToggle(d.id); },
  df(d) { S.df[d.k] = d.v; },
  "df-draw"() { drawDefi(); },
  "df-pick"(d) { S.dfCur = d.id; if (!S.dfSeen.includes(d.id)) S.dfSeen.push(d.id); document.querySelector(".layer") && (document.querySelector(".layer").scrollTop = 0); },
  "df-done"() { defiDone(CARDS[S.dfCur]); S.dfSaved[S.dfCur + "done"] = true; },
  "df-later"() { defiAventure(CARDS[S.dfCur]); S.dfSaved[S.dfCur + "later"] = true; },
  "go-album"() { S.tab = "capsule"; S.capSeg = "album"; window.scrollTo(0, 0); },
  "cap-seg"(d) { S.capSeg = d.seg; S.confirm = null; },
  sheet(d) { if (d.kind) S.mot = d.kind; S.layer = { type: "sheet", name: d.name }; },
  "set-draft"(d) { S.drafts[d.k] = d.v; },
  "save-names"() {
    const c = couple();
    const a = draft("na", c.a).trim(), b = draft("nb", c.b).trim();
    if (!a || !b) { toast("Indiquez vos deux prénoms."); return; }
    Store.setMeta("couple", { a, b, style: draft("nstyle", c.style || "partage") });
    clearDrafts("na", "nb", "nstyle"); S.layer = null; toast("C'est noté, " + a + " et " + b);
  },
  "save-mot"() {
    const t = draft("mot-t").trim(); if (!t) { toast("Le mot est encore vide."); return; }
    Store.add("capsule", { kind: S.mot, text: t, from: draft("mot-f", "a") });
    clearDrafts("mot-t", "mot-f"); S.layer = null; S.tab = "capsule"; S.capSeg = "mots"; toast("Rangé dans la capsule");
  },
  "save-souvenir"() {
    const q = draft("sv-q").trim(), t = draft("sv-t").trim(), w = draft("sv-w", "nous");
    if (!q || !t) { toast("Donnez un nom au moment et quelques mots pour le raconter."); return; }
    Store.add("capsule", { kind: "souvenir", question: q, entries: [{ who: w === "nous" ? "a" : w, label: w === "nous" ? "Nous deux" : nm(w), text: t }] });
    clearDrafts("sv-q", "sv-t", "sv-w"); S.layer = null; S.tab = "capsule"; S.capSeg = "album"; toast("Gardé dans l'album");
  },
  "save-av"() {
    const ed = S.editAv && Store.cols.aventures.find(a => a.id === S.editAv);
    const title = draft("av-t", ed ? ed.title : "").trim();
    if (!title) { toast("Décrivez l'activité en quelques mots."); return; }
    const statut = draft("av-s", ed ? ed.statut : "afaire");
    const data = { title, budget: draft("av-b", ed ? ed.budget : "À définir"), duree: draft("av-d", ed ? ed.duree : "À définir"), statut,
      date: statut === "planifiee" ? draft("av-date", ed ? ed.date || "" : "") : "", note: draft("av-n", ed ? ed.note || "" : "").trim() };
    if (statut === "realisee" && !(ed && ed.doneAt)) data.doneAt = Date.now();
    if (ed) Store.update("aventures", ed.id, data); else Store.add("aventures", data);
    clearDrafts("av-t", "av-b", "av-d", "av-s", "av-date", "av-n"); S.layer = null; S.editAv = null; S.tab = "aventures";
    toast(ed ? "Aventure mise à jour" : "Ajoutée à la liste");
  },
  "av-status"(d) {
    const patch = { statut: d.v }; if (d.v === "realisee") patch.doneAt = Date.now();
    Store.update("aventures", d.id, patch);
    if (d.v === "planifiee") { S.editAv = d.id; S.drafts["av-s"] = "planifiee"; S.layer = { type: "sheet", name: "aventure" }; }
  },
  "av-edit"(d) { S.editAv = d.id; S.layer = { type: "sheet", name: "aventure" }; },
  "save-lettre"() {
    const m = draft("le-m").trim(), dte = draft("le-d");
    if (!m) { toast("Le message est encore vide."); return; }
    if (!dte || daysUntil(dte) < 1) { toast("Choisissez une date d'ouverture à partir de demain."); return; }
    Store.add("lettres", { title: draft("le-t").trim(), message: m, from: draft("le-f", "a"), openOn: dte });
    clearDrafts("le-t", "le-m", "le-f", "le-d"); S.layer = null; S.tab = "lettres"; toast("Carte scellée jusqu'au " + fmtDay(dte));
  },
  "save-carte"() {
    const t = draft("cc-t").trim();
    if (!t) { toast("Écris le texte de la carte."); return; }
    const cat = draft("cc-cat", "dec");
    Store.add("cartes", { cat, text: t.slice(0, 280), tone: draft("cc-tone", "l"), from: draft("cc-f", "a"), ...(cat === "def" ? { duree: +draft("cc-dur", "15") } : {}) });
    clearDrafts("cc-t"); toast("Carte ajoutée au paquet");
  },
  "open-letter"(d) { const l = Store.cols.lettres.find(x => x.id === d.id); if (l && daysUntil(l.openOn) <= 0) S.openLetters[d.id] = true; },
  "ask-del"(d) { S.confirm = d.col + ":" + d.id; },
  "cancel-del"() { S.confirm = null; },
  "do-del"(d) { Store.remove(d.col, d.id); S.confirm = null; toast("Supprimé"); }
};
function advanceSlot() {
  const g = S.game, slots = slotsOf(g);
  g.slot++;
  if (TRANSPORTS[g.transport].isComplete(g, slots)) g.phase = "ready";
  else g.phase = "hand";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a]; if (!fn) return;
  e.preventDefault();
  fn(t.dataset, t);
  render(true);
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-d]")) S.drafts[e.target.id] = e.target.value;
  if (e.target.id === "onde-g" && S.arc) {
    S.arc.guess = +e.target.value;
    const n = document.getElementById("needle"); if (n) n.style.left = S.arc.guess + "%";
  }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-d]")) S.drafts[e.target.id] = e.target.value;
  if (e.target.id === "pz-file" && e.target.files && e.target.files[0]) pzUpload(e.target.files[0]);
  if (e.target.id === "av-s") render(true);
});
document.addEventListener("focusout", () => { setTimeout(() => { if (pendingRender) render(); }, 0); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.layer && S.layer.type !== "game") { ACT["close-layer"](); render(true); } });
setInterval(() => {
  const t = document.getElementById("g-timer"); if (t && S.game) t.textContent = elapsed();
}, 1000);

/* ───────────────────────── Démarrage ───────────────────────── */
function start(data) {
  Store.loadLocal();
  if (data && data.S) S = { ...S, ...data.S };
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ S: JSON.parse(JSON.stringify(S)) })); } catch (e) { /* facultatif */ }
  }
  if (S.game && S.game.phase === "counting") S.game.phase = "talk";
  if (S.arc && S.arc.phase === "count") S.arc.phase = S.arc.after;
  render(true);
  Store.connect();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
