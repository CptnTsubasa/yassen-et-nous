* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 128px; display: grid; gap: 22px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 400; font-size: 2.1rem; line-height: 1; letter-spacing: .01em; }
.logo span { color: var(--accent); }
.hello { color: var(--muted); font-size: 1rem; margin-top: -14px; }
.hello.dedi { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.2; color: var(--fg); text-wrap: balance; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; font-size: 1.4rem; line-height: 1; }
.icon-btn svg { width: 22px; height: 22px; }
.sec { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; transition: transform .15s ease; text-align: center; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.c { background: var(--c); color: var(--on-c); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; padding: 6px 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: .92rem; min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.chip[disabled] { opacity: .5; cursor: default; }

.panel { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

/* Rendez-vous du jour */
.daily { position: relative; overflow: hidden; background: var(--m4); color: var(--on-m4); border-radius: 26px; padding: 20px; display: grid; gap: 14px; }
.daily .date { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1; color: var(--i4); }
.daily h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; opacity: .7; }
.daily .q { font-size: 1.22rem; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
.daily .d { display: grid; gap: 4px; padding-top: 12px; border-top: 1px dashed color-mix(in srgb, var(--on-m4) 25%, transparent); }
.daily .d b { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.daily .btn.ghost { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--fg); }
.daily .link { color: color-mix(in srgb, var(--on-m4) 75%, transparent); }
.daily-off { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: var(--surface-2); color: var(--muted); font-size: .92rem; }

/* Tuiles des modes */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; overflow: hidden; text-align: left; background: var(--c); color: var(--on-c); border-radius: 22px; padding: 16px 14px 14px; min-height: 148px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; transition: transform .18s ease; }
.tile:active { transform: scale(.98); }
.tile .g { position: absolute; top: 6px; right: 12px; font-size: 3.4rem; line-height: 1; opacity: .3; color: var(--ic); }
.tile h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.28rem; line-height: 1.1; }
.tile p { font-size: .84rem; line-height: 1.35; opacity: .92; }
.tile.wide { grid-column: 1 / -1; min-height: 116px; }
@media (max-width: 340px) { .tiles { grid-template-columns: 1fr; } }

/* Notre carnet */
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 14px 10px; }
.tally div { display: grid; gap: 4px; }
.tally b { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.tally span { font-size: .84rem; color: var(--muted); line-height: 1.25; }
.last-souv { text-align: left; display: grid; gap: 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
.last-souv .hand { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1.15; overflow-wrap: anywhere; }

.sync { font-size: .8rem; color: var(--muted); text-align: center; text-wrap: balance; }

/* Barre d'onglets */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 9px 2px 10px; font-size: .74rem; font-weight: 600; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }

/* Calque plein écran (jeu, réglages, formulaires) */
.layer { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.layer .wrap { padding-block: 14px 48px; gap: 18px; }
.g-head { display: flex; align-items: center; gap: 12px; }
.g-prog { flex: 1; min-width: 0; display: grid; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s ease; }
.g-timer { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 3.4em; text-align: right; }
.sheet-title { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }

/* La carte à jouer */
.card { position: relative; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; min-height: 300px; animation: deal .5s ease both; }
.card-band { display: flex; align-items: center; gap: 8px; background: var(--c); color: var(--on-c); padding: 10px 10px 10px 16px; font-weight: 700; font-size: .86rem; letter-spacing: .04em; }
.card-band .suit { font-size: 1.1rem; }
.card-band .tone { margin-left: auto; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.fav { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; color: inherit; }
.fav[aria-pressed="true"] { background: color-mix(in srgb, var(--on-c) 20%, transparent); }
.card-body { padding: 22px 22px 12px; display: grid; align-content: center; gap: 12px; }
.card-for { font-family: var(--f-hand); font-size: 1.45rem; line-height: 1; color: var(--ic); }
.card-text { font-size: clamp(1.32rem, 5.2vw, 1.66rem); font-weight: 650; line-height: 1.3; text-wrap: pretty; }
.card-foot { display: flex; justify-content: space-between; align-items: end; padding: 0 16px 12px; color: var(--ic); font-size: 1.4rem; }
.card-foot .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.card-foot span.flip { transform: rotate(180deg); display: inline-block; }
@keyframes deal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.joker { display: flex; justify-content: center; }

.instr { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; }
.instr b { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.instr p { font-size: 1.02rem; }
.actions { display: grid; gap: 10px; }
.actions .row > .btn { flex: 1 1 140px; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 700; font-size: .9rem; }
textarea, input[type="text"], input[type="date"], select { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 1rem; }
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
textarea.hand { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1.15; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }

/* Écran de masquage */
.curtain { position: relative; overflow: hidden; border-radius: 28px; background: var(--c); color: var(--on-c); padding: 40px 22px 26px; min-height: 420px; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; animation: deal .4s ease both; }
.curtain::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--on-c) 7%, transparent) 22px 44px); pointer-events: none; }
.curtain > * { position: relative; }
.curtain .who { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 11vw, 3.2rem); line-height: 1.05; overflow-wrap: anywhere; }
.curtain p { max-width: 30ch; }
.curtain .btn { background: var(--on-c); color: var(--c); margin-top: 10px; }

/* Révélation */
.reveal { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; perspective: 900px; }
.reveal.one { grid-template-columns: 1fr; }
.rv { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 6px; align-content: start; min-width: 0; animation: flip .6s cubic-bezier(.3,.7,.3,1) both; }
.rv:nth-child(2) { animation-delay: .18s; }
.rv b { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.rv .ans { font-family: var(--f-hand); font-size: 1.65rem; line-height: 1.1; overflow-wrap: anywhere; }
.rv .pick { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; color: var(--ic); overflow-wrap: anywhere; }
@keyframes flip { from { opacity: 0; transform: rotateY(80deg); } to { opacity: 1; transform: none; } }
.verdict { text-align: center; font-family: var(--f-hand); font-size: 1.7rem; line-height: 1.1; color: var(--ic); }

.pickers { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.pickers .btn { min-height: 92px; border-radius: 22px; font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; overflow-wrap: anywhere; }
.count { font-family: var(--f-display); font-size: 6rem; line-height: 1; text-align: center; color: var(--ic); animation: pop .8s ease both; }
@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Options de réglage de partie */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; display: grid; gap: 3px; padding: 14px 16px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.opt b { font-size: 1rem; }
.opt span { font-size: .88rem; color: var(--muted); }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ic, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 40%, var(--surface)); }
.opt[disabled] { opacity: .55; cursor: default; }
.setup-hero { border-radius: 26px; background: var(--c); color: var(--on-c); padding: 22px 20px; display: grid; gap: 6px; position: relative; overflow: hidden; }
.setup-hero h1 { font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1.05; }
.setup-hero .g { position: absolute; right: 14px; top: 2px; font-size: 5rem; opacity: .22; line-height: 1; }

/* Listes : capsule, aventures, lettres */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { padding: 9px 6px; border-radius: 999px; font-weight: 600; font-size: .86rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.item { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; min-width: 0; }
.item .t { font-weight: 700; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
.item .q { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--i4); }
.item .hand { font-family: var(--f-hand); font-size: 1.55rem; line-height: 1.15; overflow-wrap: anywhere; white-space: pre-wrap; }
.item .by { font-size: .82rem; color: var(--muted); }
.item .tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.empty { border: 2px dashed var(--line); border-radius: 22px; padding: 26px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty strong { color: var(--fg); font-size: 1.05rem; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; }
.status { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.status button { padding: 7px 4px; border-radius: 9px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.status button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2); padding: 10px 12px; border-radius: 14px; font-size: .92rem; }
.confirm .btn { min-height: 38px; padding: 6px 14px; font-size: .88rem; }

/* Lettres scellées */
.letter { position: relative; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 18px 16px; display: grid; gap: 8px; overflow: hidden; }
.letter.sealed { background: linear-gradient(160deg, var(--surface) 0 58%, var(--surface-2) 58%); }
.letter .seal { position: absolute; right: 16px; top: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--on-accent) 25%, transparent); transform: rotate(-12deg); }
.letter .when { font-family: var(--f-hand); font-size: 1.5rem; line-height: 1.1; color: var(--accent); padding-right: 64px; }
.letter .t { padding-right: 64px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow); animation: deal .3s ease both; }
details summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 6px 0; }
.dlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.dlist button { text-align: left; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--surface); font-size: .94rem; }
.end-big { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; line-height: 1.05; text-align: center; }

/* Arcade */
.duel { display: grid; gap: 10px; }
.duel .side { background: var(--c); color: var(--on-c); border-radius: 22px; padding: 24px 18px; font-size: clamp(1.2rem, 5vw, 1.45rem); font-weight: 650; line-height: 1.3; text-align: center; text-wrap: balance; }
.duel .ou { text-align: center; font-family: var(--f-hand); font-size: 1.7rem; color: var(--muted); line-height: 1; }
.flag-q { background: var(--surface); border-radius: 22px; padding: 28px 20px; box-shadow: var(--shadow); font-size: clamp(1.25rem, 5vw, 1.5rem); font-weight: 650; line-height: 1.3; text-align: center; text-wrap: balance; }
.flag-pair { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.flag-pair div { border-radius: 18px; padding: 16px 10px; text-align: center; font-family: var(--f-display); font-size: 1.2rem; }
.spec { position: relative; height: 72px; border-radius: 18px; background: linear-gradient(90deg, var(--m5), var(--m4), var(--m1)); overflow: hidden; }
.spec .band { position: absolute; top: 0; bottom: 0; transform: translateX(-50%); }
.spec .b2 { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.spec .b3 { background: color-mix(in srgb, var(--accent) 42%, transparent); }
.spec .b4 { background: color-mix(in srgb, var(--accent) 78%, transparent); }
.spec .needle { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--fg); border-radius: 2px; box-shadow: 0 0 0 2px var(--surface); }
.spec-labels { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: .92rem; }
.spec-labels span:last-child { text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 36px; }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.rules li { padding-left: 4px; line-height: 1.45; }
.big-word { font-family: var(--f-display); font-size: clamp(2rem, 9vw, 2.7rem); line-height: 1.1; text-align: center; color: var(--ic); overflow-wrap: anywhere; text-wrap: balance; }

/* Puzzle */
.pz { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--line); border-radius: 18px; max-width: 100%; touch-action: manipulation; }
.pz button { aspect-ratio: 1; background-image: var(--pz); background-size: calc(var(--n) * 100%) calc(var(--n) * 100%); border-radius: 6px; transition: transform .15s ease; }
.pz button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: -3px; transform: scale(.93); }
.pz.solved { gap: 0; padding: 0; overflow: hidden; border-radius: 22px; box-shadow: var(--shadow); }
.pz.solved button { border-radius: 0; }
.pz-img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 22px; box-shadow: var(--shadow); }
.pz-img.peek { width: 42%; margin: 0 auto; border-radius: 14px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* Histoires interactives */
.story-page { background: var(--surface); border-radius: 24px; padding: 24px 22px; box-shadow: var(--shadow); border-top: 6px solid var(--c); display: grid; gap: 12px; animation: deal .5s ease both; }
.story-text { font-size: 1.12rem; line-height: 1.65; text-wrap: pretty; }
.story-page:not(.end) .story-text::first-letter { font-family: var(--f-display); font-size: 3em; float: left; line-height: .85; margin: 6px 10px 0 0; color: var(--ic); }
.choice { display: block; text-align: left; width: 100%; padding: 15px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; line-height: 1.35; }
button.choice:active { background: var(--surface-2); }
.choice.ro { color: var(--muted); font-weight: 500; }
.choice.mine { box-shadow: inset 0 0 0 2px var(--ic); }

/* ── Habillage d'appli : barre du haut, onglets flottants, listes épurées ── */
:root { --glass: color-mix(in srgb, var(--surface) 74%, transparent); --hair: color-mix(in srgb, var(--fg) 8%, transparent); }
body { background: var(--bg); }
/* Ambiance cozy : halos chauds qui flottent lentement et petits motifs dessinés. */
#cozy { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
#cozy i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(42px); opacity: var(--halo); animation: cozy 38s ease-in-out infinite alternate; }
#cozy i:nth-child(1) { background: var(--m6); left: -18vmax; top: -14vmax; }
#cozy i:nth-child(2) { background: var(--m4); right: -20vmax; top: 4vmax; animation-duration: 46s; animation-delay: -12s; }
#cozy i:nth-child(3) { background: var(--m1); left: -12vmax; bottom: -18vmax; animation-duration: 52s; animation-delay: -24s; }
#cozy i:nth-child(4) { background: var(--m2); right: -14vmax; bottom: 6vmax; width: 30vmax; height: 30vmax; animation-duration: 34s; }
#cozy::after { content: ""; position: absolute; inset: 0; background-image: var(--doodle); background-size: 140px 140px; }
@keyframes cozy { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vmax, 4vmax) scale(1.12); } }
/* Les petits compagnons, debout sur la barre d'onglets. Leurs déplacements sont calculés en JS. */
#buddies { position: fixed; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); bottom: calc(75px + env(safe-area-inset-bottom, 0px)); height: 0; z-index: 21; pointer-events: none; }
.buddy { position: absolute; left: 0; bottom: -2px; width: 44px; will-change: transform; pointer-events: auto; cursor: pointer; }
.buddy-face { transform-origin: 50% 100%; }
.buddy-body { transform-origin: 50% 100%; }
.buddy-body svg { display: block; width: 100%; height: auto; overflow: visible; animation: bob 3.4s ease-in-out infinite; }
.buddy.walking .buddy-body svg { animation: none; }
.buddy.hop .buddy-body { animation: buddyhop .5s ease; }
@keyframes buddyhop { 40% { transform: translateY(-16px); } }
.buddy.sleep .buddy-body { transform: translateY(8%) rotate(-10deg); transition: transform .5s ease; }
.buddy.grr .buddy-body { animation: grr .16s linear infinite; }
@keyframes grr { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.5px); } }
.av-happy, .av-grr { display: none; }
.buddy.blush .av-blush { opacity: .85; }
.buddy.shy .buddy-body { animation: shysway 1.1s ease-in-out infinite alternate; }
@keyframes shysway { from { transform: rotate(-5deg); } to { transform: rotate(5deg) translateY(2%); } }
.buddy.spin .buddy-body { animation: spin .7s ease; transform-origin: 50% 60%; }
@keyframes spin { to { transform: rotate(360deg); } }
.buddy.happy .av-eyes { display: none; }
.buddy.happy .av-happy, .buddy.grr .av-grr { display: inline; }
.buddy-fx { position: absolute; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; }
#buddies.over { z-index: 45; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.fx-big { position: absolute; bottom: 52px; width: 30px; opacity: 0; animation: bigheart 1.8s ease-out forwards; filter: drop-shadow(0 0 6px rgba(255, 79, 122, .55)); }
@keyframes bigheart { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: 1; transform: scale(1.25); } 45% { transform: scale(1); } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }
.fx-heart, .fx-note { position: absolute; bottom: 44px; opacity: 0; animation: floatup 2s ease-out forwards; }
.fx-heart svg { display: block; }
.fx-big svg { display: block; width: 100%; height: auto; }
.fx-note { font-size: 15px; font-weight: 700; color: var(--i4); width: auto; }
@keyframes floatup { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-48px) scale(1.1); } }
.fx-cloud { position: absolute; bottom: -6px; width: 74px; z-index: 2; animation: brawl .22s linear infinite; }
@keyframes brawl { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(2px, -2px) rotate(4deg); } 50% { transform: translate(-2px, 1px) rotate(-3deg); } 75% { transform: translate(1px, 2px) rotate(2deg); } }
.bubble { position: absolute; bottom: calc(100% + 6px); left: 50%; width: max-content; max-width: 190px; padding: 8px 12px; border-radius: 16px; background: var(--surface); color: var(--fg); border: 1px solid var(--hair); box-shadow: var(--shadow); font-size: .8rem; font-weight: 600; line-height: 1.3; opacity: 0; transform: translateX(-50%) scale(.6); transform-origin: 50% 100%; transition: opacity .25s ease, transform .25s ease; pointer-events: none; }

const pickOne = a => a[Math.floor(Math.random() * a.length)];

/* ───────────────────────── Stockage ─────────────────────────
   Données partagées (album, capsule, aventures, lettres, favoris, progression).
   Avec la base de l'artifact : synchronisées entre vos appareils.
   Sans elle (visiteur non connecté, aperçu) : enregistrées sur ce seul appareil. */
const LS = "entre-nous:v1";
const DEFAULT_META = { couple: { a: "", b: "", style: "partage" }, progress: { seen: [], parties: 0 }, puzzle: { img: "" }, avatars: {} };
const Store = {
  backend: "local", db: null, q: {}, unsubs: [],
  cols: { capsule: [], aventures: [], lettres: [], favoris: [], cartes: [] },
  meta: JSON.parse(JSON.stringify(DEFAULT_META)),
  loadLocal() {
    try {
      const d = JSON.parse(lsGet(LS) || "null");
      if (!d) return;
      for (const k in this.cols) if (Array.isArray(d.cols && d.cols[k])) this.cols[k] = d.cols[k];
      for (const k in this.meta) if (d.meta && d.meta[k]) this.meta[k] = { ...DEFAULT_META[k], ...d.meta[k] };
    } catch (e) { /* données locales illisibles : on repart à vide */ }
  },
  saveLocal() { if (this.backend === "local") lsSet(LS, JSON.stringify({ cols: this.cols, meta: this.meta })); },
  async connect() {
    if (this.db) return;
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) db = await Shared.open();
    if (!db) { render(); return; }
    this.db = db; this.backend = db.kind === "shared" ? "shared" : "db";
    const firsts = [];
    const first = () => { let r; firsts.push(new Promise(res => { r = res; })); return () => { if (r) { r(); r = null; } }; };
    for (const col of Object.keys(this.cols)) {
      const done = first();
      this.unsubs.push(db.collection(col).onSnapshot(snap => {
        this.cols[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        done(); render();
      }, e => { done(); this.fail(e); }));
    }
    for (const m of Object.keys(this.meta)) {
      const done = first();
      this.unsubs.push(db.doc("meta/" + m).onSnapshot(s => {
        this.meta[m] = s.exists ? { ...DEFAULT_META[m], ...s.data() } : { ...DEFAULT_META[m] };
        done(); render();
      }, e => { done(); this.fail(e); }));
    }
    if (db.kind === "shared") Live.open();
    render();
    // En rejoignant l'espace commun, ce que ce téléphone contenait déjà y est ajouté.
    if (db.kind === "shared" && Shared.joining) {
      await Promise.all(firsts);
      const data = Shared.joining; Shared.joining = null;
      await mergeData(data, true);
      toast("Vous partagez maintenant la même progression");
    }
  },
  // Écrit en ligne quand c'est possible. Si ce compte n'a pas le droit d'écrire (lien public,
  // accès en lecture), on bascule sur ce téléphone et la modification y est appliquée.
  write(path, fn, local) {
    if (!this.db) { local(); this.saveLocal(); return Promise.resolve(); }
    const p = (this.q[path] || Promise.resolve()).then(fn).catch(e => {
      if (e && e.code === "invalid_argument" && this.db) { this.goLocal(); local(); this.saveLocal(); render(true); }
      else this.fail(e);
    });
    this.q[path] = p; return p;
  },
  goLocal() {
    this.unsubs.forEach(u => { try { u(); } catch (e) { /* déjà fermé */ } });
    this.unsubs = []; this.db = null; this.backend = "local"; this.saveLocal();
    Live.close();
  },
  add(col, data) {
    data = { ...data, createdAt: Date.now() };
    const id = this.db ? this.db.collection(col).doc().id : uid();
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).set(data),
      () => { if (!this.cols[col].some(x => x.id === id)) this.cols[col].push({ id, ...data }); });
  },
  put(col, id, data) {
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).set(data), () => {
      const i = this.cols[col].findIndex(x => x.id === id);
      if (i >= 0) this.cols[col][i] = { id, ...data }; else this.cols[col].push({ id, ...data });
    });
  },
  update(col, id, patch) {
    patch = { ...patch, updatedAt: Date.now() };
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).update(patch),
      () => { const it = this.cols[col].find(x => x.id === id); if (it) Object.assign(it, patch); });
  },
  remove(col, id) {
    return this.write(col + "/" + id, () => this.db.collection(col).doc(id).delete(),
      () => { this.cols[col] = this.cols[col].filter(x => x.id !== id); });
  },
  setMeta(m, data) {
    this.meta[m] = { ...data };
    return this.write("meta/" + m, () => this.db.doc("meta/" + m).set(data), () => {});
  },
  fail(e) {
    const code = e && e.code;
    if (code === "invalid_argument" || code === "revoked") { if (this.db) { this.goLocal(); render(true); } }
    else if (code === "quota_exceeded") toast("La capsule est pleine. Supprimez quelques éléments pour en ajouter.");
    else toast("L'enregistrement n'a pas abouti. Réessaie dans un instant.");
  }
};

  // Un lien d'invitation (…#c-CODE) relie ce téléphone à l'espace commun.
  takeInvite() {
    const m = /^#c-([A-Za-z0-9]{24,64})$/.exec(location.hash || "");
    if (!m) return;
    if (m[1] !== this.code()) { lsSet(this.key, m[1]); this.joining = snapshotLocal(); }
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* facultatif */ }
  },
  async open() {
    if (!this.available()) return null;
    this.takeInvite();
    const code = this.code();
    if (!code) return null;
    try {
      const [A, F] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
        import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database.js`)
      ]);
      return rtdbAdapter(F, F.getDatabase(A.initializeApp(FIREBASE)), "couples/" + code);
    } catch (e) {
      toast("L'espace commun est injoignable pour le moment. La progression est gardée sur ce téléphone.");
      return null;
    }
  }
};
// Donne à Firebase la même forme que la base des artifacts, pour que Store reste identique.
function rtdbAdapter(F, fdb, base) {
  const clean = d => JSON.parse(JSON.stringify(d));
  const at = p => F.ref(fdb, base + "/" + p);
  const docRef = path => ({
    id: path.split("/").pop(),
    set: d => F.set(at(path), clean(d)),
    update: d => F.update(at(path), clean(d)),
    delete: () => F.remove(at(path)),
    onSnapshot: (next, err) => F.onValue(at(path), s => next({ exists: s.exists(), data: () => s.val() }), err)
  });
  return {
    kind: "shared",
    doc: docRef,
    collection: col => ({
      doc: id => docRef(col + "/" + (id || F.push(at(col)).key)),
      onSnapshot: (next, err) => F.onValue(at(col), s => {
        const v = s.val() || {};
        next({ docs: Object.keys(v).map(id => ({ id, data: () => v[id] })) });
      }, err)
    })
  };
}

/* ───────────────────────── Code de transfert ─────────────────────────
   Pour rassembler deux progressions sans compte : un code à s'envoyer par message.
   Les éléments gardent leur identifiant, donc fusionner deux fois ne crée pas de doublons. */
function makeCode() {
  const json = JSON.stringify({ v: 1, cols: Store.cols, meta: { couple: Store.meta.couple, progress: Store.meta.progress } });
  const bytes = new TextEncoder().encode(json);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return "YS1:" + btoa(bin);
}
async function mergeCode(code) {
  let data;
  try {
    const bin = atob(code.replace(/\s+/g, "").replace(/^YS1:/, ""));
    data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  } catch (e) { data = null; }
  if (!data || data.v !== 1 || typeof data.cols !== "object") { toast("Ce code n'est pas reconnu. Copie-le en entier, depuis « YS1: » jusqu'au bout."); return; }
  return mergeData(data);
}
async function mergeData(data, quiet) {
  const ts = o => o.updatedAt || o.createdAt || 0;
  let added = 0;
  for (const col of Object.keys(Store.cols)) {
    const inc = Array.isArray(data.cols[col]) ? data.cols[col] : [];
    for (const it of inc) {
      if (!it || typeof it !== "object" || typeof it.id !== "string" || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(it.id)) continue;
      const { id, ...body } = it;
      const cur = Store.cols[col].find(x => x.id === id);
      if (cur && ts(cur) >= ts(it)) continue;
      await Store.put(col, id, body); added++;
    }
  }
  const p = Store.meta.progress, q = (data.meta && data.meta.progress) || {};
  const uni = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])].filter(x => typeof x === "string");
  await Store.setMeta("progress", { ...p, seen: uni(p.seen, q.seen), endings: uni(p.endings, q.endings),
    parties: Math.max(p.parties || 0, +q.parties || 0), puzzles: Math.max(p.puzzles || 0, +q.puzzles || 0) });
  const c = couple(), qc = (data.meta && data.meta.couple) || {};
  if ((!c.a || !c.b) && typeof qc.a === "string" && typeof qc.b === "string" && qc.a && qc.b) {
    await Store.setMeta("couple", { a: qc.a.slice(0, 24), b: qc.b.slice(0, 24), style: c.style || "partage" });
  }
  if (!quiet) toast(added ? `C'est fusionné : ${added} élément${added > 1 ? "s" : ""} ajouté${added > 1 ? "s" : ""} ou mis à jour` : "Tout était déjà à jour");
}

/* ───────────────────────── Transport des réponses ─────────────────────────
   Une manche collecte des réponses par « emplacement » (prédiction, réponse, vote…).
   V1 : un seul appareil, l'écran de masquage assure le secret.
   Un futur mode à distance (code de partie, deux téléphones) fournira un transport
   ayant la même interface, appuyé sur une salle partagée. Il n'est pas encore branché. */
const LocalTransport = {
  kind: "local",
  submit(g, key, value) { g.ans[key] = value; },
  isComplete(g, slots) { return slots.every(s => g.ans[s.key] != null); }
};

function flushSeen(ids, party) {
  const set = seenSet(); let added = 0;
  ids.forEach(id => { if (!set.has(id)) { set.add(id); added++; } });
  if (!added && !party) return 0;

  return added;
}

/* ───────────────────────── Paquets de cartes ───────────────────────── */
function freshFirst(ids) {
  const seen = seenSet();
  return shuffle(ids.filter(i => !seen.has(i))).concat(shuffle(ids.filter(i => seen.has(i))));
}
function cardCount(mode, dur, style) {
  const base = { 5: 4, 10: 7, 20: 12, 30: 18 }[dur] || 7;
  if (mode === "qui") return Math.round(base * 1.5);
  return style === "secret" || style === "distance" ? Math.max(3, Math.round(base * 0.75)) : base;
}
function moodPool(mood) {
  const quick = POOL.def.filter(id => CARDS[id].duree <= 15);
  const all = [...POOL.dec, ...POOL.his, ...POOL.con, ...POOL.ave, ...POOL.dev, ...POOL.qui, ...POOL.eti, ...quick];
  const ok = {
    rire: c => c.tone === "d",
    decouvrir: c => (["dec", "dev", "ave", "eti"].includes(c.cat) && c.tone !== "r") || (c.cat === "qui" && c.tone === "l") || (c.cat === "def" && c.amb === "t"),
    romantique: c => c.tone === "r",
    profond: c => c.tone === "p",
    surpris: c => c.tone !== "p"
  }[mood] || (() => true);
  return all.filter(id => ok(CARDS[id]));
}
function buildDeck(st) {
  const n = cardCount(st.mode, st.dur, st.style);
  if (st.mode === "questions") {
    const ids = st.cat === "mix" ? [...POOL.dec, ...POOL.his, ...POOL.con, ...POOL.ave, ...POOL.dev] : POOL[st.cat];
    return freshFirst(ids).slice(0, n);
  }
  if (st.mode === "qui") return freshFirst(POOL.qui).slice(0, n);
  if (st.mode === "histoire") return freshFirst(POOL.his).slice(0, n);
  if (st.mode === "etsi") return freshFirst(POOL.eti).slice(0, n);
  // Surprise : on alterne les types de cartes pour garder du rythme.
  const groups = {};
  moodPool(st.mood).forEach(id => { const t = CARDS[id].type === "question" && CARDS[id].cat === "his" ? "souvenir" : CARDS[id].type; (groups[t] = groups[t] || []).push(id); });
  const lists = shuffle(Object.values(groups).map(freshFirst));
  const out = [];
  for (let r = 0; out.length < n && lists.some(l => l.length > r); r++) lists.forEach(l => { if (l[r] && out.length < n) out.push(l[r]); });
  return out;
}
function flowOf(c, mode) {
  if (c.type === "qui") return "pick";
  if (c.type === "defi") return "defi";
  if (c.type === "scenario") return "idea";
  if (c.cat === "his" && (mode === "histoire" || mode === "surprise")) return "both";
  return "guess";
}
function slotsOf(g) {
  const T = g.T, G = other(T);
  switch (g.flow) {
    case "guess": return [
      { who: G, key: "guess", kind: "text", label: `Ta prédiction : que va répondre ${nm(T)} ?` },
      { who: T, key: "answer", kind: "text", label: "Ta vraie réponse" }];
    case "pick": return [{ who: "a", key: "a", kind: "pick" }, { who: "b", key: "b", kind: "pick" }];
    case "both": return [{ who: "a", key: "a", kind: "text", label: "Ta réponse" }, { who: "b", key: "b", kind: "text", label: "Ta réponse" }];
    case "idea": return [{ who: "a", key: "a", kind: "text", label: "Ton idée" }, { who: "b", key: "b", kind: "text", label: "Ton idée" }];
    default: return [];
  }
}

/* ───────────────────────── Partie ───────────────────────── */
function startGame(st, deck) {
  S.game = {
    mode: st.mode, style: st.style, setup: { ...st }, deck: deck || buildDeck(st), i: 0,
    startAt: Date.now(), first: Math.random() < 0.5 ? "a" : "b", seen: [], transport: "local", stats: null
  };
  if (!S.game.deck.length) { toast("Aucune carte ne correspond à ce choix."); S.game = null; return; }
  enterCard();
  S.layer = { type: "game" };
}
function enterCard() {
  const g = S.game, c = CARDS[g.deck[g.i]];
  g.flow = flowOf(c, g.mode);
  g.T = (g.i % 2 === 0) === (g.first === "a") ? "a" : "b";
  g.ans = {}; g.slot = 0; g.saved = {}; g.count = 0;
  g.talk = pickOne(g.flow === "pick" ? PICK_TALK : GUESS_TALK);
  if (!g.seen.includes(c.id)) g.seen.push(c.id);
  if (g.flow === "defi") g.phase = "open";
  else if (g.style === "secret") g.phase = "hand";
  else g.phase = { guess: "g", pick: "count", both: "open", idea: "open" }[g.flow];
}
function nextCard() {
  const g = S.game;
  if (g.i + 1 >= g.deck.length) return endGame();
  g.i++; enterCard();
}
function endGame() {
  const g = S.game;
  const fresh = flushSeen(g.seen, true);
  g.stats = { played: g.seen.length, fresh };
  g.phase = "end";
}
function quitGame() {
  if (S.game && S.game.phase !== "end") flushSeen(S.game.seen, false);
  S.game = null; S.layer = null;
}

function daily() {
  const day = Math.floor(parseDay(todayStr()).getTime() / 86400000);
  const qs = [...POOL.dec, ...POOL.his, ...POOL.con, ...POOL.ave, ...POOL.dev];
  const ds = POOL.def.filter(id => CARDS[id].duree <= 15);
  return { q: CARDS[qs[hash(day * 7919) % qs.length]], d: CARDS[ds[hash(day * 104729) % ds.length]] };
}
function dailyBlock() {
  const t = todayStr();
  if (lsGet("entre-nous:daily-skip") === t) {
    return `<div class="daily-off"><span>Rendez-vous du jour mis de côté.</span><button class="link" data-a="daily-unskip">Le reprendre</button></div>`;
  }
  const { q, d } = daily();
  const done = Store.cols.capsule.some(x => x.kind === "defi" && x.cardId === d.id && x.day === t);
  return `
  <section class="daily" aria-labelledby="h-daily">
    <div class="row" style="justify-content:space-between">
      <h2 id="h-daily">Le rendez-vous du jour</h2>
    </div>
    <p class="q">${esc(q.text)}</p>
    <div class="row"><button class="btn" data-a="daily-play">Jouer la question</button></div>
    <div class="d"><b>Petit défi</b><p>${esc(d.text)}</p></div>
    <div class="row" style="justify-content:space-between">
      ${done ? `<span class="small">Défi relevé aujourd'hui ✓</span>` : `<button class="btn ghost" data-a="daily-done">Défi relevé</button>`}
      <button class="link" data-a="daily-skip">Pas aujourd'hui</button>
    </div>
  </section>`;
}
function cartesBlock() {
  const n = Store.cols.cartes.length;
  return `
  <section class="panel" aria-labelledby="h-cartes">
    <div class="group-h"><h2 class="sec" id="h-cartes">Nos cartes</h2>${n ? `<span class="small muted">${n} créée${n > 1 ? "s" : ""}</span>` : ""}</div>
    <p class="small muted">Ajoutez vos propres questions, défis et idées. Elles se glissent dans le paquet, comme les autres.</p>
    <div class="row"><button class="btn ghost" data-a="sheet" data-name="cartes">Créer une carte</button></div>
  </section>`;
}
// Un carnet de ce que vous avez vraiment vécu ici, sans étapes ni objectif à atteindre.
function carnetBlock() {
  const cap = Store.cols.capsule, p = Store.meta.progress;
  const items = [
    [(p.seen || []).length, "carte jouée", "cartes jouées"],
    [cap.filter(x => x.kind === "souvenir").length, "souvenir gardé", "souvenirs gardés"],
    [cap.filter(x => x.kind === "mot" || x.kind === "anecdote").length, "petit mot", "petits mots"],
    [cap.filter(x => x.kind === "defi").length, "défi relevé", "défis relevés"],
    [Store.cols.aventures.filter(a => a.statut === "realisee").length, "aventure vécue", "aventures vécues"],
    [(p.endings || []).length, "fin d'histoire découverte", "fins d'histoire découvertes"],
    [p.puzzles || 0, "puzzle reconstitué", "puzzles reconstitués"]
  ].filter(x => x[0] > 0);
  const last = byDate(cap.filter(x => x.kind === "souvenir"))[0];
  return `
  <section class="panel" aria-labelledby="h-carnet">
    <div class="group-h"><h2 class="sec" id="h-carnet">Notre carnet</h2></div>
    ${items.length
      ? `<div class="tally">${items.map(([v, s, pl]) => `<div><b>${v}</b><span>${v > 1 ? pl : s}</span></div>`).join("")}</div>`
      : `<p class="small muted">Il se remplira tout seul, au fil de vos parties, de vos souvenirs et de vos défis.</p>`}
    ${last ? `<button class="last-souv" data-a="go-album"><span class="sec">Dernier souvenir gardé</span><span class="hand">${esc(last.question)}</span></button>` : ""}
  </section>`;
}

/* ───────────────────────── Vues : capsule ───────────────────────── */
function confirmRow(col, id) {
  if (S.confirm !== col + ":" + id) return `<button class="link" data-a="ask-del" data-col="${col}" data-id="${id}">Supprimer</button>`;
  return `<div class="confirm"><span>Supprimer pour de bon ?</span><button class="btn" data-a="do-del" data-col="${col}" data-id="${id}">Supprimer</button><button class="btn ghost" data-a="cancel-del">Garder</button></div>`;
}
function byDate(a) { return a.slice().sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)); }

function viewCapsule() {
  const seg = S.capSeg;
  const segs = [["album", "Album"], ["mots", "Petits mots"], ["favoris", "Favoris"], ["realise", "Réalisé"]]
    .map(([k, l]) => `<button aria-pressed="${seg === k}" data-a="cap-seg" data-seg="${k}">${l}</button>`).join("");
  let body = "";
  const cap = Store.cols.capsule;
  if (seg === "album") {
    const items = byDate(cap.filter(x => x.kind === "souvenir"));
    body = `<div class="row"><button class="btn" data-a="sheet" data-name="souvenir">Ajouter un souvenir</button></div>` + (items.length ? items.map(x => `
      <article class="item">
        <p class="q">${esc(x.question)}</p>
        ${(x.entries || []).map(e => `<div><p class="hand">${esc(e.text)}</p><p class="by">${esc(e.label || nm(e.who))}</p></div>`).join("")}
        <div class="tools"><span class="by">${fmtTs(x.createdAt)}</span>${confirmRow("capsule", x.id)}</div>
      </article>`).join("") : empty("L'album attend son premier souvenir", "Jouez au mode « Notre histoire » et gardez vos réponses, ou ajoutez un souvenir à la main."));
  } else if (seg === "mots") {
    const items = byDate(cap.filter(x => x.kind === "mot" || x.kind === "anecdote"));
    body = `<div class="row"><button class="btn" data-a="sheet" data-name="mot" data-kind="mot">Écrire un petit mot</button><button class="btn ghost" data-a="sheet" data-name="mot" data-kind="anecdote">Noter une anecdote</button></div>` + (items.length ? items.map(x => `
      <article class="item">
        <span class="badge">${x.kind === "mot" ? "Petit mot" : "Anecdote"}</span>
        <p class="hand">${esc(x.text)}</p>
        <div class="tools"><span class="by">${x.kind === "mot" ? "De" : "Racontée par"} ${esc(nm(x.from))} · ${fmtTs(x.createdAt)}</span>${confirmRow("capsule", x.id)}</div>
      </article>`).join("") : empty("Aucun petit mot pour l'instant", "Un mot doux, une blague, une anecdote que vous ne voulez pas oublier : tout a sa place ici."));
  } else if (seg === "favoris") {
    const items = byDate(Store.cols.favoris).filter(f => CARDS[f.id]);
    body = items.length ? items.map(f => { const c = CARDS[f.id], m = CAT[c.cat]; return `
      <article class="item" style="${cvar(m.c)}">
        <span class="badge">${m.glyph} ${esc(m.label)}</span>
        <p class="t">${esc(c.text)}</p>
        <div class="tools"><button class="btn c" data-a="replay" data-id="${c.id}">Jouer cette carte</button><button class="link" data-a="fav" data-id="${c.id}">Retirer des favoris</button></div>
      </article>`; }).join("") : empty("Pas encore de favoris", "Touchez l'étoile ☆ sur une carte pendant une partie pour la retrouver ici.");
  } else {
    const defis = cap.filter(x => x.kind === "defi").map(x => ({ ...x, _t: "Défi relevé" }));
    const avs = Store.cols.aventures.filter(a => a.statut === "realisee").map(x => ({ ...x, text: x.title, _t: "Aventure réalisée" }));
    const items = byDate([...defis, ...avs]);
    body = items.length ? items.map(x => `
      <article class="item">
        <span class="badge">${x._t}</span>
        <p class="t">${esc(x.text)}</p>
        <div class="tools"><span class="by">${fmtTs(x.doneAt || x.createdAt)}</span>${x.kind === "defi" ? confirmRow("capsule", x.id) : ""}</div>
      </article>`).join("") : empty("Rien de coché pour l'instant", "Les défis relevés et les aventures réalisées viendront se ranger ici.");
  }
  return `
  <header class="top"><h1 class="logo">Notre <span>capsule</span></h1></header>
  <p class="hello">Les réponses, les mots et les moments qu'on veut garder.</p>
  <div class="seg" role="group" aria-label="Rubriques de la capsule">${segs}</div>
  <div class="stack">${body}</div>`;
}
function empty(title, txt) { return `<div class="empty"><strong>${esc(fr(title))}</strong><p>${esc(fr(txt))}</p></div>`; }

}

}

/* ───────────────────────── Vues : calque ───────────────────────── */
function layerHead(title, back) {
  return `<div class="g-head"><button class="icon-btn" data-a="${back || "close-layer"}" aria-label="Fermer">×</button><div class="g-prog"></div></div>${title ? `<h1 class="sheet-title">${esc(title)}</h1>` : ""}`;
}

function setupView() {
  const s = S.setup, m = MODES[s.mode];
  const chip = (k, v, label, extra = "") => `<button class="chip" aria-pressed="${s[k] === v}" data-a="setup" data-k="${k}" data-v="${v}" ${extra}>${esc(label)}</button>`;
  const n = cardCount(s.mode, s.dur, s.style);
  const perCard = Math.round((s.dur * 60) / n);
  const pace = perCard >= 90 ? `environ ${Math.round(perCard / 60 * 2) / 2} min par carte` : `environ ${Math.round(perCard / 5) * 5} s par carte`;
  return `
  ${layerHead("")}
  <section class="setup-hero" style="${cvar(m.c)}"><span class="g" aria-hidden="true">${ico(MODE_ICON[s.mode])}</span><h1>${esc(m.title)}</h1><p>${esc(fr(m.desc))}</p></section>
  ${s.mode === "questions" ? `<div class="stack"><h2 class="sec">Catégorie</h2><div class="chips">${QCATS.map(([k, l]) => chip("cat", k, l)).join("")}</div></div>` : ""}
  ${s.mode === "surprise" ? `<div class="stack"><h2 class="sec">Votre humeur</h2><div class="chips">${MOODS.map(x => chip("mood", x.k, x.label)).join("")}</div></div>` : ""}
  <div class="stack"><h2 class="sec">Durée</h2><div class="chips">${[5, 10, 20, 30].map(d => chip("dur", d, d + " min")).join("")}</div></div>
  <div class="stack"><h2 class="sec">Façon de jouer</h2>
    <div class="opts" style="${cvar(m.c)}">
      <button class="opt" aria-pressed="${s.style === "partage"}" data-a="setup" data-k="style" data-v="partage"><b>Mode partagé</b><span>Un seul téléphone, posé entre vous. On répond à voix haute, chacun son tour.</span></button>
      <button class="opt" aria-pressed="${s.style === "secret"}" data-a="setup" data-k="style" data-v="secret"><b>Réponses secrètes</b><span>Chacun écrit ou vote en cachette, un écran masque la réponse, puis on révèle tout ensemble.</span></button>
      ${Store.backend === "shared"
        ? `<button class="opt" aria-pressed="${s.style === "distance"}" data-a="setup" data-k="style" data-v="distance"><b>À distance</b><span>${esc(fr("Chacun sur son téléphone, même loin l'un de l'autre. Les réponses s'affichent en direct sur vos deux écrans."))}</span></button>`
        : `<button class="opt" disabled aria-disabled="true"><b>À distance</b><span>${esc(fr(Shared.available() ? "Créez d'abord votre espace commun dans les Réglages." : "Deux téléphones reliés : prévu pour une prochaine version."))}</span></button>`}
    </div>
  </div>
  ${rulesHtml(setupRules(s), "Comment on joue")}
  <p class="small muted">${n} cartes · ${pace}${s.mode === "qui" ? " · ça va vite, c'est voulu" : ""}</p>
  <button class="btn wide c" style="${cvar(m.c)}" data-a="start">C'est parti</button>`;
}

function cardHtml(c, g) {
  const m = CAT[c.cat];
  const fav = isFav(c.id);
  let forLine = "";
  if (g) {
    if (g.flow === "guess") forLine = c.type === "devinette" ? `${esc(nm(g.T))} demande à ${esc(nm(other(g.T)))} :` : `Question pour ${esc(nm(g.T))}`;
    else if (g.flow === "both") forLine = "Pour vous deux";
    else if (g.flow === "idea") forLine = "À imaginer ensemble";
    else if (g.flow === "pick") forLine = "Votez en secret";
  }
  const meta = c.type === "defi" ? `<div class="meta"><span class="badge">${DUREE[c.duree]}</span><span class="badge">${BUDGET[c.budget]}</span><span class="badge">${LIEU[c.lieu]}</span></div>` : "<span></span>";
  return `<article class="card" style="${cvar(m.c)}">
    <header class="card-band"><span class="suit" aria-hidden="true">${m.glyph}</span><span>${esc(m.label)}</span><span class="tone">${c.custom ? "Carte de " + esc(nm(c.from)) : c.type === "defi" ? AMB[c.amb] : TONE[c.tone]}</span>
      <button class="fav" data-a="fav" data-id="${c.id}" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${fav ? "★" : "☆"}</button></header>
    <div class="card-body">${forLine ? `<p class="card-for">${forLine}</p>` : ""}<p class="card-text">${esc(c.text)}</p></div>
    <footer class="card-foot">${meta}<span class="flip" aria-hidden="true">${m.glyph}</span></footer>
  </article>`;
}
const rulesHtml = (list, title = "Les règles") => `<div class="panel"><h2 class="sec">${title}</h2><ol class="rules">${list.map(r => `<li>${esc(fr(r))}</li>`).join("")}</ol></div>`;
function setupRules(s) {
  const joker = "Le joker est toujours là : on passe une carte sans avoir à se justifier.";
  if (s.style === "distance") {
    const d = {
      questions: ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Chacun écrit de son côté, sur son téléphone : la prédiction pour l'un, la vraie réponse pour l'autre.", "Dès que vous avez répondu tous les deux, les réponses s'affichent en même temps sur vos deux écrans.", "Ensuite, parlez-en : en appel, en vocal ou par message."],
      qui: ["Une affirmation s'affiche sur vos deux téléphones.", "Chacun vote de son côté pour la personne qui correspond le mieux. On a le droit de voter pour soi.", "Les deux votes s'affichent ensemble, puis vous plaidez votre cause.", "Pas de points, pas de classement : seulement des fous rires."],
      histoire: ["Chaque carte est une question pour vous deux. Chacun écrit sa réponse sur son téléphone.", "Les réponses s'affichent ensemble dès que vous avez répondu tous les deux.", "Pour garder vos réponses dans l'album, chacun doit dire oui de son côté."],
      etsi: ["Chaque carte propose un scénario. Chacun écrit son idée sur son téléphone.", "Les idées s'affichent ensemble. Celle qui vous plaît peut rejoindre « Notre prochaine aventure »."],
      surprise: ["Le jeu pioche dans tous les modes selon votre humeur.", "Chacun répond ou vote sur son téléphone, et tout s'affiche en même temps chez vous deux."]
    }[s.mode] || [];
    return [...d, "La partie apparaît aussi sur l'autre téléphone : il suffit de toucher « Rejoindre la partie » sur l'accueil.", "N'importe lequel de vous deux peut passer à la carte suivante.", joker];
  }
  const sec = s.style === "secret";
  const r = {
    questions: sec
      ? ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine écrit sa prédiction en cachette, puis passe le téléphone.", "L'autre écrit sa vraie réponse, toujours en cachette.", "Vous révélez les deux en même temps, puis chacun explique son choix."]
      : ["À chaque carte, l'un de vous répond à la question, l'autre devine sa réponse. Les rôles alternent.", "Celui ou celle qui devine annonce sa prédiction à voix haute.", "L'autre donne sa vraie réponse.", "Vous en parlez : d'où vient la prédiction, qu'est-ce qui surprend ?"],
    qui: sec
      ? ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Chacun vote en cachette pour la personne qui correspond le mieux. On a le droit de voter pour soi.", "Les deux votes sont révélés ensemble, puis vous plaidez votre cause.", "Pas de points, pas de classement : seulement des fous rires."]
      : ["Une affirmation s'affiche, par exemple « Qui s'endort en premier devant un film ? ».", "Lancez le compte à rebours : à « Pointez ! », chacun pointe du doigt la personne qui correspond le mieux. On a le droit de se désigner.", "Vous plaidez votre cause, exemples à l'appui.", "Pas de points, pas de classement : seulement des fous rires."],
    histoire: [sec ? "Chaque carte est une question pour vous deux. Chacun écrit sa réponse en cachette, puis vous révélez ensemble." : "Chaque carte est une question pour vous deux. Chacun répond à voix haute, à son tour.",
      "Prenez votre temps : ici, on raconte plus qu'on ne répond.", "Si vous êtes d'accord tous les deux, vous gardez vos réponses dans l'album."],
    etsi: [sec ? "Chaque carte propose un scénario. Chacun écrit son idée en cachette, puis vous les découvrez ensemble." : "Chaque carte propose un scénario. Imaginez la réponse ensemble, chacun apporte ses idées.",
      "Une idée vous donne vraiment envie ? Ajoutez-la à « Notre prochaine aventure » pour la vivre en vrai."],
    surprise: ["Le jeu pioche dans tous les modes (questions, devinettes, votes, souvenirs, scénarios, petits défis), selon votre humeur.", "Chaque carte affiche ses propres consignes, étape par étape."]
  }[s.mode] || [];
  return [...r, "Le joker est toujours là : on passe une carte sans avoir à se justifier."];
}
const instr = (label, txt) => `<div class="instr"><b>${esc(label)}</b><p>${txt}</p></div>`;
const skipLink = () => `<div class="joker"><button class="link" data-a="g-skip">Joker : on passe cette carte, sans explication</button></div>`;
const nextBtn = (label = "Carte suivante") => `<button class="btn wide" data-a="g-next">${label}</button>`;

function elapsed() {
  if (!S.game) return "";
  const s = Math.floor((Date.now() - S.game.startAt) / 1000);
  return Math.floor(s / 60) + ":" + pad(s % 60);
}

function gameView() {
  const g = S.game;
  if (g.phase === "end") return endView();
  const c = CARDS[g.deck[g.i]];
  const single = g.deck.length === 1;
  const head = `<div class="g-head"><button class="icon-btn" data-a="g-quit" aria-label="Quitter la partie">×</button>
    <div class="g-prog">${single ? "<span>Une carte, juste pour vous</span>" : `<span>Carte ${g.i + 1} sur ${g.deck.length}</span><div class="bar"><i style="width:${(g.i / g.deck.length) * 100}%"></i></div>`}</div>
    <span class="g-timer" id="g-timer">${elapsed()}</span></div>`;
  const last = g.i + 1 >= g.deck.length;
  const nextLabel = last ? "Terminer la partie" : "Carte suivante";
  const slots = slotsOf(g);
  const col = cvar(CAT[c.cat].c);

  // Réponses secrètes : masquage puis saisie, emplacement par emplacement.
  if (g.phase === "hand") {
    const s = slots[g.slot];
    return head + `<section class="curtain" style="${col}">
      <p>Passe le téléphone à</p><p class="who">${esc(nm(s.who))}</p>
      <p>${esc(nm(other(s.who)))}, on détourne les yeux le temps ${s.kind === "pick" ? "du vote" : "de la réponse"}.</p>
      <button class="btn" data-a="g-iam">C'est moi, ${esc(nm(s.who))}</button></section>` + skipLink();
  }
  if (g.phase === "input") {
    const s = slots[g.slot];
    if (s.kind === "pick") {
      return head + cardHtml(c, g) + `<div class="stack" style="${col}"><p class="lbl">${esc(nm(s.who))}, ton vote secret :</p>
        <div class="pickers"><button class="btn c" data-a="g-pick" data-v="a">${esc(nm("a"))}</button><button class="btn c" data-a="g-pick" data-v="b">${esc(nm("b"))}</button></div></div>` + skipLink();
    }
    const id = `ans-${g.i}-${g.slot}`;
    return head + cardHtml(c, g) + `<div class="field"><label for="${id}">${esc(nm(s.who))} · ${esc(s.label)}</label>
      <textarea class="hand" id="${id}" data-d placeholder="Quelques mots suffisent…">${dv(id)}</textarea></div>
      <button class="btn wide" data-a="g-submit">Valider en secret</button>` + skipLink();
  }
  if (g.phase === "ready") {
    return head + `<section class="curtain" style="${col}"><p class="who">Tout est prêt</p>
      <p>Installez-vous côte à côte. Les réponses vont apparaître en même temps.</p>
      <button class="btn" data-a="g-reveal">Révéler ensemble</button></section>` + skipLink();
  }
  if (g.phase === "reveal") return head + cardHtml(c, g) + revealView(g, c, slots, nextLabel);

  // Mode partagé et défis.
  if (g.flow === "guess") {
    const T = esc(nm(g.T)), G = esc(nm(other(g.T)));
    if (g.phase === "g") return head + cardHtml(c, g) + instr("Étape 1 · la prédiction", `${G}, devine ce que ${T} va répondre et dis-le à voix haute.`) + `<button class="btn wide" data-a="g-step" data-v="t">Prédiction faite</button>` + skipLink();
    if (g.phase === "t") return head + cardHtml(c, g) + instr("Étape 2 · la vraie réponse", `${T}, à toi de répondre, en toute sincérité.`) + `<button class="btn wide" data-a="g-step" data-v="talk">Réponse donnée</button>` + skipLink();
    return head + cardHtml(c, g) + instr("Étape 3 · on en parle", esc(g.talk) + MISS) + afterActions(g, c) + nextBtn(nextLabel);
  }
  if (g.flow === "pick") {
    if (g.phase === "count") return head + cardHtml(c, g) + instr("Vote à main levée", "Au signal, pointez du doigt en même temps la personne qui correspond le mieux.") + `<button class="btn wide" data-a="g-count">Lancer le compte à rebours</button>` + skipLink();
    if (g.phase === "counting") return head + cardHtml(c, g) + `<p class="count" style="${col}" aria-live="assertive">${g.count > 0 ? g.count : "Pointez !"}</p>`;
    return head + cardHtml(c, g) + instr("Alors, d'accord ?", esc(g.talk)) + nextBtn(nextLabel);
  }
  if (g.flow === "both") {
    const ia = `both-${g.i}-a`, ib = `both-${g.i}-b`;
    return head + cardHtml(c, g) + instr("À vous", "Répondez chacun votre tour, à voix haute. Notez quelques mots si vous voulez garder ce souvenir dans l'album.") + `
      <div class="field"><label for="${ia}">${esc(nm("a"))}</label><textarea class="hand" id="${ia}" data-d placeholder="Facultatif">${dv(ia)}</textarea></div>
      <div class="field"><label for="${ib}">${esc(nm("b"))}</label><textarea class="hand" id="${ib}" data-d placeholder="Facultatif">${dv(ib)}</textarea></div>
      <div class="actions">${albumCtl(g, "g-album-shared")}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  if (g.flow === "idea") {
    const id = `idea-${g.i}`;
    return head + cardHtml(c, g) + instr("À vous", "Chacun lance une idée, puis construisez la meilleure version ensemble.") + `
      <div class="field"><label for="${id}">Notre idée</label><textarea class="hand" id="${id}" data-d placeholder="Facultatif">${dv(id)}</textarea></div>
      <div class="actions">${g.saved.idea ? `<p class="small muted">Ajoutée à « Notre prochaine aventure » ✓</p>` : `<button class="btn ghost wide" data-a="g-idea-shared">Ajouter à nos aventures</button>`}${nextBtn(nextLabel)}</div>` + skipLink();
  }
  // Défi
  return head + cardHtml(c, g) + instr(c.duree <= 15 ? "Maintenant ?" : "À programmer", c.duree <= 15 ? "Ce défi se relève tout de suite. Ou gardez-le pour plus tard." : "Ce défi demande un peu de temps : ajoutez-le à vos aventures pour le planifier.") + `
    <div class="actions"><div class="row">
      ${g.saved.done ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${col}" data-a="g-defi-done">Défi relevé</button>`}
      ${g.saved.later ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="g-defi-later">Pour plus tard</button>`}
    </div>${nextBtn(nextLabel)}</div>`;
}

function revealView(g, c, slots, nextLabel) {
  const col = cvar(CAT[c.cat].c);
  let body = "";
  if (g.flow === "pick") {
    const a = g.ans.a, b = g.ans.b;
    body = `<div class="reveal" style="${col}">
      <div class="rv"><b>${esc(nm("a"))} a voté</b><p class="pick">${esc(nm(a))}</p></div>
      <div class="rv"><b>${esc(nm("b"))} a voté</b><p class="pick">${esc(nm(b))}</p></div></div>
      <p class="verdict" style="${col}">${a === b ? `Même vote : c'est ${esc(nm(a))} !` : "Avis partagés… à vous de plaider !"}</p>
      ${instr("On en discute", esc(g.talk))}`;
  } else {
    body = `<div class="reveal">${slots.map(s => `<div class="rv"><b>${g.flow === "guess" ? (s.key === "guess" ? "Prédiction de " + esc(nm(s.who)) : "Réponse de " + esc(nm(s.who))) : esc(nm(s.who))}</b><p class="ans">${esc(g.ans[s.key])}</p></div>`).join("")}</div>`;
    if (g.flow === "guess") body += instr("On en parle", esc(g.talk) + MISS);
    if (g.flow === "both") body += instr("On en parle", "Qu'est-ce qui vous touche ou vous surprend dans la réponse de l'autre ?");
    if (g.flow === "idea") body += instr("On rêve un peu", "Laquelle de ces idées a envie de devenir réalité ?");
  }
  return body + afterActions(g, c) + nextBtn(nextLabel);
}

// Ce qu'on écrit en secret peut être intime : on ne le garde que si les deux sont d'accord.
function albumCtl(g, act) {
  if (g.saved.album) return `<p class="small muted">Gardé dans l'album ✓</p>`;
  if (g.saved.ask) return `<div class="confirm"><span>Vous êtes d'accord tous les deux pour garder ça ?</span><button class="btn" data-a="${act}">Oui, on garde</button><button class="btn ghost" data-a="g-album-no">Non, on laisse filer</button></div>`;
  return `<button class="btn ghost wide" data-a="g-album-ask">Garder dans l'album</button>`;
}
function afterActions(g, c) {
  const out = [];
  const canAlbum = c.cat === "his" && (g.flow === "both" || (g.flow === "guess" && g.style === "secret"));
  if (canAlbum) out.push(albumCtl(g, "g-album"));
  if (g.flow === "idea" && g.phase === "reveal") {
    ["a", "b"].forEach(k => out.push(g.saved["idea" + k] ? `<p class="small muted">Idée de ${esc(nm(k))} ajoutée aux aventures ✓</p>` : `<button class="btn ghost wide" data-a="g-idea" data-v="${k}">Ajouter l'idée de ${esc(nm(k))} aux aventures</button>`));
  }
  return out.length ? `<div class="actions">${out.join("")}</div>` : "";
}

/* Navigateur des défis (mode 3) */
function filteredDefis() {
  const f = S.df;
  return POOL.def.filter(id => {
    const c = CARDS[id];
    if (f.duree === "court" && c.duree > 5) return false;
    if (f.duree === "moyen" && (c.duree <= 5 || c.duree > 30)) return false;
    if (f.duree === "long" && c.duree < 60) return false;
    if (f.budget !== "all" && c.budget !== +f.budget) return false;
    if (f.amb !== "all" && c.amb !== f.amb) return false;
    if (f.lieu !== "all" && c.lieu !== f.lieu && c.lieu !== "x") return false;
    return true;
  });
}
function drawDefi() {
  const list = filteredDefis();
  if (!list.length) { S.dfCur = null; return; }
  const seen = seenSet(), pool = list.filter(id => id !== S.dfCur);
  const fresh = pool.filter(id => !seen.has(id) && !S.dfSeen.includes(id));
  S.dfCur = pickOne(fresh.length ? fresh : (pool.length ? pool : list));
  if (!S.dfSeen.includes(S.dfCur)) S.dfSeen.push(S.dfCur);
}
function defisView() {
  const f = S.df, list = filteredDefis();
  if (!S.dfCur || !list.includes(S.dfCur)) drawDefi();
  const chip = (k, v, l) => `<button class="chip" aria-pressed="${f[k] === v}" data-a="df" data-k="${k}" data-v="${v}">${esc(l)}</button>`;
  const c = S.dfCur && CARDS[S.dfCur];
  const saved = S.dfSaved || {};
  return `${layerHead("")}
  <section class="setup-hero" style="${cvar(3)}"><span class="g" aria-hidden="true">${ico("flag")}</span><h1>Les défis complices</h1><p>Filtrez selon le temps, le budget et l'envie, puis tirez un défi.</p></section>
  ${rulesHtml(["Choisissez vos filtres : durée, budget, ambiance et lieu.", "Un défi est tiré au hasard parmi ceux qui correspondent. « Tirer un autre défi » pour en changer.", "« Défi relevé » le range dans votre capsule, « Pour plus tard » l'ajoute à vos aventures."], "Comment on joue")}
  <div class="stack"><h2 class="sec">Durée</h2><div class="chips">${chip("duree", "all", "Toutes")}${chip("duree", "court", "5 min")}${chip("duree", "moyen", "15 à 30 min")}${chip("duree", "long", "Une soirée")}</div></div>
  <div class="stack"><h2 class="sec">Budget</h2><div class="chips">${chip("budget", "all", "Tous")}${BUDGET.map((b, i) => chip("budget", String(i), b)).join("")}</div></div>
  <div class="stack"><h2 class="sec">Ambiance</h2><div class="chips">${chip("amb", "all", "Toutes")}${Object.entries(AMB).map(([k, l]) => chip("amb", k, l)).join("")}</div></div>
  <div class="stack"><h2 class="sec">Où ?</h2><div class="chips">${chip("lieu", "all", "Peu importe")}${chip("lieu", "m", "À la maison")}${chip("lieu", "s", "On sort")}</div></div>
  <p class="small muted">${list.length} défi${list.length > 1 ? "s" : ""} correspond${list.length > 1 ? "ent" : ""} à vos envies.</p>
  ${c ? cardHtml(c) + `<div class="actions"><div class="row">
      ${saved[c.id + "done"] ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${cvar(3)}" data-a="df-done">Défi relevé</button>`}
      ${saved[c.id + "later"] ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="df-later">Pour plus tard</button>`}
    </div><button class="btn line wide" data-a="df-draw">Tirer un autre défi</button></div>
    <details><summary>Voir la liste des ${list.length} défis</summary><ul class="dlist">${list.map(id => `<li><button data-a="df-pick" data-id="${id}">${esc(CARDS[id].text)}</button></li>`).join("")}</ul></details>`
    : empty("Aucun défi ne coche toutes ces cases", "Assouplissez un filtre pour en voir d'autres.")}`;
}

function startArc(game) {
  const A = { game, i: 0, score: 0, count: 0, first: Math.random() < 0.5 ? "a" : "b" };
  if (game === "tp") { A.deck = shuffle(TP.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "flags") { A.deck = shuffle(FLAGS.map((_, i) => i)).slice(0, 10); A.phase = "show"; }
  else if (game === "onde") { A.deck = shuffle(SPECTRA.map((_, i) => i)).slice(0, 6); ondeRound(A); }
  else if (game === "synchro") { A.prompt = pickOne(SYNC); A.round = 1; A.phase = "think"; }
  A.start = A.phase; A.phase = "rules";
  S.arc = A;
}
const turnOf = A => (A.i % 2 === 0 ? A.first : other(A.first));
function ondeRound(A) { A.target = 5 + Math.floor(Math.random() * 91); A.guess = 50; A.pts = 0; A.phase = "hand"; }
function arcCount(next) {
  const A = S.arc; A.phase = "count"; A.count = 3; A.after = next;
  const tick = () => {
    if (S.arc !== A || A.phase !== "count") return;
    A.count--;
    if (A.count < 0) { A.phase = next; render(true); return; }
    render(true); setTimeout(tick, A.count === 0 ? 1000 : 800);
  };
  setTimeout(tick, 800);
}
function specHtml(A, showTarget, showNeedle) {
  const band = (w, cls) => `<i class="band ${cls}" style="left:${A.target}%;width:${w * 2}%"></i>`;
  return `<div class="spec" aria-hidden="true">${showTarget ? band(16, "b2") + band(10, "b3") + band(4, "b4") : ""}${showNeedle ? `<i class="needle" id="needle" style="left:${A.guess}%"></i>` : ""}</div>`;
}
const curtainHtml = (col, pre, who, sub, act) => `<section class="curtain" style="${col}"><p>${pre}</p><p class="who">${esc(nm(who))}</p><p>${sub}</p><button class="btn" data-a="${act}">C'est moi, ${esc(nm(who))}</button></section>`;

function arcadeView() {
  const A = S.arc, col = cvar(7);
  if (!A) return `${layerHead("")}
    <section class="setup-hero" style="${col}"><span class="g" aria-hidden="true">${ico("gamepad")}</span><h1>Arcade</h1><p>${esc(fr("Quatre mini-jeux rapides, à jouer côte à côte. Ici, on gagne ensemble ou on rit ensemble."))}</p></section>
    ${Store.backend === "shared" ? `<div class="stack"><h2 class="sec">Où jouez-vous ?</h2><div class="chips"><button class="chip" aria-pressed="${!S.arcRemote}" data-a="arc-where" data-v="">Sur ce téléphone</button><button class="chip" aria-pressed="${!!S.arcRemote}" data-a="arc-where" data-v="1">À distance, chacun sur son téléphone</button></div></div>` : ""}
    <div class="list" style="${col}">${Object.entries(ARCADE).map(([k, g]) => `<button class="mode-row" data-a="arc-start" data-g="${k}"><span class="icon-tile">${ico(ARC_ICON[k])}</span><span class="mode-txt"><b>${esc(fr(g.title))}</b><span>${esc(fr(g.desc))}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`;
  const G = ARCADE[A.game], total = A.deck ? A.deck.length : 0;
  const prog = A.game === "synchro" ? `<span>${esc(G.title)} · manche ${A.round}</span>`
    : `<span>${esc(fr(G.title))} · ${Math.min(A.i + 1, total)} sur ${total}</span><div class="bar"><i style="width:${(A.i / total) * 100}%"></i></div>`;
  const right = A.game === "onde" ? `<span class="g-timer">${A.score} pt${A.score > 1 ? "s" : ""}</span>` : "";
  const head = `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog">${prog}</div>${right}</div>`;
  const endScr = (big, txt) => `<div class="g-head"><button class="icon-btn" data-a="arc-menu" aria-label="Retour aux mini-jeux">×</button><div class="g-prog"><span>${esc(fr(G.title))}</span></div></div>
    <div class="stack" style="text-align:center;justify-items:center;padding-top:24px"><p class="end-big">${esc(fr(big))}</p><p>${esc(fr(txt))}</p></div>
    <div class="actions"><button class="btn wide c" style="${col}" data-a="arc-replay">Rejouer</button><button class="btn line wide" data-a="arc-menu">Autres mini-jeux</button></div>`;
  const countHtml = `<p class="count" style="${col}" aria-live="assertive">${A.count > 0 ? A.count : fr("Dites-le !")}</p>`;
  if (A.phase === "rules") return head + rulesHtml(G.rules) + `<button class="btn wide c" style="${col}" data-a="arc-begin">C'est parti</button>`;

  if (A.game === "tp" || A.game === "flags") {
    if (A.phase === "end") return endScr("C'était la dernière !", "Un choix vous a surpris ? C'est le bon moment pour en reparler.");
    const q = A.game === "tp"
      ? `<div class="duel"><div class="side" style="${cvar(5)}">${esc(TP[A.deck[A.i]][0])}</div><span class="ou">ou</span><div class="side" style="${cvar(6)}">${esc(TP[A.deck[A.i]][1])}</div></div>`
      : `<p class="flag-q">${esc(FLAGS[A.deck[A.i]])}</p><div class="flag-pair"><div style="background:var(--m3);color:var(--on-m3)">Green flag</div><div style="background:var(--m1);color:var(--on-m1)">Red flag</div></div>`;
    if (A.phase === "count") return head + q + countHtml;
    if (A.phase === "say") return head + q + instr(fr(A.game === "tp" ? "Pas le même choix ?" : "Pas d'accord ?"),
      esc(fr(A.game === "tp" ? "Vingt secondes chacun pour convaincre l'autre. La mauvaise foi est autorisée." : "Plaidez votre cause. Les exemples vécus comptent double.")))
      + `<button class="btn wide" data-a="arc-next">${A.i + 1 >= total ? "Terminer" : "Suivant"}</button>`;
    return head + q + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="say">3, 2, 1… répondez ensemble</button><div class="joker"><button class="link" data-a="arc-next">Passer</button></div>`;
  }

  if (A.game === "onde") {
    if (A.phase === "end") {
      const max = total * 4, r = A.score / max;
      return endScr(`${A.score} / ${max}`, r >= 0.75 ? "Télépathie confirmée." : r >= 0.5 ? "Vous êtes clairement sur la même fréquence." : r >= 0.25 ? "Quelques parasites sur la ligne, mais de très bons indices." : "La fréquence se cherche encore. Les indices, eux, étaient mémorables.");
    }
    const [L, R] = SPECTRA[A.deck[A.i]], g = turnOf(A), o = other(g);
    const labels = `<div class="spec-labels"><span>← ${esc(L)}</span><span>${esc(R)} →</span></div>`;
    if (A.phase === "hand") return head + curtainHtml(col, "Passe le téléphone à", g, `${esc(nm(o))}, ne regarde pas : ${esc(nm(g))} va découvrir la cible.`, "onde-iam");
    if (A.phase === "target") return head + specHtml(A, true, false) + labels
      + instr("Ton indice", esc(fr(`Trouve un exemple (un objet, un film, une situation…) qui se place pile dans la zone foncée, entre « ${L} » et « ${R} ». Dis-le à voix haute, une seule fois.`)))
      + `<button class="btn wide" data-a="onde-hide">J'ai mon indice : cacher la cible</button>`;
    if (A.phase === "guess") return head + specHtml(A, false, true) + labels
      + `<label class="lbl" for="onde-g">${esc(nm(o))}, place l'aiguille d'après l'indice de ${esc(nm(g))}</label><input type="range" id="onde-g" min="0" max="100" step="1" value="${A.guess}">`
      + `<button class="btn wide c" style="${col}" data-a="onde-ok">Valider</button>`;
    const msg = ["Raté… mais l'indice valait le détour.", "", "Pas loin !", "Tout près !", "En plein dans le mille !"][A.pts];
    return head + specHtml(A, true, true) + labels + `<p class="verdict" style="${col}">+${A.pts} point${A.pts > 1 ? "s" : ""} · ${esc(fr(msg))}</p>`
      + `<button class="btn wide" data-a="onde-next">${A.i + 1 >= total ? "Voir le score" : "Manche suivante"}</button>`;
  }

  if (A.game === "synchro") {
    if (A.phase === "win") return endScr("Synchro !", `Le même mot en ${A.round} manche${A.round > 1 ? "s" : ""}. Vos cerveaux se sont trouvés.`);
    if (A.phase === "lost") return endScr("Presque…", "Pas de synchro cette fois, mais quel chemin pour y arriver. On retente ?");
    const box = `<div class="panel" style="text-align:center;${col}">${A.round === 1
      ? `<p class="card-for">Pensez chacun, sans rien dire, à…</p><p class="big-word">${esc(A.prompt)}</p>`
      : `<p class="card-for">Manche ${A.round}</p><p class="big-word" style="font-size:1.6rem">Un mot qui relie vos deux derniers mots</p>`}</div>`;
    if (A.phase === "count") return head + box + countHtml;
    if (A.phase === "said") return head + box + `<p class="lbl" style="text-align:center">${esc(fr("Alors, le même mot ?"))}</p><div class="actions"><div class="row"><button class="btn c" style="${col}" data-a="sync-same">Même mot !</button><button class="btn ghost" data-a="sync-diff">Pas encore</button></div></div>`;
    return head + box + instr("Comment jouer", esc(fr(A.round === 1
      ? "Au signal, dites votre mot en même temps. Si ce n'est pas le même, retenez les deux : à la manche suivante, chacun cherche un mot qui les relie."
      : "Retenez les deux mots qui viennent d'être dits, et cherchez chacun dans votre tête un mot qui fait le lien.")))
      + `<button class="btn wide c" style="${col}" data-a="arc-count" data-v="said">3, 2, 1… dites-le</button>`;
  }

  return "";
}
