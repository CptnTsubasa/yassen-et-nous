    <nav class="nav" aria-label="Navigation"><div class="nav-in">${tabs.map(([k, l]) => `<button data-a="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("")}</div></nav>`;
  app.inert = !!S.layer;
  if (!("inert" in HTMLElement.prototype)) { if (S.layer) app.setAttribute("aria-hidden", "true"); else app.removeAttribute("aria-hidden"); }
  document.documentElement.classList.toggle("ys-paused", !!S.layer);
  if (S.tab === "home" && !S.layer) YJ.daily();
  layerHistory();
  questBurst();
  const cel = celebrationMsg(), celKey = todayStr() + ":" + cel;
  if (cel && !S.layer && S.celebrated !== celKey && lsGet("entre-nous:celebrated") !== celKey) { S.celebrated = celKey; lsSet("entre-nous:celebrated", celKey); setTimeout(() => { Buddies.celebrate(cel); Sfx.play("fanfare"); }, 1400); }
  sigCheck();
  if (!S.layer) { layer.innerHTML = ""; return; }
  const key = S.layer.type + (S.game ? S.game.i + S.game.phase : "")
    + (S.arc ? S.arc.game + S.arc.i + S.arc.phase + (S.arc.round || "") : "")
    + (S.layer.type === "conte" && S.cx ? S.cx.view + (S.cx.id || "") + (cxStory() ? cxSteps(cxStory()).length : "") + (cxBusy() || S.cx.pitching ? "b" : "") + (S.cx.ri || "") : "")
    + (S.layer.type === "live" && Live.state ? "lv" + Live.state.startAt + (Live.state.i || 0) + (Live.state.node || "") + (Live.state.round || "") : "") + (S.story ? S.story.id + S.story.node + S.story.phase : "");
  const prev = layer.firstElementChild, keep = prev && prev.dataset.key === key ? prev.scrollTop : 0, fresh = !prev;
  const fsel = focusSel();
  let html = "";
  if (S.layer.type === "setup") html = setupView();
  else if (S.layer.type === "game") html = (S.game && S.game.askQuit ? `<div class="confirm" role="alert"><span>Quitter la partie ?</span><button class="btn" data-a="g-quit">Quitter</button><button class="btn ghost" data-a="g-stay">Continuer</button></div>` : "") + gameView();
  else if (S.layer.type === "defis") html = defisView();
  else if (S.layer.type === "sheet") html = sheetView();
  else if (S.layer.type === "arcade") html = arcadeView();
  else if (S.layer.type === "story") html = storyView();
  else if (S.layer.type === "puzzle") html = puzzleView();
  else if (S.layer.type === "live") html = liveView();
  else if (S.layer.type === "tresors") html = tresorsView();
  else if (S.layer.type === "onboard") html = onboardView();
  else if (S.layer.type === "conte") html = conteView();
  layer.innerHTML = `<div class="layer" role="dialog" aria-modal="true" tabindex="-1" data-key="${esc(key)}"><div class="wrap">${html}</div></div>`;
  layer.firstElementChild.scrollTop = keep;
  const chat = document.getElementById("yj-chat"); if (chat) chat.scrollTop = chat.scrollHeight;
  // Un écran qui s'ouvre prend le focus (lecteurs d'écran, clavier) ; sinon on rend le focus là où il était.
  if (fresh) { try { layer.firstElementChild.focus({ preventScroll: true }); } catch (e) { /* facultatif */ } } else focusBack(fsel);
  questBurst();
}

/* ───────────────────────── Actions ───────────────────────── */
function favToggle(id) {
  const c = CARDS[id]; if (!c) return;
  if (isFav(id)) { Store.remove("favoris", id); toast("Retirée des favoris"); }
  else { Store.put("favoris", id, { cardId: id, createdAt: Date.now() }); toast("Ajoutée aux favoris"); }
}
function addAventure(title, extra) {
  Store.add("aventures", { title: title.slice(0, 200), budget: "À définir", duree: "À définir", statut: "afaire", ...extra });
  toast("Ajoutée à « Notre prochaine aventure »");
}
function defiAventure(c) {
  addAventure(c.text.replace(/ /g, " "), { budget: ["Gratuit", "Moins de 20 €", "À définir"][c.budget], duree: c.duree >= 60 ? "Une soirée" : "Une heure", source: c.id });
}
function defiDone(c, day) {
  Store.add("capsule", { kind: "defi", text: c.text, cardId: c.id, ...(day ? { day } : {}) });
  toast("Défi relevé, bravo à vous deux");
}

  if (S.game && S.game.phase === "counting") S.game.phase = "talk";
  if (S.arc && S.arc.phase === "count") S.arc.phase = S.arc.after;
  S.pzRemote = false; S.pzUnsub = null;
  splash();
  if (!render(true) && Store.cacheKey()) {
    // La copie gardée sur ce téléphone empêche l'affichage : on la jette, l'espace commun la renverra.
    try { localStorage.removeItem(Store.cacheKey()); } catch (e) { /* stockage indisponible */ }
    Store.cols = emptyCols();
    Store.meta = JSON.parse(JSON.stringify(DEFAULT_META));
    render(true);
  }
  Store.connect().catch(e => { console.error(e); Store.ready = true; render(true); });
  // Hors ligne : l'appli s'ouvre depuis le téléphone, et les changements partent au retour du réseau.
  if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("offline", () => toast("Hors ligne : tout reste lisible, vos changements partiront au retour du réseau."));
  window.addEventListener("online", () => { toast("De retour en ligne"); Notify.flush(); if (Shared.code() && !Store.db) Store.retrySoon(true); });
  setInterval(() => { document.documentElement.setAttribute("data-sky", skyNow()); Jeu.applyTheme(); }, 300000);
  // À minuit : nouvelles quêtes, saison, anniversaire… l'accueil se met à jour tout seul.
  const atMidnight = () => { const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5); setTimeout(() => { render(); atMidnight(); }, m - n); };
  atMidnight();
  document.addEventListener("visibilitychange", () => {
    document.documentElement.classList.toggle("ys-hidden", document.hidden);
    if (!document.hidden) { Buddies.wake(); render(); Update.check(true); }
  });
  Update.check(false);
  setInterval(() => Update.check(false), 30 * 60000);
  Store.connect().then(() => setTimeout(() => { Push.refresh(); Notify.flush(); }, 3000));
  // Une notification qui n'a pas pu partir (réseau, service occupé) est retentée chaque minute.
  setInterval(() => Notify.flush(), 60000);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
