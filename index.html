      talk: "Racontez-lui votre rencontre, chacun votre version, comme si c'était la première fois.",
      ch: [["Lui raconter votre rencontre", "fin_chalet"]] },
    fin_concert: { end: "Le concert sous les étoiles", t: "Le lendemain soir, sur une place de village, le musicien vous dédie un morceau. Vous dansez maladroitement au milieu des pavés, et c'est parfait." },
    fin_crique: { end: "La crique sans nom", t: "Une plage minuscule, rien que pour vous. Vous gravez vos initiales sur un galet et le cachez entre deux rochers. Rendez-vous dans un an pour le retrouver ?" },
    fin_inconnu: { end: "La gare sans nom", t: "Vous descendez sur un quai désert, entre un champ de tournesols et une boulangerie qui ouvre. Personne ne saura jamais où vous étiez ce week-end. C'était un peu le but." },
    fin_cafe: { end: "Le café face à la mer", t: "Croissants, soleil, mouettes un peu trop curieuses. {a} dévoile enfin le programme du week-end, et {b} découvre que tout a été pensé jusqu'au moindre détail." },
    fin_plongeon: { end: "Le plongeon", t: "L'eau est glaciale. Vous criez, vous riez, vous ressortez en courant. Ce sera la photo préférée de l'année." },
    fin_luge: { end: "La grande descente", t: "Trois descentes, deux chutes dans la poudreuse, un fou rire qui résonne dans toute la vallée. Quand le train repart, vous avez les joues rouges et zéro regret." },
    fin_chalet: { end: "L'histoire au coin du feu", t: "La vieille dame vous écoute, les yeux brillants. En partant, elle vous glisse une petite clé : « Pour quand vous reviendrez. » Vous reviendrez." }
  } },
  { id: "manoir", title: "Le manoir des énigmes", mood: "Mystère · fous rires", c: 4, start: "hall", nodes: {
    hall: { t: "Un orage vous oblige à vous abriter dans un manoir perdu en pleine campagne. La porte s'ouvre toute seule. Sur la table du hall, deux bougies et un mot écrit à la plume : « Bienvenue. Pour repartir, trouvez ce que ce manoir a de plus précieux. »",
      ch: [["Explorer la bibliothèque", "biblio"], ["Monter au grenier", "grenier"], ["Fouiller la cuisine, parce qu'on a faim", "cuisine"]] },
    biblio: { t: "Des milliers de livres, et un seul rangé à l'envers. À l'intérieur, une devinette : « Plus on le partage, plus il grandit. Qu'est-ce que c'est ? »",
      talk: "Cherchez la réponse ensemble avant de choisir.",
      ch: [["« Le bonheur »", "passage"], ["« Un fou rire »", "passage"], ["« Une pizza »", "trappe"]] },
    trappe: { t: "Un rire sinistre résonne… puis se transforme en vrai fou rire. Une voix lointaine : « Réponse incorrecte, mais pas totalement fausse. » Une trappe s'ouvre sous vos pieds, et vous atterrissez en douceur sur une pile de coussins, dans la cuisine.",
      ch: [["Explorer la cuisine", "cuisine"]] },
    passage: { t: "Une étagère pivote et révèle un passage éclairé par des lucioles. Au bout, deux chemins : un escalier qui descend vers une musique douce, et un couloir couvert de portraits qui semblent vous suivre du regard.",
      ch: [["Descendre vers la musique", "bal"], ["Traverser le couloir des portraits", "portraits"]] },
    grenier: { t: "Le grenier déborde de vieilles malles. L'une d'elles porte deux prénoms gravés dans le bois : {a} et {b}. Impossible. Pourtant, elle est bien là, fermée par un cadenas à trois chiffres.",
      talk: "Quel code à trois chiffres pourrait raconter quelque chose de votre histoire ?",
      ch: [["Essayer un code tiré de votre histoire", "malle"], ["Tenter 1-2-3, on ne sait jamais", "costumes"]] },
    malle: { t: "Clic. Le cadenas cède. À l'intérieur : une boîte à musique, un vieil appareil photo et une lettre qui commence par « Cher futur nous… ».",
      ch: [["Lire la lettre", "fin_lettre"], ["Prendre une photo avec le vieil appareil", "fin_photo"]] },
    costumes: { t: "Clic. Ça marche. Vraiment ? Le manoir a manifestement de l'humour. La malle contient deux costumes de bal et un carton d'invitation : « Ce soir, au sous-sol. Tenue de rigueur. »",
      ch: [["Enfiler les costumes", "bal"], ["Refermer la malle et redescendre", "cuisine"]] },
    cuisine: { t: "La cuisine sent la cannelle. Un livre de recettes est ouvert sur le plan de travail : « Gâteau du manoir. À préparer à deux, sinon il ne lève pas. » Le four est déjà chaud.",
      ch: [["Préparer le gâteau ensemble", "fin_gateau"], ["Goûter la pâte crue en douce", "pate"]] },
    pate: { t: "Délicieux. Beaucoup trop délicieux. En quelques cuillerées, la moitié du saladier a disparu. Le manoir pousse un long soupir : « Bon. Plan B. » La porte du jardin s'ouvre.",
      ch: [["Sortir dans le jardin", "fin_jardin"]] },
    bal: { t: "Une salle de bal illuminée, vide, avec un orchestre de vieux automates. Ils se mettent à jouer dès que vous entrez. Une plaque au mur indique : « Le trésor se trouve au centre de la piste. »",
      talk: "Si une chanson devait jouer à ce moment précis, laquelle choisiriez-vous ?",
      ch: [["Danser jusqu'au centre de la piste", "fin_bal"]] },
    portraits: { t: "Les portraits chuchotent sur votre passage. Le dernier cadre est vide, avec un petit écriteau : « Réservé ». Un chevalet, deux pinceaux et de la peinture vous attendent.",
      ch: [["Faire le portrait l'un de l'autre", "fin_portrait"]] },
    fin_lettre: { end: "La lettre du futur", t: "« Cher futur nous, si vous lisez ceci, c'est que vous avez continué à jouer ensemble. Ne changez rien. » Dehors, l'orage se calme. Vous repartez avec la lettre, et l'envie d'en écrire une vraie." },
    fin_photo: { end: "Le cliché", t: "Le flash crépite. Sur la photo qui sort de l'appareil, c'est bien vous… mais en noir et blanc, dans le même manoir, cent ans plus tôt. Le trésor, c'était ce souvenir-là." },
    fin_gateau: { end: "Le gâteau qui lève", t: "Vous mesurez, vous mélangez, vous mettez de la farine partout et vous débattez gentiment de la quantité de sucre. Le gâteau lève, doré, parfait. Le trésor du manoir, c'était ça : faire les choses à deux." },
    fin_jardin: { end: "Le jardin sous la pluie", t: "La pluie est tiède. Vous courez dans les allées en riant, encore un peu de pâte au coin des lèvres. Le manoir vous laisse partir : il a eu son spectacle." },
    fin_bal: { end: "La valse des automates", t: "Au centre de la piste, il n'y a rien. Juste vous deux, le souffle un peu court, qui continuez à danser. Les automates applaudissent en grinçant. Vous avez compris." },
    fin_portrait: { end: "Les portraits ratés", t: "Vos portraits sont ratés, vraiment ratés. Mais une fois accrochés au mur, ils ont quelque chose que les autres n'ont pas : ils sourient. Les grandes portes du manoir s'ouvrent." }
  } },
  { id: "boulangerie", title: "La boulangerie de minuit", mood: "Douceur · un brin de magie", c: 6, start: "lettre", nodes: {
    lettre: { t: "Une lettre de notaire vous apprend une nouvelle étonnante : vous héritez ensemble d'une petite boulangerie, rue des Lilas. Une seule condition : elle n'ouvre qu'à minuit, et chacune de ses pâtisseries exauce un tout petit vœu.",
      ch: [["Ouvrir dès ce soir", "minuit"], ["Lire d'abord le carnet de recettes", "carnet"]] },
    carnet: { t: "Le carnet est couvert d'annotations. « Croissant de l'audace : donne du courage pour une heure. Éclair du fou rire : à servir avec précaution. Chou de la mémoire : fait revivre un souvenir heureux. »",
      talk: "Si vous pouviez goûter l'une de ces pâtisseries maintenant, laquelle choisiriez-vous ?",
      ch: [["Goûter le chou de la mémoire", "chou"], ["Ouvrir la boutique, carnet sous le bras", "minuit"]] },
    chou: { t: "Une bouchée, et vous voilà de retour au jour de votre premier rendez-vous, comme dans un film. Vous vous voyez hésiter, sourire, chercher vos mots, et vous remarquez des détails que vous aviez oubliés.",
      talk: "Quel détail de votre premier rendez-vous vous revient en premier ?",
      ch: [["Revenir à la boulangerie", "minuit"]] },
    minuit: { t: "Minuit sonne. La clochette tinte : votre premier client est un vieux monsieur très élégant. Il cherche « quelque chose pour trouver le courage d'inviter sa voisine à prendre un café ».",
      ch: [["Lui servir le croissant de l'audace", "audace"], ["Lui conseiller d'offrir la pâtisserie plutôt que de la manger", "offrir"]] },
    audace: { t: "Il croque, se redresse et repart d'un pas décidé. Dix minutes plus tard, des applaudissements résonnent dans la rue. Deuxième cliente : une petite fille en pyjama qui n'arrive pas à dormir.",
      ch: [["Lui préparer un chocolat chaud nuage", "nuage"], ["Lui raconter une histoire pendant que la fournée cuit", "conte"]] },
    offrir: { t: "Il revient une heure plus tard, au bras de sa voisine, pour acheter deux parts de tarte. « Elle a dit oui à un deuxième café ! » Le bouche-à-oreille fait son effet : une file se forme devant la vitrine.",
      ch: [["Agrandir la boulangerie", "fin_grande"], ["Garder la boutique petite et secrète", "fin_secret"]] },
    nuage: { t: "Le chocolat flotte littéralement au-dessus de la tasse. La petite fille rit si fort que tout le quartier se réveille… et descend voir ce qui se passe.",
      ch: [["Improviser une fête dans la rue", "fin_fete"]] },
    conte: { t: "Vous inventez une histoire à deux voix : {a} commence une phrase, {b} la termine. La petite fille s'endort sur le comptoir, et sa mère vient la chercher avec un sourire reconnaissant.",
      talk: "Essayez pour de vrai : une minute d'histoire à deux voix, une phrase chacun.",
      ch: [["Fermer la boutique pour la nuit", "fin_aube"]] },
    fin_grande: { end: "La boulangerie des Lilas", t: "Un an plus tard, la file d'attente fait le tour du pâté de maisons. Vous avez gardé une recette rien que pour vous, celle que vous préparez chaque dimanche." },
    fin_secret: { end: "Le secret de minuit", t: "La boutique reste minuscule, connue seulement de celles et ceux qui en ont vraiment besoin. C'est votre secret, et vous le gardez précieusement." },
    fin_fete: { end: "La fête en pyjama", t: "Tout le quartier en pyjama, des chaises sur le trottoir, des chocolats nuages pour tout le monde. Vous dansez entre les tables jusqu'aux premières lueurs du jour." },
    fin_aube: { end: "La dernière fournée", t: "Au petit matin, vous partagez le dernier croissant, côte à côte sur le pas de la porte. Il n'exauce aucun vœu particulier. Vous n'en aviez pas besoin." }
  } },
  { id: "cupidon", title: "Cupidon.exe", mood: "Drôle · très 2026", c: 5, start: "app", nodes: {
    app: { sc: "salon", t: "Vendredi soir. Pour une fois, vous n'organisez rien : vous laissez Cupidon.exe, l'appli dont tout le monde parle, planifier votre soirée. Elle promet « le rendez-vous parfait, calculé par intelligence artificielle ». Premier message : « Bonsoir {a} et {b}. J'ai analysé vos 4 000 derniers messages. Petite question : vous préférez la surprise ou la sécurité ? »",
      talk: "Pour de vrai : vous préférez être surpris par l'autre, ou savoir à l'avance ce qui vous attend ?",
      ch: [["« La surprise ! »", "surprise"], ["« La sécurité, merci. »", "rassure"]] },
    surprise: { sc: "salon", t: "L'appli réfléchit trois secondes, puis : « Parfait. J'ai réservé un restaurant où l'on dîne dans le noir complet. Et j'ai déjà commandé pour vous. » Un livreur sonne avec deux masques de sommeil et un mot : « Faites-moi confiance. »",
      ch: [["Enfiler les masques et y aller", "noir"], ["Demander ce qu'elle a commandé, au juste", "menu"]] },
    menu: { sc: "salon", t: "« Le chef propose un menu basé sur vos recherches Google. » Vous blêmissez en même temps : vos recherches contiennent, entre autres, « comment cuire des pâtes sans casserole » et « est-ce normal de parler à son ficus ». L'appli ajoute : « Bonne nouvelle : le dessert, c'est du tiramisu. »",
      ch: [["Y aller quand même, par curiosité", "noir"], ["Désinstaller l'appli et improviser", "impro"]] },
    noir: { sc: "noir", t: "Dans le noir complet, on entend des couverts, des rires, et quelqu'un qui cherche son verre depuis dix minutes. Sans la vue, vous découvrez que {a} décrit chaque bouchée comme un critique gastronomique, et que le rire de {b} est encore plus contagieux dans l'obscurité.",
      talk: "Les yeux fermés, à quoi reconnaîtriez-vous l'autre en premier : sa voix, son parfum, son rire ?",
      ch: [["Rester jusqu'au dessert", "fin_tiramisu"]] },
    rassure: { sc: "resto", t: "« Compris. Programme rassurant : un restaurant italien, une balade, et retour avant minuit. » Tout se passe à merveille… jusqu'à ce que l'appli plante au milieu du repas. Sur l'écran, un seul message : « Mise à jour en cours. Improvisez. »",
      ch: [["Respirer un grand coup et improviser", "impro"], ["Attendre la mise à jour devant un deuxième dessert", "maj"]] },
    maj: { sc: "resto", t: "Quarante minutes et deux tiramisus plus tard, l'appli revient : « Désolée. J'ai compris que je ne pouvais pas calculer ce qui vous rend heureux. Vous, si. » Le serveur, qui a tout suivi, vous offre un café : « Ça arrive souvent, ici. »",
      ch: [["Finir la soirée sans aucun écran", "fin_sansecran"]] },
    impro: { sc: "rue", t: "Sans programme, vous marchez au hasard. Un néon rose clignote au bout de la rue : « Karaoké, soirée duos ». Juste à côté, un escalier mène à un toit d'où l'on voit toute la ville.",
      ch: [["Le karaoké, évidemment", "karaoke"], ["Le toit, pour la vue", "toit"]] },
    karaoke: { sc: "karaoke", t: "Le DJ vous tend deux micros. La salle scande déjà vos prénoms, ce qui est étrange puisque personne ne vous connaît. Il ne reste qu'à choisir la chanson.",
      talk: "Pour de vrai : quelle chanson chanteriez-vous en duo, sans la moindre honte ?",
      ch: [["Une grande ballade romantique", "fin_ballade"], ["Le tube le plus ringard possible", "fin_ringard"]] },
    toit: { sc: "toit", t: "Sur le toit, la ville scintille. Vos téléphones affichent 3 % de batterie. Pour la première fois de la soirée, personne ne vous dit quoi faire, et c'est exactement ce qu'il vous fallait.",
      talk: "Qu'est-ce que vous aimeriez vous dire, là, sans écran ni programme ?",
      ch: [["Rester là jusqu'à ce que les téléphones s'éteignent", "fin_toit"]] },
    fin_tiramisu: { end: "Le dîner à l'aveugle", sc: "resto", t: "Quand la lumière revient, vous avez de la sauce jusqu'au coude et le sourire jusqu'aux oreilles. Vous laissez cinq étoiles à l'appli, avec un commentaire : « Bien joué, mais le mérite revient au tiramisu. »" },
    fin_sansecran: { end: "Mise à jour terminée", sc: "toit", t: "Vous rangez les téléphones et finissez la soirée à refaire le monde sur un banc. La meilleure fonctionnalité de Cupidon.exe, finalement, c'était le bouton « Désinstaller »." },
    fin_ballade: { end: "La ballade", sc: "karaoke", t: "Vous chantez faux, mais avec une conviction qui force le respect. À la dernière note, toute la salle allume la lampe de son téléphone. Même l'appli, de loin, aurait applaudi." },
    fin_ringard: { end: "Le tube ringard", sc: "karaoke", t: "Chorégraphie improvisée, refrain hurlé, un inconnu qui vous rejoint au chœur : la vidéo fait le tour du groupe WhatsApp de vos amis avant minuit. Aucun regret." },
    fin_toit: { end: "Batterie 0 %", sc: "toit", t: "Les écrans s'éteignent l'un après l'autre. Il reste la ville, vos deux silhouettes et une conversation qui ne s'arrête plus. Aucune intelligence artificielle n'aurait trouvé mieux." }
  } },
  { id: "viral", title: "Viral malgré nous", mood: "Drôle · réseaux", c: 1, start: "video", nodes: {
    video: { sc: "metro", t: "Un mardi matin, dans le métro, {a} trébuche, rattrape {b} de justesse, et l'instant d'après vous voilà dans une pose digne d'un film de danse. Quelqu'un a filmé. Le soir même, la vidéo affiche deux millions de vues avec la légende : « Ils ont inventé une danse et ils ne le savent pas ».",
      talk: "Pour de vrai : quel moment de votre couple aurait mérité de devenir viral ?",
      ch: [["Assumer et lancer votre propre compte", "compte"], ["Faire profil bas en attendant que ça passe", "profilbas"]] },
    compte: { sc: "phone", t: "Vous créez un compte à deux. Premier défi : lui trouver un nom. Les commentaires réclament déjà un tutoriel de « la danse du métro », et vos téléphones vibrent sans arrêt.",
      talk: "Si vous lanciez un compte à deux, quel serait son nom ?",
      ch: [["Tourner le tutoriel de la danse", "tuto"], ["Répondre aux commentaires un par un", "commentaires"]] },
    tuto: { sc: "salon", t: "Vous tournez le tutoriel quarante-sept fois. À la quarante-huitième prise, vous éclatez de rire en plein milieu, et c'est cette version-là que vous publiez. Le lendemain, une émission de télé vous appelle.",
      ch: [["Accepter de passer à la télé", "plateau"], ["Refuser poliment : on n'est pas des stars", "fin_refus"]] },
    commentaires: { sc: "phone", t: "Au milieu des cœurs et des blagues, un commentaire vous arrête : « Merci, j'avais passé une semaine horrible et vous m'avez fait rire. » Vous vous regardez, la gorge un peu serrée.",
      ch: [["Répondre à cette personne", "fin_merci"], ["Organiser un rendez-vous dansant au parc pour tout le monde", "parc"]] },
    plateau: { sc: "plateau", t: "Sur le plateau, sous les projecteurs, l'animateur vous demande de refaire la danse en direct. Petit problème : aucun de vous deux ne se souvient vraiment des pas.",
      ch: [["Improviser complètement", "fin_direct"], ["Avouer que tout était un accident", "fin_aveu"]] },
    profilbas: { sc: "parc", t: "Vous gardez vos capuches pendant trois jours. Mais au marché, la fromagère vous reconnaît et réclame un selfie. Puis le boulanger. Puis le chien du boulanger, enfin presque.",
      ch: [["Céder et faire la danse au marché", "parc"], ["Partir en week-end loin du réseau", "fin_detox"]] },
    parc: { sc: "parc", t: "Le dimanche, une petite foule vous attend au parc avec une enceinte. Des inconnus, des enfants, une grand-mère en baskets : tout le monde veut apprendre la danse du métro.",
      ch: [["Lancer la musique", "fin_flashmob"]] },
    fin_refus: { end: "Les stars anonymes", sc: "metro", t: "La vidéo finit par se perdre dans le flot. Mais chaque fois que vous prenez le métro, vous échangez un regard complice. Vous savez." },
    fin_merci: { end: "Le commentaire", sc: "phone", t: "Vous lui écrivez un long message. Des mois plus tard, cette personne vous répond qu'elle va mieux. De toute cette histoire, c'est ce message-là que vous gardez." },
    fin_direct: { end: "En direct", sc: "plateau", t: "Vous inventez une chorégraphie entièrement nouvelle, avec un enthousiasme désarmant. L'animateur se joint à vous. Le replay fait encore plus de vues que la vidéo du métro." },
    fin_aveu: { end: "L'aveu", sc: "plateau", t: "« En fait, on a juste failli tomber. » Le public éclate de rire et applaudit. La sincérité devient virale à son tour : on vous surnomme « le couple le plus honnête d'internet »." },
    fin_detox: { end: "Zone blanche", sc: "neige", t: "Un gîte sans réseau, une forêt, deux jours sans la moindre notification. Quand vous rentrez, plus personne ne parle de la vidéo. Vous, vous parlez encore de ce week-end." },
    fin_flashmob: { end: "La danse du métro", sc: "parc", t: "Cinquante personnes dansent la danse du métro dans le parc, et personne ne la fait pareil. C'est un joyeux désordre, et c'est exactement ce que vous êtes." }
  } },
  { id: "villa", title: "La villa des cœurs", mood: "Parodie de télé-réalité", c: 6, start: "arrivee", nodes: {
    arrivee: { sc: "villa", t: "Par un enchaînement de circonstances que personne ne comprend vraiment, vous voilà dans une émission de télé-réalité pour couples : « La villa des cœurs ». Piscine à débordement, caméras partout, et un animateur au sourire beaucoup trop blanc qui annonce la première épreuve.",
      ch: [["Foncer : on est là pour gagner", "epreuve"], ["Rester discrets et observer les autres couples", "observer"]] },
    epreuve: { sc: "villa", t: "Première épreuve : répondre en même temps à une question sur l'autre. « Quel est le plat préféré de votre partenaire ? » Vous avez trois secondes.",
      talk: "Faites l'épreuve pour de vrai : chacun dit en même temps le plat préféré de l'autre. Trois, deux, un…",
      ch: [["Bonne réponse des deux côtés !", "confession"], ["Réponses complètement différentes", "confession"]] },
    observer: { sc: "villa", t: "Au bord de la piscine, un couple se dispute pour savoir qui a laissé le frigo ouvert. Un autre répète une chorégraphie depuis six heures du matin. Vous vous regardez : vous êtes clairement le couple le plus normal de la villa.",
      ch: [["Aider le couple du frigo à se réconcilier", "mediation"], ["Filer au confessionnal pour tout commenter", "confession"]] },
    mediation: { sc: "villanuit", t: "Vous jouez les médiateurs. Résultat : le couple se réconcilie, la production adore, et on vous surnomme « les psys de la villa ». Le soir venu, l'animateur vous annonce une surprise.",
      ch: [["Découvrir la surprise", "plage"]] },
    confession: { sc: "confession", t: "Au confessionnal, face caméra, chacun doit dire en dix secondes ce qu'il préfère chez l'autre. Interdiction de se concerter.",
      talk: "Pour de vrai : dix secondes chacun pour dire ce que vous préférez chez l'autre.",
      ch: [["Jouer le jeu sincèrement", "plage"], ["Faire une déclaration digne d'un grand drame télévisé", "drame"]] },
    drame: { sc: "confession", t: "Musique dramatique, gros plan, larme imaginaire : votre confession est si théâtrale que l'équipe technique pleure de rire derrière la caméra. Le producteur vous propose votre propre émission.",
      ch: [["Accepter : la gloire nous attend", "fin_star"], ["Refuser : on préfère la vraie vie", "plage"]] },
    plage: { sc: "plage", t: "Dernier soir. Un dîner vous attend sur la plage, au coucher du soleil. L'animateur annonce le grand final : chaque couple doit décider s'il reste pour gagner le trophée, ou s'il part maintenant, main dans la main.",
      ch: [["Rester jusqu'au trophée", "fin_trophee"], ["Partir maintenant, loin des caméras", "fin_depart"]] },
    fin_star: { end: "Les stars du prime", sc: "plateau", t: "Votre émission s'appelle « Drama à deux ». Elle dure une saison, fait beaucoup rire, et vous laisse une immense collection de bêtisiers que vous regardez encore les soirs de pluie." },
    fin_trophee: { end: "Le trophée en plastique", sc: "villanuit", t: "Vous remportez un trophée en forme de cœur, légèrement en plastique. Il trône désormais chez vous, à côté d'une photo de vous deux en peignoir de la villa." },
    fin_depart: { end: "Hors caméra", sc: "plage", t: "Vous retirez les micros, laissez les caméras derrière vous et marchez le long de l'eau. Personne ne saura jamais ce que vous vous êtes dit ce soir-là. C'était le meilleur moment de l'émission." }
  } },
  { id: "festival", title: "Le festival sous les étoiles", mood: "Romantique · été", c: 4, start: "entree", nodes: {

  const st = STORY[s.id], n = st.nodes[s.node], col = cvar(st.c);
  const head = `<div class="g-head"><button class="icon-btn" data-a="st-menu" aria-label="Retour aux histoires">×</button><div class="g-prog"><span>${esc(st.title)}</span></div><span class="g-timer">${n.end ? "Fin" : "Chapitre " + s.steps}</span></div>`;
  if (n.end) {
    const [f, t] = endCount(st);
    return head + storyStage(st, s.node) + `<article class="story-page end" style="${col}"><p class="card-for">Fin</p><h2 class="sheet-title">${esc(fr(n.end))}</h2><p class="story-text">${stx(n.t)}</p></article>
      <p class="small muted" style="text-align:center">Fins découvertes dans cette histoire : ${f} sur ${t}</p>
      <div class="actions">${s.saved ? `<p class="small muted">Gardée dans l'album ✓</p>` : `<button class="btn ghost wide" data-a="st-album">Garder cette fin dans l'album</button>`}
        <button class="btn wide c" style="${col}" data-a="st-open" data-id="${st.id}">${f < t ? "Rejouer pour trouver une autre fin" : "Rejouer l'histoire"}</button>
        <button class="btn line wide" data-a="st-menu">Choisir une autre histoire</button></div>`;
  }
  const page = storyStage(st, s.node) + `<article class="story-page" style="${col}"><p class="story-text">${stx(n.t)}</p></article>` + (n.talk ? instr("Petite pause", stx(n.talk)) : "");
  const who = s.slot === 0 ? "a" : "b";
  if (s.phase === "hand") return head + `<section class="curtain" style="${col}"><p>Vote secret · passe le téléphone à</p><p class="who">${esc(nm(who))}</p><p>${esc(nm(other(who)))}, on détourne les yeux.</p><button class="btn" data-a="st-iam">C'est moi, ${esc(nm(who))}</button></section>`;
  if (s.phase === "pick") return head + page + `<div class="stack"><p class="lbl">${esc(nm(who))}, ton choix secret :</p>${n.ch.map((c, i) => `<button class="choice" data-a="st-vote" data-v="${i}">${stx(c[0])}</button>`).join("")}</div>`;
  if (s.phase === "agree" || s.phase === "coin") {
    const c = n.ch[s.phase === "agree" ? s.votes.a : s.coin];
    return head + page + `<p class="verdict" style="${col}">${s.phase === "agree" ? "Même choix !" : `Le hasard a parlé : ce sera le choix de ${esc(nm(s.coinWho))}.`}</p><div class="choice mine" style="${col}">${stx(c[0])}</div><button class="btn wide c" style="${col}" data-a="st-go" data-to="${c[1]}">Continuer l'histoire</button>`;
  }
  if (s.phase === "disagree") return head + page + `<p class="verdict" style="${col}">Pas le même choix…</p>
    <div class="reveal">${["a", "b"].map(k => `<div class="rv"><b>${esc(nm(k))} a choisi</b><p>${stx(n.ch[s.votes[k]][0])}</p></div>`).join("")}</div>
    ${instr("À vous de négocier", "Chacun défend son choix en une phrase, puis vous décidez. Ou vous laissez le hasard trancher.")}
    <div class="actions">${["a", "b"].map(k => `<button class="btn ghost wide" data-a="st-go" data-to="${n.ch[s.votes[k]][1]}">On suit le choix de ${esc(nm(k))}</button>`).join("")}<button class="btn line wide" data-a="st-coin">Pile ou face</button></div>`;
  if (n.ch.length === 1) return head + page + `<button class="btn wide c" style="${col}" data-a="st-go" data-to="${n.ch[0][1]}">${stx(n.ch[0][0])}</button>`;
  if (S.storyStyle === "secret" && !s.together) return head + page + `<div class="stack"><p class="lbl">Les choix possibles</p>${n.ch.map(c => `<div class="choice ro">${stx(c[0])}</div>`).join("")}</div>
    <button class="btn wide c" style="${col}" data-a="st-vote-start">Voter en secret</button><div class="joker"><button class="link" data-a="st-together">Pour ce choix, on décide ensemble</button></div>`;
  return head + page + `<div class="stack"><p class="lbl">Décidez ensemble</p>${n.ch.map(c => `<button class="choice" data-a="st-go" data-to="${c[1]}">${stx(c[0])}</button>`).join("")}</div>`;
}

// Les données partagées ne sont jamais injectées telles quelles : seule une image encodée est acceptée.
const pzStored = () => { const v = (Store.meta.puzzle || {}).img || ""; return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : ""; };
const pzImage = () => pzStored() || PZ_IMG;
function pzUpload(file) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const side = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement("canvas");
    cv.width = cv.height = 640;
    cv.getContext("2d").drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, 640, 640);
    URL.revokeObjectURL(url);
    let data = cv.toDataURL("image/jpeg", 0.82);
    if (data.length > 200000) data = cv.toDataURL("image/jpeg", 0.6);
    Store.setMeta("puzzle", { img: data }); render(true); toast("Le portrait de Yassen Jr. est en place");
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast("Cette image n'a pas pu être lue. Essaie avec une capture d'écran en JPEG ou PNG."); };
  im.src = url;
}
function startPuzzle() {
  const n = S.pzSize || 3, N = n * n;
  let order;
  do { order = shuffle([...Array(N).keys()]); } while (order.every((p, i) => p === i));
  S.pz = { n, order, sel: null, moves: 0, startAt: Date.now(), done: false, turn: Math.random() < 0.5 ? "a" : "b", peek: false };
}
/* Puzzle à distance : la partie vit dans l'espace commun (live/puzzle) et chaque téléphone
   l'affiche en direct. Seule la personne dont c'est le tour peut échanger deux pièces. */
const pzMe = () => { const v = lsGet("entre-nous:me"); return v === "a" || v === "b" ? v : ""; };
// L'état vient de la base partagée : on ne garde qu'un puzzle bien formé.
function pzValid(L) {
  if (!L || typeof L !== "object" || ![3, 4, 5].includes(L.n) || !Array.isArray(L.order)) return null;
  const N = L.n * L.n, o = L.order;
  if (o.length !== N || new Set(o).size !== N || o.some(p => !Number.isInteger(p) || p < 0 || p >= N)) return null;
  return { n: L.n, order: o.slice(), turn: L.turn === "b" ? "b" : "a", moves: +L.moves || 0, startAt: +L.startAt || Date.now(), done: !!L.done, time: +L.time || 0 };
}
function pzGrid(n, order, sel, done, act, img) {
  const pos = p => `${((p % n) / (n - 1)) * 100}% ${(Math.floor(p / n) / (n - 1)) * 100}%`;
  return `<div class="pz${done ? " solved" : ""}" style="--n:${n};--pz:url('${img}')">${order.map((p, i) => `<button style="background-position:${pos(p)}" data-a="${act}" data-i="${i}" aria-pressed="${sel === i}" aria-label="Pièce ${i + 1}"${done ? " disabled" : ""}></button>`).join("")}</div>`;
}
function pzRemoteOpen() {
  if (S.pzUnsub || !Store.db) return;
  S.pzUnsub = Store.db.doc("live/puzzle").onSnapshot(s => { S.pzLive = s.exists ? pzValid(s.data()) : null; render(); }, e => Store.fail(e));
}
function pzRemoteClose() {
  if (S.pzUnsub) { try { S.pzUnsub(); } catch (e) { /* déjà fermé */ } }
  S.pzUnsub = null; S.pzRemote = false; S.pzSel = null; S.pzrSetup = false;
}
function pzRemoteView() {
  const img = pzImage(), col = cvar(2), me = pzMe(), L = S.pzLive;
  const head = (right = "") => `<div class="g-head"><button class="icon-btn" data-a="pzr-close" aria-label="Retour">×</button><div class="g-prog"><span>Puzzle à distance${L && !S.pzrSetup ? ` · ${L.n * L.n} pièces` : ""}</span></div>${right}</div>`;
  if (!me) return head() + `<div class="panel" style="text-align:center;${col}"><p class="card-for">Sur ce téléphone…</p><p class="big-word" style="font-size:1.7rem">Qui es-tu ?</p></div>
    <div class="pickers">${["a", "b"].map(k => `<button class="btn c" style="${col}" data-a="pzr-me" data-v="${k}">${esc(nm(k))}</button>`).join("")}</div>
    <p class="small muted" style="text-align:center">${esc(fr("Ce choix reste enregistré sur ce téléphone. Chacun fait le sien sur son propre téléphone."))}</p>`;
  if (!L || S.pzrSetup) {
    const n = S.pzSize || 3;
    return head() + rulesHtml(["Le même puzzle s'affiche en direct sur vos deux téléphones, même à distance.", "Chacun son tour : seule la personne dont c'est le tour peut échanger deux pièces. Le tour passe ensuite à l'autre.", "Lancez la partie depuis un téléphone : elle apparaît aussitôt sur l'autre."], "Comment on joue")
      + `<div class="stack"><h2 class="sec">Nombre de pièces</h2><div class="chips">${[[3, "9 pièces"], [4, "16 pièces"], [5, "25 pièces"]].map(([v, l]) => `<button class="chip" aria-pressed="${n === v}" data-a="pz-size" data-v="${v}">${l}</button>`).join("")}</div></div>
      <button class="btn wide c" style="${col}" data-a="pzr-start">Lancer la partie</button>
      ${L && !L.done ? `<button class="btn line wide" data-a="pzr-resume">Reprendre la partie en cours</button>` : ""}
      <p class="small muted" style="text-align:center">Tu joues en tant que ${esc(nm(me))}. <button class="link" data-a="pzr-me" data-v="">Changer</button></p>`;
  }
  const N = L.n * L.n, placed = L.order.filter((p, i) => p === i).length;
  const right = `<span class="g-timer">${L.moves} échange${L.moves > 1 ? "s" : ""}</span>`;
  if (L.done) {
    const min = Math.max(1, Math.round(L.time / 60000));
    return head(right) + pzGrid(L.n, L.order, null, true, "pzr-tap", img) + `<p class="verdict" style="${col}">Yassen Jr. est de retour !</p>
      <p style="text-align:center">${esc(fr(`Reconstitué à distance en ${L.moves} échanges et environ ${min} minute${min > 1 ? "s" : ""}. Pièce par pièce, comme vous.`))}</p>
      <div class="actions"><button class="btn wide c" style="${col}" data-a="pzr-new">Nouvelle partie</button></div>`;
  }
  const mine = L.turn === me;
  return head(right) + `<p class="lbl" style="text-align:center">${mine ? "À toi de jouer" : `À ${esc(nm(L.turn))} de jouer…`}</p>`
    + (S.pzPeek ? `<img class="pz-img peek" src="${img}" alt="Modèle du puzzle">` : "")
    + `<div style="${mine ? "" : "opacity:.6"}">${pzGrid(L.n, L.order, S.pzSel, false, "pzr-tap", img)}</div>`
    + `<p class="small muted" style="text-align:center">${placed} pièce${placed > 1 ? "s" : ""} bien placée${placed > 1 ? "s" : ""} sur ${N}</p>
      <div class="actions"><div class="row"><button class="btn ghost" data-a="pzr-peek">${S.pzPeek ? "Cacher le modèle" : "Voir le modèle"}</button><button class="btn line" data-a="pzr-new">Nouvelle partie</button></div></div>`;
}
function puzzleView() {

/* ───────────────────────── Parties à distance ─────────────────────────
   Une partie à distance vit dans l'espace commun (live/game) et chaque téléphone l'affiche en
   direct. Chacun n'écrit que sa propre réponse (live/game/ans/<clé>) : répondre en même temps
   n'écrase jamais la réponse de l'autre. Une seule partie à distance à la fois. */
const whoAmI = pzMe;
const Live = {
  state: null, unsub: null, lastStart: 0,
  open() {
    if (this.unsub || !Store.db || Store.backend !== "shared") return;
    this.unsub = Store.db.doc("live/game").onSnapshot(s => {
      const v = s.exists ? s.data() : null;
      this.state = v && typeof v === "object" && ["cards", "arcade", "story"].includes(v.kind) ? v : null;
      const st = this.state;
      if (st && st.startAt !== this.lastStart) {
        if (this.seen && st.by && st.by !== whoAmI() && !st.ended) toast(`${nm(st.by)} a lancé une partie à distance`);
        this.lastStart = st.startAt;
      }
      this.seen = true;
      // L'accord pour l'album est enregistré par un seul téléphone, pour éviter les doublons.
      if (st && st.kind === "cards" && whoAmI() === "a") {
        const sv = st.saved || {};
        if (sv.ok && sv.ok.a && sv.ok.b && !sv.album) liveSaveAlbum(st);
      }
      render();
    }, e => Store.fail(e));
  },
  close() { if (this.unsub) { try { this.unsub(); } catch (e) { /* déjà fermé */ } } this.unsub = null; this.state = null; },
  write(obj) {
    if (!this.state) return;
    for (const k in obj) { if (obj[k] === null) delete this.state[k]; else this.state[k] = obj[k]; }
    Store.db.doc("live/game").update({ ...obj, updatedAt: Date.now() }).catch(e => Store.fail(e));
  },
  answer(path, key, val) {
    if (!this.state) return;
    let o = this.state;
    path.split("/").forEach(p => { if (!o[p] || typeof o[p] !== "object") o[p] = {}; o = o[p]; });
    o[key] = val;
    Store.db.doc("live/game/" + path).update({ [key]: val }).catch(e => Store.fail(e));
    Store.db.doc("live/game").update({ updatedAt: Date.now() }).catch(() => {});
  },
  start(state) {
    const s = { ...state, by: whoAmI() || "a", startAt: Date.now(), updatedAt: Date.now(), ended: false };
    this.state = s; this.lastStart = s.startAt; S.lvRules = null; S.lvGuess = 50;
    Store.db.doc("live/game").set(s).catch(e => Store.fail(e));
    S.layer = { type: "live" };
  },
  active() { const s = this.state; return !!(s && !s.ended && Date.now() - (s.updatedAt || 0) < 12 * 3600 * 1000); }
};
const liveTitle = L => L.kind === "cards" ? (MODES[L.mode] || {}).title || "Partie" : L.kind === "arcade" ? (ARCADE[L.game] || {}).title || "Arcade" : (STORY[L.id] || {}).title || "Histoire";
function liveBanner() {
  if (Store.backend !== "shared" || !Live.active()) return "";
  const L = Live.state;
  return `<section class="panel" style="${cvar(7)};background:var(--c);color:var(--on-c)"><p class="sec" style="color:inherit;opacity:.75">Partie à distance en cours</p>
    <p><b>${esc(fr(liveTitle(L)))}</b>${L.by ? ` · lancée par ${esc(nm(L.by))}` : ""}</p>
    <div class="row"><button class="btn" data-a="lv-join">Rejoindre la partie</button></div></section>`;
}
const liveWaiting = (who, done) => `<p class="small muted" style="text-align:center">${done ? `${esc(nm(who))} a répondu ✓` : `${esc(nm(who))} est en train de répondre…`}</p>`;
const liveSent = `<p class="verdict" style="font-size:1.4rem">Réponse envoyée ✓</p>`;
const liveNorm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "").replace(/s$/, "");

/* Cartes : questions, Qui de nous deux, Notre histoire, Et si on, Surprise */
function startLiveCards(st) {
  const deck = buildDeck({ ...st, style: "secret" });
  if (!deck.length) { toast("Aucune carte ne correspond à ce choix."); return; }
  Live.start({ kind: "cards", mode: st.mode, setup: { mode: st.mode, cat: st.cat, mood: st.mood, dur: st.dur, style: "distance" }, deck, i: 0, first: Math.random() < 0.5 ? "a" : "b" });
}
function liveCard(L) {
  const c = CARDS[(L.deck || [])[L.i]];
  if (!c) return null;
  const flow = flowOf(c, L.mode), T = (L.i % 2 === 0) === (L.first === "a") ? "a" : "b";
  const g = { flow, T, ans: L.ans || {}, saved: L.saved || {} };
  g.talk = (flow === "pick" ? PICK_TALK : GUESS_TALK)[L.i % 5];
  return { c, g, slots: slotsOf(g) };
}
function liveSaveAlbum(L) {
  const x = liveCard(L); if (!x) return;
  const entries = x.slots.map(s => ({ who: s.who, label: x.g.flow === "guess" ? (s.key === "guess" ? `Prédiction de ${nm(s.who)}` : `Réponse de ${nm(s.who)}`) : nm(s.who), text: String(x.g.ans[s.key] || "") }));
  Store.add("capsule", { kind: "souvenir", question: x.c.text, cardId: x.c.id, entries });
  Live.answer("saved", "album", true);
}
function liveCardsView(L, me, head) {
  const col0 = cvar(1);

    <div class="actions"><button class="btn wide c" style="${col0}" data-a="lv-replay">Rejouer</button><button class="btn ghost wide" data-a="close-layer">Retour à l'accueil</button></div>`;
  const x = liveCard(L);
  if (!x) return head + empty("Cette carte n'existe plus", "Passez à la suivante.") + `<button class="btn wide" data-a="lv-next">Carte suivante</button>`;
  const { c, g, slots } = x, col = cvar(CAT[c.cat].c), last = L.i + 1 >= L.deck.length;

  if (g.flow === "defi") return head + cardHtml(c, g) + instr("Défi", c.duree <= 15 ? "Relevez-le dès que vous êtes ensemble, ou gardez-le pour plus tard." : "Ajoutez-le à vos aventures pour le planifier.")
    + `<div class="actions"><div class="row">${g.saved.done ? `<span class="small muted">Relevé ✓</span>` : `<button class="btn c" style="${col}" data-a="lv-defi" data-v="done">Défi relevé</button>`}
      ${g.saved.later ? `<span class="small muted">Dans vos aventures ✓</span>` : `<button class="btn ghost" data-a="lv-defi" data-v="later">Pour plus tard</button>`}</div>${nextB}</div>`;
  const answered = s => g.ans[s.key] != null;
  if (!slots.every(answered)) {

    let box = "";
    if (mine && !answered(mine)) {
      if (mine.kind === "pick") box = `<div class="stack"><p class="lbl">Ton vote :</p><div class="pickers">${["a", "b"].map(k => `<button class="btn c" style="${col}" data-a="lv-pick" data-k="${mine.key}" data-v="${k}">${esc(nm(k))}</button>`).join("")}</div></div>`;
      else {

        box = `<div class="field"><label for="${id}">${esc(mine.label)}</label><textarea class="hand" id="${id}" data-d placeholder="Quelques mots suffisent…">${dv(id)}</textarea></div><button class="btn wide" data-a="lv-submit" data-k="${mine.key}">Envoyer ma réponse</button>`;
      }
    } else if (mine) box = liveSent;
    return head + cardHtml(c, g) + box + slots.filter(s => s.who !== me).map(s => liveWaiting(s.who, answered(s))).join("") + joker;
  }
  let body;
  if (g.flow === "pick") {
    const a = g.ans.a, b = g.ans.b;
    body = `<div class="reveal" style="${col}">${["a", "b"].map(k => `<div class="rv"><b>${esc(nm(k))} a voté</b><p class="pick">${esc(nm(g.ans[k] === "b" ? "b" : "a"))}</p></div>`).join("")}</div>
      <p class="verdict" style="${col}">${a === b ? `Même vote : c'est ${esc(nm(a === "b" ? "b" : "a"))} !` : "Avis partagés… à vous de plaider !"}</p>${instr("On en discute", esc(g.talk))}`;
  } else {

      : `<button class="btn ghost wide" data-a="lv-album-ok">${ok[o] ? esc(fr(`${nm(o)} veut le garder dans l'album. Toi aussi ?`)) : "Garder dans l'album"}</button>`);
  }

  return head + cardHtml(c, g) + body + (out.length ? `<div class="actions">${out.join("")}</div>` : "") + nextB;

/* Arcade */
const ARC_REMOTE_RULES = {
  tp: ["Deux options s'affichent sur vos deux téléphones.", "Chacun choisit la sienne de son côté, sans voir le choix de l'autre.", "Les deux choix apparaissent en même temps. Pas le même ? Défendez le vôtre, en appel, en vocal ou par message.", "Dix dilemmes par partie. Pas de points."],
  flags: ["Une petite manie s'affiche. Elle parle toujours de « quelqu'un », jamais de l'un de vous deux.", "Chacun vote « green » ou « red » de son côté.", "Les deux verdicts apparaissent en même temps. Pas d'accord ? Défendez le vôtre.", "Dix manies par partie. Pas de points."],
  onde: ["Une échelle s'affiche entre deux extrêmes, par exemple « Froid » et « Chaud ».", "Le guide de la manche voit seul où se cache la cible, et écrit un seul indice : un objet, un film ou une situation qui se placerait à cet endroit.", "L'autre reçoit l'indice, déplace l'aiguille et valide.", "Points : 4 en plein dans le mille, 3 tout près, 2 pas loin. Six manches, les rôles alternent, le score est commun."],
  synchro: ["Une catégorie s'affiche, par exemple « Un fruit ».", "Chacun écrit un mot de son côté, sans se concerter.", "Les deux mots apparaissent en même temps. Même mot ? Synchro réussie ! Sinon, à la manche suivante, chacun écrit un mot qui relie les deux derniers.", "Huit manches maximum."]
};
function startLiveArcade(game) {
  const s = { kind: "arcade", game, i: 0, score: 0, first: Math.random() < 0.5 ? "a" : "b" };
  if (game === "tp") s.deck = shuffle(TP.map((_, i) => i)).slice(0, 10);
  else if (game === "flags") s.deck = shuffle(FLAGS.map((_, i) => i)).slice(0, 10);
  else if (game === "onde") { s.deck = shuffle(SPECTRA.map((_, i) => i)).slice(0, 6); s.target = 5 + Math.floor(Math.random() * 91); }
  else { s.game = "synchro"; s.prompt = pickOne(SYNC); s.round = 1; }
  Live.start(s);
}
function liveArcadeView(L, me, head) {
  const col = cvar(7), ans = L.ans || {}, o = other(me), deck = L.deck || [], total = deck.length;
  const endScr = (big, txt) => head + `<div class="stack" style="text-align:center;justify-items:center;padding-top:24px"><p class="end-big">${esc(fr(big))}</p><p>${esc(fr(txt))}</p></div>
    <div class="actions"><button class="btn wide c" style="${col}" data-a="lv-replay">Rejouer</button><button class="btn line wide" data-a="close-layer">Retour à l'accueil</button></div>`;

    }
    const sp = SPECTRA[deck[L.i]] || ["", ""], guide = (L.i % 2 === 0) === (L.first === "a") ? "a" : "b", guesser = other(guide);

    if (ans.guess != null) {
      const g = Math.min(100, Math.max(0, +ans.guess)), d = Math.abs(g - t), pts = d <= 4 ? 4 : d <= 10 ? 3 : d <= 16 ? 2 : 0;

      return head + specHtml({ target: t, guess: g }, true, true) + labels + (ans.clue ? instr(`Indice de ${nm(guide)}`, esc(ans.clue)) : "")

        <button class="btn wide c" style="${col}" data-a="lv-clue">Envoyer l'indice</button>` + score;

  const words = Array.isArray(L.words) ? L.words : [], lastW = words[words.length - 1];

let pendingRender = false;
function render(force) {
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT" || ae.tagName === "SELECT");
  if (!force && typing) { pendingRender = true; return; }
  pendingRender = false;
  rebuildCustom();
  syncMusic();
  Buddies.sync();
  const app =document.getElementById("app"), layer = document.getElementById("layer");
  const views = { home: viewHome, play: viewPlay, capsule: viewCapsule, aventures: viewAventures, lettres: viewLettres };
  const tabs = [["home", "Accueil"], ["play", "Jouer"], ["capsule", "Capsule"], ["aventures", "Aventures"], ["lettres", "Lettres"]];
  if (!views[S.tab]) S.tab = "home";
  const enter = S.tab !== render.lastTab; render.lastTab = S.tab;
  app.innerHTML = `<header class="appbar"><div class="appbar-in"><span class="brand">Y<span>&amp;</span>S</span><span class="row" style="gap:2px"><button class="icon-btn" data-a="sheet" data-name="avatars" aria-label="Nos personnages">${ico("people")}</button><button class="icon-btn" data-a="sheet" data-name="names" aria-label="Réglages">${ICON.gear}</button></span></div></header>
    <main class="wrap${enter ? " enter" : ""}">${views[S.tab]()}</main>
    <nav class="nav" aria-label="Navigation"><div class="nav-in">${tabs.map(([k, l]) => `<button data-a="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("")}</div></nav>`;
  app.inert = !!S.layer;
  if (!S.layer) { layer.innerHTML = ""; return; }
  const key = S.layer.type + (S.game ? S.game.i + S.game.phase : "")
    + (S.arc ? S.arc.game + S.arc.i + S.arc.phase + (S.arc.round || "") : "")
    + (S.layer.type === "live" && Live.state ? "lv" + Live.state.startAt + (Live.state.i || 0) + (Live.state.node || "") + (Live.state.round || "") : "") + (S.story ? S.story.id + S.story.node + S.story.phase : "");
  const prev = layer.firstElementChild, keep = prev && prev.dataset.key === key ? prev.scrollTop : 0;
  let html = "";
  if (S.layer.type === "setup") html = setupView();
  else if (S.layer.type === "game") html = gameView();
  else if (S.layer.type === "defis") html = defisView();
  else if (S.layer.type === "sheet") html = sheetView();
  else if (S.layer.type === "arcade") html = arcadeView();
  else if (S.layer.type === "story") html = storyView();
  else if (S.layer.type === "puzzle") html = puzzleView();
  else if (S.layer.type === "live") html = liveView();
  layer.innerHTML = `<div class="layer" role="dialog" aria-modal="true" data-key="${esc(key)}"><div class="wrap">${html}</div></div>`;
  layer.firstElementChild.scrollTop = keep;
}

    do { order = shuffle([...Array(N).keys()]); } while (order.every((p, i) => p === i));
    const L = { n, order, turn: pzMe() || "a", moves: 0, startAt: Date.now(), done: false, time: 0 };

    if (S.pzSel == null) { S.pzSel = i; return; }
    if (S.pzSel === i) { S.pzSel = null; return; }
    const order = L.order.slice();
    [order[S.pzSel], order[i]] = [order[i], order[S.pzSel]];
    S.pzSel = null;
    const done = order.every((p, k) => p === k);
    const next = { ...L, order, moves: L.moves + 1, turn: other(me), done, time: done ? Date.now() - L.startAt : 0 };
    S.pzLive = next;
    Store.db.doc("live/puzzle").set(next).catch(e => Store.fail(e));
    if (done) { const p = Store.meta.progress; Store.setMeta("progress", { ...p, puzzles: (p.puzzles || 0) + 1 }); }
  },
  "pz-size"(d) { S.pzSize = +d.v; },
  "pz-start"() { startPuzzle(); },
  "pz-harder"() { S.pzSize = Math.min(5, S.pz.n + 1); startPuzzle(); },
  "pz-menu"() { S.pz = null; },
  "pz-peek"() { S.pz.peek = !S.pz.peek; },
  "pz-reset-img"() { Store.setMeta("puzzle", { img: "" }); toast("Retour au portrait d'origine de Yassen Jr."); },
  "pz-tap"(d) {
    const z = S.pz, i = +d.i;
    if (z.done) return;
    if (z.sel === null) { z.sel = i; return; }
    if (z.sel === i) { z.sel = null; return; }
    [z.order[z.sel], z.order[i]] = [z.order[i], z.order[z.sel]];
    z.sel = null; z.moves++; z.turn = other(z.turn);
    if (z.order.every((p, k) => p === k)) {
      z.done = true; z.time = Date.now() - z.startAt;
      const p = Store.meta.progress; Store.setMeta("progress", { ...p, puzzles: (p.puzzles || 0) + 1 });
    }
  },
  "arc-start"(d) { if (S.arcRemote && Store.backend === "shared") startLiveArcade(d.g); else startArc(d.g); },
  "arc-where"(d) { S.arcRemote = d.v === "1"; },
  "arc-begin"() { S.arc.phase = S.arc.start; },
  "arc-menu"() { S.arc = null; },
  "arc-replay"() { startArc(S.arc.game); },
  "arc-count"(d) { arcCount(d.v); },
  "arc-next"() { const A = S.arc; A.i++; A.phase = A.i >= A.deck.length ? "end" : "show"; },
  "onde-iam"() { S.arc.phase = "target"; },
  "onde-hide"() { S.arc.phase = "guess"; },
  "onde-ok"() { const A = S.arc, d = Math.abs(A.guess - A.target); A.pts = d <= 4 ? 4 : d <= 10 ? 3 : d <= 16 ? 2 : 0; A.score += A.pts; A.phase = "reveal"; },
  "onde-next"() { const A = S.arc; A.i++; if (A.i >= A.deck.length) A.phase = "end"; else ondeRound(A); },
  "sync-same"() { S.arc.phase = "win"; },
  "sync-diff"() { const A = S.arc; if (A.round >= 8) A.phase = "lost"; else { A.round++; A.phase = "think"; } },
  "st-style"(d) { S.storyStyle = d.v; },
  "buddies"(d) { lsSet("entre-nous:buddies", d.v); },
  "music"() { Music.toggle(visibleStoryTheme()); },
  "av-who"(d) { S.avWho = d.v; },
  "av-set"(d) {
    const who = S.avWho === "b" ? "b" : "a", cur = { a: avOf("a"), b: avOf("b") };
    cur[who][d.k] = ["skin", "hairColor", "top"].includes(d.k) ? +d.v : d.v;
    Store.setMeta("avatars", cur);
    setTimeout(() => Buddies.react(who), 0);
  },
  "st-open"(d) {
    if (S.storyStyle === "distance" && Store.backend === "shared" && !S.story) { startLiveStory(d.id); return; }
    S.story = { id: d.id, node: STORY[d.id].start, steps: 1, phase: "read", votes: {}, slot: 0 }; },
  "st-menu"() { S.story = null; },
  "st-go"(d) { storyGo(d.to); },
  "st-together"() { S.story.together = true; },
  "st-vote-start"() { Object.assign(S.story, { phase: "hand", slot: 0, votes: {} }); },
  "st-iam"() { S.story.phase = "pick"; },
  "st-vote"(d) {
    const s = S.story; s.votes[s.slot === 0 ? "a" : "b"] = +d.v;
    if (s.slot === 0) { s.slot = 1; s.phase = "hand"; } else s.phase = s.votes.a === s.votes.b ? "agree" : "disagree";
  },
  "st-coin"() { const s = S.story; s.coinWho = Math.random() < 0.5 ? "a" : "b"; s.coin = s.votes[s.coinWho]; s.phase = "coin"; },
  "st-album"() {
    const s = S.story, st = STORY[s.id], n = st.nodes[s.node];
    const plain = n.t.replace(/\{a\}/g, nm("a")).replace(/\{b\}/g, nm("b"));
    Store.add("capsule", { kind: "souvenir", question: fr(st.title + " · " + n.end), entries: [{ who: "a", label: "Notre fin", text: fr(plain) }] });
    s.saved = true; toast("Gardée dans l'album");
  },
  "g-album-ask"() { S.game.saved.ask = true; },
  "g-album-no"() { S.game.saved.ask = false; },
  "g-idea"(d) { const g = S.game, c = CARDS[g.deck[g.i]]; addAventure(g.ans[d.v], { note: c.text.replace(/ /g, " "), source: c.id }); g.saved["idea" + d.v] = true; },
  "g-idea-shared"() {
    const g = S.game, c = CARDS[g.deck[g.i]], id = `idea-${g.i}`, v = (S.drafts[id] || "").trim();
    if (!v) { toast("Notez votre idée pour l'ajouter."); return; }
    addAventure(v, { note: c.text.replace(/ /g, " "), source: c.id }); clearDrafts(id); g.saved.idea = true;
  },
  "g-defi-done"() { const g = S.game; defiDone(CARDS[g.deck[g.i]]); g.saved.done = true; },
  "g-defi-later"() { const g = S.game; defiAventure(CARDS[g.deck[g.i]]); g.saved.later = true; },
  fav(d) { favToggle(d.id); },
  df(d) { S.df[d.k] = d.v; },
  "df-draw"() { drawDefi(); },
  "df-pick"(d) { S.dfCur = d.id; if (!S.dfSeen.includes(d.id)) S.dfSeen.push(d.id); document.querySelector(".layer") && (document.querySelector(".layer").scrollTop = 0); },
  "df-done"() { defiDone(CARDS[S.dfCur]); S.dfSaved[S.dfCur + "done"] = true; },
  "df-later"() { defiAventure(CARDS[S.dfCur]); S.dfSaved[S.dfCur + "later"] = true; },
  "go-album"() { S.tab = "capsule"; S.capSeg = "album"; window.scrollTo(0, 0); },
  "cap-seg"(d) { S.capSeg = d.seg; S.confirm = null; },
  sheet(d) { if (d.kind) S.mot = d.kind; S.layer = { type: "sheet", name: d.name }; },
  "set-draft"(d) { S.drafts[d.k] = d.v; },
  "save-names"() {
    const c = couple();
    const a = draft("na", c.a).trim(), b = draft("nb", c.b).trim();
    if (!a || !b) { toast("Indiquez vos deux prénoms."); return; }
    Store.setMeta("couple", { a, b, style: draft("nstyle", c.style || "partage") });
    clearDrafts("na", "nb", "nstyle"); S.layer = null; toast("C'est noté, " + a + " et " + b);
  },
  "save-mot"() {
    const t = draft("mot-t").trim(); if (!t) { toast("Le mot est encore vide."); return; }
    Store.add("capsule", { kind: S.mot, text: t, from: draft("mot-f", "a") });
    clearDrafts("mot-t", "mot-f"); S.layer = null; S.tab = "capsule"; S.capSeg = "mots"; toast("Rangé dans la capsule");
  },
  "save-souvenir"() {
    const q = draft("sv-q").trim(), t = draft("sv-t").trim(), w = draft("sv-w", "nous");
    if (!q || !t) { toast("Donnez un nom au moment et quelques mots pour le raconter."); return; }
    Store.add("capsule", { kind: "souvenir", question: q, entries: [{ who: w === "nous" ? "a" : w, label: w === "nous" ? "Nous deux" : nm(w), text: t }] });
    clearDrafts("sv-q", "sv-t", "sv-w"); S.layer = null; S.tab = "capsule"; S.capSeg = "album"; toast("Gardé dans l'album");
  },
  "save-av"() {
    const ed = S.editAv && Store.cols.aventures.find(a => a.id === S.editAv);
    const title = draft("av-t", ed ? ed.title : "").trim();
    if (!title) { toast("Décrivez l'activité en quelques mots."); return; }
    const statut = draft("av-s", ed ? ed.statut : "afaire");
    const data = { title, budget: draft("av-b", ed ? ed.budget : "À définir"), duree: draft("av-d", ed ? ed.duree : "À définir"), statut,
      date: statut === "planifiee" ? draft("av-date", ed ? ed.date || "" : "") : "", note: draft("av-n", ed ? ed.note || "" : "").trim() };
    if (statut === "realisee" && !(ed && ed.doneAt)) data.doneAt = Date.now();
    if (ed) Store.update("aventures", ed.id, data); else Store.add("aventures", data);
    clearDrafts("av-t", "av-b", "av-d", "av-s", "av-date", "av-n"); S.layer = null; S.editAv = null; S.tab = "aventures";
    toast(ed ? "Aventure mise à jour" : "Ajoutée à la liste");
  },
  "av-status"(d) {
    const patch = { statut: d.v }; if (d.v === "realisee") patch.doneAt = Date.now();
    Store.update("aventures", d.id, patch);
    if (d.v === "planifiee") { S.editAv = d.id; S.drafts["av-s"] = "planifiee"; S.layer = { type: "sheet", name: "aventure" }; }
  },
  "av-edit"(d) { S.editAv = d.id; S.layer = { type: "sheet", name: "aventure" }; },
  "save-lettre"() {
    const m = draft("le-m").trim(), dte = draft("le-d");
    if (!m) { toast("Le message est encore vide."); return; }
    if (!dte || daysUntil(dte) < 1) { toast("Choisissez une date d'ouverture à partir de demain."); return; }
    Store.add("lettres", { title: draft("le-t").trim(), message: m, from: draft("le-f", "a"), openOn: dte });
    clearDrafts("le-t", "le-m", "le-f", "le-d"); S.layer = null; S.tab = "lettres"; toast("Carte scellée jusqu'au " + fmtDay(dte));
  },
  "save-carte"() {
    const t = draft("cc-t").trim();
    if (!t) { toast("Écris le texte de la carte."); return; }
    const cat = draft("cc-cat", "dec");
    Store.add("cartes", { cat, text: t.slice(0, 280), tone: draft("cc-tone", "l"), from: draft("cc-f", "a"), ...(cat === "def" ? { duree: +draft("cc-dur", "15") } : {}) });
    clearDrafts("cc-t"); toast("Carte ajoutée au paquet");
  },
  "open-letter"(d) { const l = Store.cols.lettres.find(x => x.id === d.id); if (l && daysUntil(l.openOn) <= 0) S.openLetters[d.id] = true; },
  "ask-del"(d) { S.confirm = d.col + ":" + d.id; },
  "cancel-del"() { S.confirm = null; },
  "do-del"(d) { Store.remove(d.col, d.id); S.confirm = null; toast("Supprimé"); }
};
function advanceSlot() {
  const g = S.game, slots = slotsOf(g);
  g.slot++;
  if (TRANSPORTS[g.transport].isComplete(g, slots)) g.phase = "ready";
  else g.phase = "hand";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a]; if (!fn) return;
  e.preventDefault();
  if (Music.ctx && Music.ctx.state === "suspended" && Music.theme) Music.ctx.resume();
  fn(t.dataset, t);
  render(true);
});
document.addEventListener("input", e => {
  if (e.target.matches("[data-d]")) S.drafts[e.target.id] = e.target.value;
  if (e.target.id === "lv-g") {
    S.lvGuess = +e.target.value;
    const n = document.getElementById("needle"); if (n) n.style.left = S.lvGuess + "%";
  }
  if (e.target.id === "onde-g" && S.arc) {
    S.arc.guess = +e.target.value;
    const n = document.getElementById("needle"); if (n) n.style.left = S.arc.guess + "%";
  }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-d]")) S.drafts[e.target.id] = e.target.value;
  if (e.target.id === "pz-file" && e.target.files && e.target.files[0]) pzUpload(e.target.files[0]);
  if (e.target.id === "av-s") render(true);
});
// Un lien d'invitation ouvert alors que le site est déjà affiché ne recharge pas la page.
window.addEventListener("hashchange", () => {
  if (!Shared.available() || !/^#c-/.test(location.hash)) return;
  if (Store.backend === "shared") Store.goLocal();
  Store.connect();
});
document.addEventListener("focusout", () => { setTimeout(() => { if (pendingRender) render(); }, 0); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.layer && S.layer.type !== "game") { ACT["close-layer"](); render(true); } });
setInterval(() => {
  const t = document.getElementById("g-timer"); if (t && S.game) t.textContent = elapsed();
}, 1000);

/* ───────────────────────── Démarrage ───────────────────────── */
function start(data) {
  Store.loadLocal();
  if (data && data.S) S = { ...S, ...data.S };
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ S: JSON.parse(JSON.stringify(S)) })); } catch (e) { /* facultatif */ }
  }
  if (S.game && S.game.phase === "counting") S.game.phase = "talk";
  if (S.arc && S.arc.phase === "count") S.arc.phase = S.arc.after;
  S.pzRemote = false; S.pzUnsub = null;
  render(true);
  Store.connect();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
